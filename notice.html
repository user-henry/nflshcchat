<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js"></script>

<script>const WORKER_API='https://worker.nflshcchat.cc.cd';</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 公告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
        }
        .nav {
            background: var(--bg-secondary);
            padding: 15px 30px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--accent-color);
        }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .logo {
            width: 40px;
            height: 40px;
            background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .nav h2 { font-size: 20px; color: var(--accent-color); }
        .nav a { color: var(--text-primary); text-decoration: none; margin-left: 20px; transition: color 0.3s; }
        .nav a:hover { color: var(--accent-color); }
        
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .notice-list { margin-bottom: 30px; }
        .notice-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }
        .notice-item:hover { transform: translateY(-3px); }
        .notice-title { font-size: 20px; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .notice-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .notice-content {
            color: var(--text-primary);
            line-height: 1.6;
            word-wrap: break-word;
        }
        /* Markdown 样式 */
        .notice-content code {
            background: rgba(0,0,0,0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: var(--text-primary);
        }
        .notice-content pre {
            background: rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .notice-content pre code {
            background: transparent;
            padding: 0;
        }
        .notice-content a {
            color: var(--accent-color);
            text-decoration: none;
        }
        .notice-content a:hover {
            text-decoration: underline;
        }
        .notice-content blockquote {
            border-left: 3px solid var(--accent-color);
            margin: 12px 0;
            padding-left: 16px;
            color: var(--text-secondary);
        }
        .notice-content ul, .notice-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }
        .notice-content h1, .notice-content h2, .notice-content h3 {
            margin: 16px 0 8px 0;
            color: var(--text-primary);
        }
        .notice-content h1 { font-size: 1.6em; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .notice-content h2 { font-size: 1.4em; }
        .notice-content h3 { font-size: 1.2em; }
        .notice-content table {
            border-collapse: collapse;
            margin: 12px 0;
            width: 100%;
        }
        .notice-content th, .notice-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }
        .notice-content th {
            background: var(--bg-tertiary);
            color: var(--accent-color);
        }
        .notice-content img {
            max-width: 100%;
            border-radius: 8px;
        }
        .delete-notice-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .admin-panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--accent-color);
            margin-top: 20px;
        }
        .admin-panel h3 { color: var(--accent-color); margin-bottom: 20px; }
        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
        }
        .admin-panel textarea { resize: vertical; min-height: 200px; }
        .admin-panel button {
            background: var(--accent-color);
            color: var(--bg-primary);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .message.success { background: rgba(46,204,113,0.2); color: var(--success); }
        .message.error { background: rgba(231,76,60,0.2); color: var(--danger); }
        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); background: var(--bg-secondary); border-radius: 12px; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }

        /* 公告操作按钮（仅管理员可见） */
        .notice-meta .delete-notice-btn,
        .notice-meta .edit-notice-btn {
            margin-left: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .notice-meta .delete-notice-btn:hover { border-color: var(--danger); color: var(--danger); }
        .notice-meta .edit-notice-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* 修改公告弹窗 */
        .edit-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .edit-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .edit-modal-content h3 { color: var(--accent-color); margin-bottom: 16px; }
        .edit-modal-content label { display: block; margin: 12px 0 6px; color: var(--text-secondary); font-size: 13px; }
        .edit-modal-content input,
        .edit-modal-content textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary, #0f0f1a);
            color: var(--text-primary);
            font-family: inherit;
            box-sizing: border-box;
        }
        .edit-modal-content textarea { resize: vertical; min-height: 200px; }
        .edit-modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .edit-modal-actions button {
            background: var(--accent-color);
            color: var(--bg-primary);
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .edit-modal-actions .cancel-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        
        /* 预览区域 */
        .preview-area {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .preview-label {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
        }
        .preview-content {
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            color: var(--text-primary);
            line-height: 1.6;
        }
        .preview-content:empty::before {
            content: "输入内容后将在此显示预览效果";
            color: var(--text-muted);
            font-style: italic;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-primary);
        }
        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 24px 0 10px;
            flex-wrap: wrap;
        }
        .page-btn {
            min-width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-btn:hover:not(.active):not(:disabled) {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .page-btn.active {
            background: var(--accent-color);
            color: var(--bg-primary);
            border-color: var(--accent-color);
        }
        .page-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .page-info {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="nav">
        <div class="nav-left"><div class="logo"></div><h2>📢 NFLSHC Chat 公告</h2></div>
        <div>
            <span>欢迎，<span id="username"></span></span>
            <a href="chat.html">💬 聊天</a>
            <a href="suggestions.html">💡 意见反馈</a>
            <a href="#" onclick="logout()">🚪 退出</a>
        </div>
    </div>

    <div class="container">
        <div id="noticeList" class="notice-list"><div class="loading">加载中...</div></div>
        <div id="adminPanel" class="admin-panel" style="display: none;">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchEditorTab('write')">✍️ 编写</button>
                <button class="tab-btn" onclick="switchEditorTab('preview')">👁️ 预览</button>
            </div>
            <div id="writeTab">
                <input type="text" id="noticeTitle" placeholder="公告标题">
                <textarea id="noticeContent" rows="8" placeholder="公告内容（支持 Markdown 格式）&#10;&#10;支持语法：&#10;- **粗体**、*斜体*、~~删除线~~&#10;- 链接：[文字](url)&#10;- 代码：`code` 或 ```代码块```&#10;- 列表、表格、引用等"></textarea>
            </div>
            <div id="previewTab" style="display: none;">
                <div class="preview-area">
                    <div class="preview-label">📄 预览效果</div>
                    <div class="preview-content" id="previewContent"></div>
                </div>
            </div>
            <button onclick="publishNotice()">发布公告</button>
            <div id="publishMessage" class="message" style="display: none;"></div>
        </div>
    </div>

    <!-- 修改公告弹窗（仅管理员可用） -->
    <div id="editNoticeModal" class="edit-modal">
        <div class="edit-modal-content">
            <h3>✏️ 修改公告</h3>
            <input type="hidden" id="editNoticeId">
            <label for="editNoticeTitle">公告标题</label>
            <input type="text" id="editNoticeTitle" placeholder="公告标题">
            <label for="editNoticeContent">公告内容（支持 Markdown）</label>
            <textarea id="editNoticeContent" placeholder="公告内容（支持 Markdown 格式）"></textarea>
            <div id="editMessage" class="message" style="display: none;"></div>
            <div class="edit-modal-actions">
                <button class="cancel-btn" onclick="closeEditModal()">取消</button>
                <button onclick="saveEditNotice()">保存修改</button>
            </div>
        </div>
    </div>

    
    <script>
        let currentUser = null;
        let allNotices = [];
        const NOTICES_PER_PAGE = 5;
        let noticeCurrentPage = 1;

        // 配置 marked
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true,
                headerIds: false,
                mangle: false
            });
        }

        function logout() { 
            // 清除 localStorage 和 sessionStorage 中的登录状态
            localStorage.removeItem('nflshc_currentUser');
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('nflshc_user');
            // 如果有全局清除函数也调用一下
            if (window.clearLoginState) window.clearLoginState();
            window.location.href = 'index.html'; 
        }

        function renderMarkdown(content) {
            if (!content) return '';
            if (typeof marked !== 'undefined') {
                try {
                    return marked.parse(content);
                } catch (e) {
                    console.error('Markdown 渲染失败:', e);
                    return escapeHtml(content);
                }
            }
            return escapeHtml(content);
        }

        function updatePreview() {
            const content = document.getElementById('noticeContent').value;
            const previewDiv = document.getElementById('previewContent');
            if (previewDiv) {
                previewDiv.innerHTML = renderMarkdown(content);
            }
        }

        function switchEditorTab(tab) {
            const writeTab = document.getElementById('writeTab');
            const previewTab = document.getElementById('previewTab');
            const btns = document.querySelectorAll('.tab-btn');
            
            btns.forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'write') {
                writeTab.style.display = 'block';
                previewTab.style.display = 'none';
                btns[0].classList.add('active');
            } else {
                writeTab.style.display = 'none';
                previewTab.style.display = 'block';
                btns[1].classList.add('active');
                updatePreview();
            }
        }

        async function loadNotices() {
            try {
                allNotices = [];
                let page = 1;
                let hasMore = true;
                // 循环获取所有页的公告
                while (hasMore && page <= 20) {
                    const url = `${WORKER_API}/api/legacy/issues?labels=notice&state=open&per_page=100&page=${page}`;
                    const response = await fetch(url, {
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    });
                    const linkHeader = response.headers.get('Link');
                    hasMore = linkHeader && linkHeader.includes('rel="next"');
                    const issues = await response.json();
                    for (const issue of issues) {
                        const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                        if (match) {
                            const noticeData = JSON.parse(match[1]);
                            allNotices.push({ ...noticeData, issueNumber: issue.number });
                        }
                    }
                    page++;
                }
                allNotices.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                noticeCurrentPage = 1;
                renderNotices();
            } catch (error) { console.error('加载公告失败:', error); }
        }

        function renderNotices() {
            const container = document.getElementById('noticeList');
            if (allNotices.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 暂无公告</div>';
                return;
            }
            const totalPages = Math.ceil(allNotices.length / NOTICES_PER_PAGE);
            if (noticeCurrentPage > totalPages) noticeCurrentPage = totalPages;
            const start = (noticeCurrentPage - 1) * NOTICES_PER_PAGE;
            const pageNotices = allNotices.slice(start, start + NOTICES_PER_PAGE);
            const admin = isNoticeAdmin();
            let html = pageNotices.map(notice => `
                <div class="notice-item">
                    <div class="notice-title">📢 ${escapeHtml(notice.title)}</div>
                    <div class="notice-meta">
                        发布于 ${new Date(notice.createdAt).toLocaleString()} by ${escapeHtml(notice.author || '管理员')}
                        ${admin ? `
                            <button class="delete-notice-btn" onclick="deleteNotice('${notice.issueNumber}')">删除公告</button>
                            <button class="edit-notice-btn" onclick="editNotice('${notice.issueNumber}')">修改公告</button>
                        ` : ''}
                    </div>
                    <div class="notice-content">${renderMarkdown(notice.content)}</div>
                </div>
            `).join('');
            // 添加分页控件
            html += '<div class="page-info">共 ' + allNotices.length + ' 条公告 · ' + noticeCurrentPage + ' / ' + totalPages + ' 页</div>';
            html += '<div class="pagination">';
            html += '<button class="page-btn" onclick="goNoticePage(1)" ' + (noticeCurrentPage <= 1 ? 'disabled' : '') + '>«</button>';
            html += '<button class="page-btn" onclick="goNoticePage(' + (noticeCurrentPage - 1) + ')" ' + (noticeCurrentPage <= 1 ? 'disabled' : '') + '>‹</button>';
            // 页码按钮
            const maxButtons = 7;
            let startPage = Math.max(1, noticeCurrentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            if (endPage - startPage < maxButtons - 1) startPage = Math.max(1, endPage - maxButtons + 1);
            for (let p = startPage; p <= endPage; p++) {
                html += '<button class="page-btn' + (p === noticeCurrentPage ? ' active' : '') + '" onclick="goNoticePage(' + p + ')">' + p + '</button>';
            }
            html += '<button class="page-btn" onclick="goNoticePage(' + (noticeCurrentPage + 1) + ')" ' + (noticeCurrentPage >= totalPages ? 'disabled' : '') + '>›</button>';
            html += '<button class="page-btn" onclick="goNoticePage(' + totalPages + ')" ' + (noticeCurrentPage >= totalPages ? 'disabled' : '') + '>»</button>';
            html += '</div>';
            container.innerHTML = html;
        }

        function goNoticePage(page) {
            noticeCurrentPage = page;
            renderNotices();
            document.getElementById('noticeList').scrollIntoView({ behavior: 'smooth' });
        }

        async function publishNotice() {
            const title = document.getElementById('noticeTitle').value.trim();
            const content = document.getElementById('noticeContent').value.trim();
            const msgDiv = document.getElementById('publishMessage');
            
            if (!title || !content) {
                msgDiv.style.display = 'block';
                msgDiv.className = 'message error';
                msgDiv.innerHTML = '请填写标题和内容';
                setTimeout(() => msgDiv.style.display = 'none', 3000);
                return;
            }

            const noticeData = {
                id: `notice_${Date.now()}`,
                title: title,
                content: content,
                author: currentUser.username,
                createdAt: new Date().toISOString()
            };
            try {
                const issueBody = `公告信息\n\`\`\`json\n${JSON.stringify(noticeData, null, 2)}\n\`\`\``;
                await fetch(`${WORKER_API}/api/legacy/issues`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: `公告: ${title}`, body: issueBody, labels: ['notice'] })
                });
                msgDiv.style.display = 'block';
                msgDiv.className = 'message success';
                msgDiv.innerHTML = '✅ 公告发布成功！';
                document.getElementById('noticeTitle').value = '';
                document.getElementById('noticeContent').value = '';
                await loadNotices();
                setTimeout(() => msgDiv.style.display = 'none', 3000);
            } catch (error) {
                msgDiv.style.display = 'block';
                msgDiv.className = 'message error';
                msgDiv.innerHTML = `发布失败: ${error.message}`;
                setTimeout(() => msgDiv.style.display = 'none', 3000);
            }
        }

        // 仅管理员（huangzhiyuan）可删除/修改公告
        function isNoticeAdmin() {
            return !!(currentUser && (currentUser.username === 'huangzhiyuan' || currentUser.isAdmin));
        }

        async function deleteNotice(issueNumber) {
            if (!isNoticeAdmin()) { alert('只有管理员可以删除公告'); return; }
            if (!confirm('确定要删除这条公告吗？此操作不可恢复！')) return;
            try {
                await fetch(`${WORKER_API}/api/legacy/issues/${issueNumber}?labels=notice`, {
                    method: 'DELETE'
                });
                alert('公告已删除');
                await loadNotices();
            } catch (error) { alert('删除失败：' + error.message); }
        }

        // 修改公告：打开编辑弹窗并预填当前标题/内容
        function editNotice(issueNumber) {
            if (!isNoticeAdmin()) { alert('只有管理员可以修改公告'); return; }
            const notice = allNotices.find(n => n.issueNumber === issueNumber);
            if (!notice) return;
            document.getElementById('editNoticeId').value = issueNumber;
            document.getElementById('editNoticeTitle').value = notice.title || '';
            document.getElementById('editNoticeContent').value = notice.content || '';
            document.getElementById('editMessage').style.display = 'none';
            document.getElementById('editNoticeModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editNoticeModal').style.display = 'none';
        }

        async function saveEditNotice() {
            const issueNumber = document.getElementById('editNoticeId').value;
            const title = document.getElementById('editNoticeTitle').value.trim();
            const content = document.getElementById('editNoticeContent').value.trim();
            const msgDiv = document.getElementById('editMessage');
            if (!title || !content) {
                msgDiv.style.display = 'block';
                msgDiv.className = 'message error';
                msgDiv.textContent = '请填写标题和内容';
                setTimeout(() => msgDiv.style.display = 'none', 3000);
                return;
            }
            const target = allNotices.find(n => n.issueNumber === issueNumber) || {};
            // 保留原有 id/author/createdAt，按需求不更新/不展示修改日期
            const noticeData = {
                id: target.id || `notice_${issueNumber}`,
                title: title,
                content: content,
                author: target.author || (currentUser && currentUser.username) || '管理员',
                createdAt: target.createdAt || new Date().toISOString()
            };
            try {
                const issueBody = `公告信息\n\`\`\`json\n${JSON.stringify(noticeData, null, 2)}\n\`\`\``;
                await fetch(`${WORKER_API}/api/legacy/issues/${issueNumber}?labels=notice`, {
                    method: 'PATCH',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: `公告: ${title}`, body: issueBody, labels: ['notice'] })
                });
                msgDiv.style.display = 'block';
                msgDiv.className = 'message success';
                msgDiv.textContent = '✅ 公告修改成功！';
                closeEditModal();
                await loadNotices();
                setTimeout(() => msgDiv.style.display = 'none', 3000);
            } catch (error) {
                msgDiv.style.display = 'block';
                msgDiv.className = 'message error';
                msgDiv.textContent = '修改失败：' + error.message;
                setTimeout(() => msgDiv.style.display = 'none', 3000);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function init() {
            const userStr = sessionStorage.getItem('currentUser');
            if (!userStr) { window.location.href = 'index.html'; return; }
            currentUser = JSON.parse(userStr);
            document.getElementById('username').textContent = currentUser.username;
            
            await loadNotices();
            if (isNoticeAdmin()) {
                document.getElementById('adminPanel').style.display = 'block';
                const contentTextarea = document.getElementById('noticeContent');
                if (contentTextarea) {
                    contentTextarea.addEventListener('input', updatePreview);
                }
            }
        }
        
        init();
    </script>
    <script src="shortcuts.js"></script>
    </body>
</html>
