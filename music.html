<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>const WORKER_API='https://worker.nflshcchat.cc.cd';</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>NFLSHC Chat - 音乐</title>
    <!-- PWA 支持 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffd700">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary, linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 30%, #1e1040 60%, #0d0625 100%));
            min-height: 100vh;
            color: var(--text-primary, #fff);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
        }

        /* 导航栏 - 与 chat.html 风格一致 */
        .nav {
            background: var(--bg-secondary, #0f0f1a);
            padding: 10px 20px;
            color: var(--text-primary, #fff);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--accent-color, #ffd700);
            width: 100%;
            max-width: 1200px;
            border-radius: 12px 12px 0 0;
            margin-bottom: 20px;
            position: relative;
            z-index: 50;
        }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .logo { 
            width: 36px; 
            height: 36px; 
            background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png'); 
            background-size: contain; 
            background-repeat: no-repeat; 
            background-position: center; 
        }
        .nav h2 { font-size: 18px; color: var(--accent-color, #ffd700); }
        .nav a { 
            color: var(--text-primary, #fff);
            opacity: 0.7;
            text-decoration: none; 
            margin-left: 16px; 
            transition: color 0.3s, opacity 0.3s;
            font-size: 14px;
        }
        .nav a:hover { color: var(--accent-color, #ffd700); opacity: 1; }
        .nav a.active { color: var(--accent-color, #ffd700); font-weight: 600; opacity: 1; }

        @media (max-width: 768px) {
            .nav { flex-direction: column; gap: 8px; text-align: center; padding: 12px 16px; }
            .nav div:last-child { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
            .nav a { margin-left: 0; font-size: 13px; }
            body { padding: 12px 8px 30px; }
        }

        .container {
            width: 100%;
            max-width: 560px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ff9a56, #ffc857, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary, rgba(255, 255, 255, 0.45));
            font-size: 13px;
            letter-spacing: 1px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.12));
            border-radius: 12px;
            background: var(--input-bg, rgba(255, 255, 255, 0.06));
            backdrop-filter: blur(10px);
            color: var(--text-primary, #fff);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input::placeholder {
            color: var(--text-secondary, rgba(255, 255, 255, 0.3));
        }

        .search-box input:focus {
            border-color: var(--accent-color, rgba(255, 200, 87, 0.4));
            background: var(--bg-secondary, rgba(255, 255, 255, 0.1));
            box-shadow: 0 0 20px var(--accent-color, rgba(255, 200, 87, 0.1));
        }

        .search-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-color, #ff9a56), var(--accent-hover, #ffc857));
            color: var(--bg-primary, #1a0a2e);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(255, 154, 86, 0.4);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .player-card {
            background: var(--bg-secondary, rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.1));
            border-radius: 20px;
            padding: 28px 24px 24px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .player-card.active {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .album-art {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 16px 48px rgba(102, 126, 234, 0.35), inset 0 0 30px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .album-art::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            position: relative;
            z-index: 1;
        }

        .song-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .song-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary, #fff);
            letter-spacing: 0.5px;
        }

        .song-artist {
            font-size: 14px;
            color: var(--text-secondary, rgba(255, 255, 255, 0.55));
            margin-bottom: 2px;
        }

        .song-album {
            font-size: 12px;
            color: var(--text-muted, rgba(255, 255, 255, 0.35));
        }

        .progress-area {
            margin-bottom: 18px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: var(--border-color, rgba(255, 255, 255, 0.1));
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color, #ff9a56), var(--accent-hover, #ffc857));
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--accent-color, rgba(255, 200, 87, 0.3));
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary, rgba(255, 255, 255, 0.4));
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .ctrl-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--bg-tertiary, rgba(255, 255, 255, 0.08));
            color: var(--text-primary, #fff);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:hover {
            background: var(--border-color, rgba(255, 255, 255, 0.15));
            transform: scale(1.08);
        }

        .ctrl-btn.play-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-color, #ff9a56), var(--accent-hover, #ffc857));
            color: var(--bg-primary, #1a0a2e);
            box-shadow: 0 8px 28px var(--accent-color, rgba(255, 154, 86, 0.4));
        }

        .ctrl-btn.play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 36px rgba(255, 154, 86, 0.5);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .ctrl-btn.play-btn svg {
            width: 24px;
            height: 24px;
        }

        .volume-area {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            padding: 0 10px;
        }

        .volume-area svg {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary, rgba(255, 255, 255, 0.5));
            flex-shrink: 0;
        }

        .volume-area input[type="range"] {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border-color, rgba(255, 255, 255, 0.12));
            border-radius: 2px;
            outline: none;
        }

        .volume-area input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color, #ff9a56), var(--accent-hover, #ffc857));
            cursor: pointer;
            box-shadow: 0 2px 8px var(--accent-color, rgba(255, 154, 86, 0.4));
        }

        .volume-area input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color, #ff9a56), var(--accent-hover, #ffc857));
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px var(--accent-color, rgba(255, 154, 86, 0.4));
        }

        .history-list {
            background: var(--bg-secondary, rgba(255, 255, 255, 0.04));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
            border-radius: 16px;
            padding: 18px 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-list h3 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary, rgba(255, 255, 255, 0.45));
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .history-list .sync-status {
            font-size: 11px;
            color: var(--text-secondary, rgba(255, 255, 255, 0.3));
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .history-list .sync-status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
        }
        .history-list .sync-status .dot.syncing { background: #f39c12; animation: pulse 1s infinite; }
        .history-list .sync-status .dot.error { background: #e74c3c; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 2px;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-item:hover {
            background: var(--hover-bg, rgba(255, 255, 255, 0.07));
        }

        .history-item .num {
            width: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary, rgba(255, 255, 255, 0.25));
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            flex-shrink: 0;
        }

        .history-item .info {
            flex: 1;
            min-width: 0;
        }

        .history-item .info .name {
            font-size: 14px;
            color: var(--text-primary, rgba(255, 255, 255, 0.9));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 1px;
        }

        .history-item .info .artist {
            font-size: 12px;
            color: var(--text-secondary, rgba(255, 255, 255, 0.4));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item .play-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-tertiary, rgba(255, 255, 255, 0.06));
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .history-item:hover .play-icon {
            opacity: 1;
            background: linear-gradient(135deg, var(--accent-color, #ff9a56), var(--accent-hover, #ffc857));
        }

        .history-item .play-icon svg {
            width: 12px;
            height: 12px;
            fill: var(--bg-primary, #1a0a2e);
        }

        .history-item .delete-btn {
            width: 26px;
            height: 26px;
            border: none;
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .history-item:hover .delete-btn {
            opacity: 1;
        }
        .history-item .delete-btn:hover {
            background: rgba(220, 53, 69, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary, rgba(255, 255, 255, 0.5));
        }

        .loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border-color, rgba(255, 255, 255, 0.08));
            border-top-color: var(--accent-color, #ff9a56);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            text-align: center;
            padding: 16px;
            color: #ff6b6b;
            font-size: 14px;
            background: rgba(255, 107, 107, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.15);
            margin-bottom: 16px;
        }

        .empty-history {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary, rgba(255, 255, 255, 0.3));
            font-size: 13px;
        }

        /* 播放中的历史条目高亮 */
        .history-item.playing {
            background: var(--accent-color-alpha, rgba(255, 200, 87, 0.12));
            border-left: 3px solid var(--accent-color, #ffd700);
        }
        .history-item.playing .name {
            color: var(--accent-color, #ffd700);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color, rgba(255, 255, 255, 0.12)); border-radius: 2px; }

        @media (max-width: 480px) {
            .header h1 { font-size: 22px; }
            .player-card { padding: 20px 16px; }
            .album-art { width: 130px; height: 130px; font-size: 48px; }
            .song-name { font-size: 17px; }
            .search-box input { padding: 10px 14px; font-size: 14px; }
            .search-box button { padding: 10px 18px; font-size: 14px; }
            .history-list { padding: 14px 12px; }
            .controls { gap: 14px; }
            .ctrl-btn { width: 38px; height: 38px; }
            .ctrl-btn.play-btn { width: 52px; height: 52px; }
            .volume-area input[type="range"] { width: 80px; }
        }
    </style>

</head>
<body>
    <!-- 导航栏 - 与 chat.html 风格一致 -->
    <div class="nav">
        <div class="nav-left">
            <div class="logo"></div>
            <h2>🎵 NFLSHC 音乐</h2>
        </div>
        <div>
            <a href="chat.html">💬 聊天</a>
            <a href="index.html">🏠 主页</a>
            <a href="#" onclick="logout()">🚪 退出</a>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🎵 音乐播放器</h1>
            <p>搜索歌曲，即刻畅听 · 历史自动保存</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索歌曲... 例如：晴天、稻香" onkeydown="if(event.key==='Enter')searchMusic()">
            <button id="searchBtn" onclick="searchMusic()">搜索</button>
        </div>

        <div id="loadingArea" style="display:none">
            <div class="loading">
                <div class="spinner"></div>
                <div>正在搜索...</div>
            </div>
        </div>

        <div id="errorArea" style="display:none"></div>

        <div class="player-card" id="playerCard">
            <div class="album-art" id="albumArt">🎵</div>
            <div class="song-info">
                <div class="song-name" id="songName">--</div>
                <div class="song-artist" id="songArtist">--</div>
                <div class="song-album" id="songAlbum">--</div>
            </div>

            <div class="progress-area">
                <div class="progress-bar" id="progressBar" onclick="seek(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="toggleMute()" title="静音">
                    <svg id="volIcon" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>
                <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">
                    <svg id="playIcon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
            </div>

            <div class="volume-area">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3z"/>
                </svg>
                <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)">
            </div>

            <audio id="audioPlayer" preload="none"></audio>
        </div>

        <div class="history-list" id="historyList">
            <div class="history-header">
                <h3>🎶 播放历史</h3>
                <div class="sync-status">
                    <span class="dot" id="syncDot"></span>
                    <span id="syncText">已同步</span>
                </div>
            </div>
            <div id="historyContent">
                <div class="empty-history">暂无播放历史</div>
            </div>
        </div>
    </div>

    
    <script>
        // ==================== 配置 ====================
        const API_KEY = '9a36c99b7cf7cf30f903a182cfcd7953';
        const API_BASE = 'https://jkapi.com/api/music';

        // ==================== 状态 ====================
        let currentSong = null;
        let isPlaying = false;
        let currentUser = null;
        let playHistory = [];           // 本地历史
        let isSyncing = false;
        let syncInterval = null;
        let isPlayingFromHistory = false; // 标记是否正在播放历史歌曲
        let currentHistoryIndex = -1;    // 当前播放的历史索引

        const audio = document.getElementById('audioPlayer');
        const gradients = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%)',
            'linear-gradient(135deg, #ff9a56 0%, #ffc857 50%, #ff6b6b 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 50%, #43e97b 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 50%, #ffecd2 100%)',
            'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 50%, #fad0c4 100%)',
            'linear-gradient(135deg, #84fab0 0%, #8fd3f4 50%, #a1c4fd 100%)',
            'linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ff9a56 100%)'
        ];

        // ==================== 用户认证 ====================
        function checkAuth() {
            const userStr = sessionStorage.getItem('currentUser');
            if (!userStr) {
                const localUser = localStorage.getItem('nflshc_currentUser');
                if (localUser) {
                    sessionStorage.setItem('currentUser', localUser);
                    currentUser = JSON.parse(localUser);
                    return currentUser;
                }
                window.location.href = 'index.html';
                return null;
            }
            currentUser = JSON.parse(userStr);
            return currentUser;
        }

        function logout() {
            localStorage.removeItem('nflshc_currentUser');
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('nflshc_user');
            if (window.clearLoginState) window.clearLoginState();
            window.location.href = 'index.html';
        }

        // ==================== GitHub Issues 数据操作 ====================
        function getGithubHeaders() {
            return {
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };
        }

        async function fetchCloudMusicHistory(username) {
            try {
                const url = `${WORKER_API}/api/legacy/issues?labels=music_history&state=open&per_page=100`;
                const res = await fetch(url, { headers: getGithubHeaders() });
                const issues = await res.json();
                
                for (const issue of issues) {
                    const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) {
                        try {
                            const data = JSON.parse(match[1]);
                            if (data.username === username) {
                                return {
                                    issueNumber: issue.number,
                                    data: data
                                };
                            }
                        } catch(e) {}
                    }
                }
                return null;
            } catch (error) {
                console.error('获取云端音乐历史失败:', error);
                return null;
            }
        }

        async function saveCloudMusicHistory(username, historyData) {
            try {
                const existing = await fetchCloudMusicHistory(username);
                const payload = {
                    username: username,
                    history: historyData,
                    updatedAt: new Date().toISOString()
                };
                const bodyContent = `音乐历史\n\`\`\`json\n${JSON.stringify(payload, null, 2)}\n\`\`\``;

                if (existing) {
                    await fetch(`${WORKER_API}/api/legacy/issues/${existing.issueNumber}`, {
                        method: 'PATCH',
                        headers: getGithubHeaders(),
                        body: JSON.stringify({ body: bodyContent })
                    });
                } else {
                    await fetch(`${WORKER_API}/api/legacy/issues`, {
                        method: 'POST',
                        headers: getGithubHeaders(),
                        body: JSON.stringify({
                            title: `Music History: ${username}`,
                            body: bodyContent,
                            labels: ['music_history']
                        })
                    });
                }
                console.log('音乐历史已同步到云端');
                return true;
            } catch (error) {
                console.error('保存音乐历史到云端失败:', error);
                return false;
            }
        }

        // ==================== 历史管理 ====================
        function loadLocalHistory() {
            try {
                const stored = localStorage.getItem('nflshc_music_history');
                if (stored) {
                    playHistory = JSON.parse(stored);
                } else {
                    playHistory = [];
                }
            } catch (e) {
                playHistory = [];
            }
            if (playHistory.length > 50) {
                playHistory = playHistory.slice(0, 50);
            }
        }

        function saveLocalHistory() {
            try {
                localStorage.setItem('nflshc_music_history', JSON.stringify(playHistory));
            } catch (e) {
                console.error('保存本地历史失败:', e);
            }
        }

        function addToHistory(song) {
            const key = `${song.name}|${song.artist || ''}`;
            playHistory = playHistory.filter(item => 
                `${item.name}|${item.artist || ''}` !== key
            );
            playHistory.unshift({
                name: song.name,
                artist: song.artist || '未知歌手',
                album: song.album || '',
                music_url: song.music_url,
                pic_url: song.pic_url || null,
                addedAt: new Date().toISOString()
            });
            if (playHistory.length > 50) {
                playHistory = playHistory.slice(0, 50);
            }
            saveLocalHistory();
            renderHistory();
            syncToCloud();
        }

        function removeFromHistory(index) {
            if (index >= 0 && index < playHistory.length) {
                // 如果删除的是当前播放的歌曲，停止播放
                if (isPlayingFromHistory && currentHistoryIndex === index) {
                    audio.pause();
                    isPlaying = false;
                    isPlayingFromHistory = false;
                    currentHistoryIndex = -1;
                    updatePlayIcon();
                }
                playHistory.splice(index, 1);
                saveLocalHistory();
                renderHistory();
                syncToCloud();
            }
        }

        // ==================== 云端同步 ====================
        async function syncToCloud() {
            if (!currentUser || isSyncing) return;
            isSyncing = true;
            updateSyncStatus('syncing', '同步中...');

            try {
                const success = await saveCloudMusicHistory(currentUser.username, playHistory);
                if (success) {
                    updateSyncStatus('', '已同步');
                } else {
                    updateSyncStatus('error', '同步失败');
                }
            } catch (e) {
                updateSyncStatus('error', '同步失败');
            } finally {
                isSyncing = false;
            }
        }

        async function loadFromCloud() {
            if (!currentUser) return;
            try {
                const result = await fetchCloudMusicHistory(currentUser.username);
                if (result && result.data && result.data.history) {
                    const cloudHistory = result.data.history;
                    const localKeys = new Set(playHistory.map(item => `${item.name}|${item.artist || ''}`));
                    let merged = [...playHistory];
                    for (const item of cloudHistory) {
                        const key = `${item.name}|${item.artist || ''}`;
                        if (!localKeys.has(key)) {
                            merged.push(item);
                        }
                    }
                    merged.sort((a, b) => {
                        const ta = a.addedAt ? new Date(a.addedAt).getTime() : 0;
                        const tb = b.addedAt ? new Date(b.addedAt).getTime() : 0;
                        return tb - ta;
                    });
                    if (merged.length > 50) merged = merged.slice(0, 50);
                    playHistory = merged;
                    saveLocalHistory();
                    renderHistory();
                    updateSyncStatus('', '已同步');
                }
            } catch (e) {
                console.error('从云端加载历史失败:', e);
            }
        }

        function updateSyncStatus(type, text) {
            const dot = document.getElementById('syncDot');
            const textEl = document.getElementById('syncText');
            if (!dot || !textEl) return;
            dot.className = 'dot' + (type ? ' ' + type : '');
            textEl.textContent = text;
        }

        // ==================== 渲染历史列表 ====================
        function renderHistory() {
            const container = document.getElementById('historyContent');
            if (!container) return;

            if (playHistory.length === 0) {
                container.innerHTML = '<div class="empty-history">🎵 暂无播放历史<br><span style="font-size:12px;color:rgba(255,255,255,0.2)">搜索并播放歌曲后会自动记录</span></div>';
                return;
            }

            container.innerHTML = playHistory.map((item, index) => `
                <div class="history-item ${isPlayingFromHistory && currentHistoryIndex === index ? 'playing' : ''}" data-index="${index}">
                    <div class="num">${index + 1}</div>
                    <div class="info">
                        <div class="name">${escapeHtml(item.name)}</div>
                        <div class="artist">${escapeHtml(item.artist || '未知歌手')}</div>
                    </div>
                    <button class="delete-btn" onclick="event.stopPropagation();removeFromHistory(${index})" title="删除">✕</button>
                    <div class="play-icon">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
            `).join('');

            // 为每个历史条目绑定点击事件
            container.querySelectorAll('.history-item').forEach((el, index) => {
                el.addEventListener('click', function() {
                    playFromHistory(index);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 播放控制 ====================
        async function searchMusic() {
            const input = document.getElementById('searchInput');
            const name = input.value.trim();
            if (!name) return;

            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loadingArea');
            const errorArea = document.getElementById('errorArea');

            btn.disabled = true;
            loading.style.display = 'block';
            errorArea.style.display = 'none';

            try {
                const url = `${API_BASE}?plat=wy&type=json&apiKey=${API_KEY}&name=${encodeURIComponent(name)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 1 && data.music_url) {
                    // 取消历史播放状态
                    isPlayingFromHistory = false;
                    currentHistoryIndex = -1;
                    loadSong(data);
                    addToHistory(data);
                } else {
                    throw new Error(data.msg || '未找到该歌曲，请尝试其他关键词');
                }
            } catch (err) {
                errorArea.innerHTML = `<div class="error-msg">❌ ${err.message}</div>`;
                errorArea.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function loadSong(data) {
            currentSong = data;
            document.getElementById('songName').textContent = data.name || '未知歌曲';
            document.getElementById('songArtist').textContent = data.artist || '未知歌手';
            document.getElementById('songAlbum').textContent = data.album ? `专辑：${data.album}` : '';

            const art = document.getElementById('albumArt');
            if (data.pic_url) {
                art.innerHTML = `<img src="${data.pic_url}" alt="专辑封面" onerror="this.style.display='none';this.parentElement.innerHTML='🎵'">`;
            } else {
                art.innerHTML = '🎵';
                art.style.background = gradients[Math.floor(Math.random() * gradients.length)];
            }

            audio.src = data.music_url;
            audio.volume = document.getElementById('volumeSlider').value / 100;
            document.getElementById('playerCard').classList.add('active');

            audio.play().then(() => {
                isPlaying = true;
                updatePlayIcon();
            }).catch(() => {
                isPlaying = false;
                updatePlayIcon();
            });
        }

        // ===== 从历史记录播放（通过搜索） =====
        async function playFromHistory(index) {
            const item = playHistory[index];
            if (!item) return;

            // 显示加载状态
            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loadingArea');
            const errorArea = document.getElementById('errorArea');
            
            btn.disabled = true;
            loading.style.display = 'block';
            errorArea.style.display = 'none';

            try {
                // 使用歌曲名和歌手名搜索
                const searchQuery = item.artist && item.artist !== '未知歌手' 
                    ? `${item.name} ${item.artist}` 
                    : item.name;
                
                const url = `${API_BASE}?plat=wy&type=json&apiKey=${API_KEY}&name=${encodeURIComponent(searchQuery)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 1 && data.music_url) {
                    // 标记为历史播放
                    isPlayingFromHistory = true;
                    currentHistoryIndex = index;
                    
                    loadSong(data);
                    // 更新历史高亮
                    renderHistory();
                    
                    // 更新输入框显示
                    document.getElementById('searchInput').value = item.name;
                } else {
                    throw new Error(data.msg || '未找到该歌曲，请尝试其他关键词');
                }
            } catch (err) {
                errorArea.innerHTML = `<div class="error-msg">❌ 播放失败: ${err.message}</div>`;
                errorArea.style.display = 'block';
                // 恢复状态
                isPlayingFromHistory = false;
                currentHistoryIndex = -1;
                renderHistory();
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function togglePlay() {
            if (!audio.src) return;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
            }
            updatePlayIcon();
        }

        function updatePlayIcon() {
            const icon = document.getElementById('playIcon');
            if (isPlaying) {
                icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/>';
            } else {
                icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            const icon = document.getElementById('volIcon');
            if (audio.muted) {
                icon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            } else {
                icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            }
        }

        function setVolume(val) {
            audio.volume = val / 100;
            if (audio.muted && val > 0) audio.muted = false;
        }

        function seek(event) {
            if (!audio.duration) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const pct = (event.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // ==================== Audio 事件绑定 ====================
        audio.addEventListener('timeupdate', () => {
            const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
            document.getElementById('duration').textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            updatePlayIcon();
            // 如果是历史播放，清除高亮
            if (isPlayingFromHistory) {
                isPlayingFromHistory = false;
                currentHistoryIndex = -1;
                renderHistory();
            }
        });

        audio.addEventListener('error', (e) => {
            console.error('音频播放错误:', e);
            const errorArea = document.getElementById('errorArea');
            errorArea.innerHTML = `<div class="error-msg">⚠️ 音频加载失败，请检查网络或尝试其他歌曲</div>`;
            errorArea.style.display = 'block';
            if (isPlayingFromHistory) {
                isPlayingFromHistory = false;
                currentHistoryIndex = -1;
                renderHistory();
            }
        });

        // ==================== 快捷键支持 ====================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    togglePlay();
                }
            }
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                searchMusic();
            }
        });

        // ==================== 初始化 ====================
        async function init() {
            if (!checkAuth()) return;

            loadLocalHistory();
            renderHistory();
            await loadFromCloud();

            updateSyncStatus('', '已同步');

            syncInterval = setInterval(() => {
                if (playHistory.length > 0) {
                    syncToCloud();
                }
            }, 60000);

            window.addEventListener('beforeunload', () => {
                if (playHistory.length > 0) {
                    syncToCloud();
                }
            });

            console.log('🎵 音乐播放器已初始化, 用户:', currentUser.username);
            console.log('📋 本地历史条数:', playHistory.length);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
    <script src="js/theme.js"></script>
</body>
