<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=4"></script>
    <script>const WORKER_API = 'https://worker.nflshcchat.cc.cd';</script>
    <meta charset="UTF-8">

    <title>NFLSHC Chat - 全部功能导航</title>
    <link rel="stylesheet" href="css/themes.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .nav { background: var(--bg-secondary); padding: 12px 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 20; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 36px; height: 36px; background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png'); background-size: contain; background-repeat: no-repeat; background-position: center; }
        .nav h2 { font-size: 18px; color: var(--accent-color); }
        .nav a { color: var(--text-primary); text-decoration: none; margin-left: 16px; font-size: 14px; }
        .nav a:hover { color: var(--accent-color); }
        .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 70px; }
        .hero { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; padding: 22px; margin-bottom: 20px; }
        .hero h1 { font-size: 22px; margin-bottom: 8px; }
        .hero p { color: var(--text-secondary); font-size: 14px; line-height: 1.8; }
        .searchbar { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .searchbar input { flex: 1; min-width: 200px; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 11px; background: var(--bg-primary); color: var(--text-primary); font-size: 15px; font-family: inherit; }
        .searchbar input:focus { outline: none; border-color: var(--accent-color); }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .chips button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-secondary); cursor: pointer; font-size: 13px; font-family: inherit; }
        .chips button.on { border-color: var(--accent-color); color: var(--accent-color); }
        .group { margin-bottom: 26px; }
        .group h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .group h3 .cnt { font-size: 12px; color: var(--text-secondary); font-weight: 400; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 12px; }
        .item { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--border-color); border-radius: 13px; background: var(--bg-secondary); text-decoration: none; color: inherit; transition: .18s; }
        .item:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .item .ic { font-size: 24px; line-height: 1; flex: 0 0 30px; text-align: center; }
        .item .tt { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
        .item .dd { font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; }
        .item .url { font-size: 11px; color: var(--text-secondary); opacity: .75; margin-top: 4px; word-break: break-all; }
        .item.ext { border-style: dashed; }
        .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border-color); color: var(--text-secondary); margin-left: 6px; vertical-align: 1px; }
        .badge.admin { color: #e74c3c; border-color: rgba(231,76,60,.5); }
        .badge.new { color: #28a745; border-color: rgba(40,167,69,.5); }
        .badge.ext { color: #3498db; border-color: rgba(52,152,219,.5); }
        .empty { padding: 50px 20px; text-align: center; color: var(--text-secondary); font-size: 14.5px; line-height: 1.9; }
        footer { text-align: center; color: var(--text-secondary); font-size: 12.5px; padding: 20px; }
        footer a { color: var(--text-secondary); text-decoration: none; margin: 0 8px; }
        footer a:hover { color: var(--accent-color); }
        @media (max-width: 640px) { .wrap { padding: 16px 12px 50px; } .nav { padding: 10px 14px; } }
    </style>
</head>

            { icon: '💡', name: '意见反馈', url: 'suggestions.html', group: '沟通协作', desc: '向管理员提交网站修改建议，并查看所有用户建议。' },

            { icon: '🖼️', name: '图床', url: 'image-host.html', group: '学习与创作', desc: '上传图片生成外链（与聊天附件共用自建文件托管），含相册浏览、缩略图，以及图片总数 / 总大小 / 总浏览量统计；删除会同步清掉云端文件与我们的缓存。' },
            { icon: '🤖', name: 'HZYAI 对话', url: 'hzyai.html', group: '学习与创作', desc: 'HZYAI 入口页：介绍并跳转到 chatai.bot.cd（多模型对话、视觉理解、绘图、视频生成、语音转文字、代码生成等）。' },
            { icon: '↗️', name: 'HZYAI 分享（跳转）', url: 'hzyai-share.html', group: '学习与创作', desc: '对话分享功能已迁移到 chatai.bot.cd/share.html，本页仅做自动跳转。' },
            { icon: '🎤', name: '技术分享幻灯片', url: 'presentation.html', group: '学习与创作', desc: '英文技术分享《Building a Serverless Chat Platform with Cloudflare D1》：讲本站整体架构、D1 数据模型、Workers 网关、一条消息的生命周期与鉴权体系，可左右翻页，含真实请求/响应示例。' },
            { icon: '🌟', name: '欢迎页 / 项目介绍', url: 'showcase.html', group: '学习与创作', desc: '官网风格的落地介绍页：平台能力一览（群聊私聊、Markdown 消息、消息收藏、数据统计、AI 智能助手等）、版本历程与「准备好加入了吗？」引导。' },

            { icon: '🔐', name: '账号与安全', url: 'security.html', group: '账号与安全', desc: '登录设备列表与一键下线、通行密钥（Passkey）管理、离线通知开关、数据导出、注销账号。', badge: 'new' },
            { icon: '📅', name: '日历', url: 'calendar.html', group: '账号与安全', desc: '日程安排与事件提醒：到点自动发站内通知（服务端定时任务），开启离线通知后还会推送系统通知。' },
            { icon: '👤', name: '个人资料', url: 'profile.html', group: '账号与安全', desc: '查看与编辑昵称、头像、简介等资料，可复制个人主页链接分享给他人。' },
            { icon: '🔑', name: '登录', url: 'index.html', group: '账号与安全', desc: '密码登录 / Google 登录 / 手机扫码登录 / 通行密钥（指纹、面容、PIN）登录。' },
            { icon: '✍️', name: '注册', url: 'register.html', group: '账号与安全', desc: '注册新账号（含滑块人机验证与协议确认）。' },
            { icon: '🔒', name: '隐私政策', url: 'privacy.html', group: '账号与安全', desc: '收集哪些信息、如何使用与保护、第三方服务、你的权利（数据导出 / 注销账号）。' },
            { icon: '📜', name: '用户协议', url: 'terms.html', group: '账号与安全', desc: '服务内容、账号安全、行为规范、文件托管额度、会议与音视频、免责与责任限制。' },

            { icon: '📊', name: '群聊统计', url: 'stats.html', group: '数据与统计', desc: '选择群聊查看总消息数、活跃成员数、日均消息与活跃天数，并含最近 30 天消息趋势、时段分布、高频词汇云与发言排行榜（Chart.js）。' },
            { icon: '📋', name: '个人数据仪表盘', url: 'dashboard.html', group: '数据与统计', desc: '个人数据总览：等级与 XP 进度、总消息数、参与聊天室、收藏数，含最近 14 天消息趋势、活跃时段分布、我的聊天室与成就徽章。' },
            { icon: '📤', name: '数据导出', url: 'export.html', group: '数据与统计', desc: '导出全部聊天记录或指定聊天室，可选择 JSON / HTML 格式，并支持按时间范围导出。' },

            { icon: '🩺', name: '健康看板', url: 'health.html', group: '管理', desc: '站点运行状态：用户 / 会话 / 消息量、服务连通性探测、错误与慢请求明细；非管理员访问会弹窗提示无权访问。', badge: 'admin' },
            { icon: '👑', name: '管理后台', url: 'admin.html', group: '管理', desc: '管理后台：用户与聊天室统计、聊天室管理、用户管理（封禁 / 冻结 / 解封）、系统通知记录、消息审计等。', badge: 'admin' },
            { icon: '💡', name: '建议审核', url: 'admin-suggestions.html', group: '管理', desc: '查看并处理用户提交的意见反馈。', badge: 'admin' },
            { icon: '🧑‍💼', name: '管理员资料', url: 'admin-profile.html', group: '管理', desc: '管理员账号资料页。', badge: 'admin' },

            { icon: '🎮', name: '词语游戏', url: 'word-game.html', group: '趣味', desc: '把句子做「逻辑反转」「百语轮回」等语言变换，探索语言的奇妙组合。' },
            { icon: '🎨', name: '主题设置', url: 'theme.html', group: '趣味', desc: '5 套配色主题（暗夜黑金等）一键切换，所有页面即时生效。' },
            { icon: '🤖', name: 'AI 小助手', url: 'ai-profile.html', group: '趣味', desc: '站内机器人介绍页：智能对话、天气查询、中英翻译、讲笑话、数学计算、古诗查询等能力与使用方法。' },

            { icon: '🧭', name: '功能导航', url: 'pages.html', group: '趣味', desc: '就是本页：全站功能与外部站点一览，支持搜索与分类筛选。' },

            { icon: '🆘', name: '帮助文档', url: 'https://help.nflshcchat.cc.cd', group: '外部站点', desc: '使用教程与常见问题。', badge: 'ext' },
            { icon: '🌐', name: '官网首页', url: 'https://home.nflshcchat.cc.cd', group: '外部站点', desc: 'NFLSHC Chat 官网，含客户端下载与更新日志。', badge: 'ext' },
            { icon: '🧑‍💻', name: '账号中心', url: 'https://accounts.nflshcchat.cc.cd', group: '外部站点', desc: '统一账号管理：登录、注册、已授权应用。', badge: 'ext' },
            { icon: '🧩', name: '开放平台', url: 'https://platform.nflshcchat.cc.cd', group: '外部站点', desc: '为第三方开发者提供 OAuth 应用接入、API 文档与 Webhook。', badge: 'ext' },
            { icon: '📦', name: '文件托管', url: 'https://file.nflshcchat.cc.cd', group: '外部站点', desc: '上传图片 / 音频 / 视频生成外链，支持分片上传大文件（单账号默认 1GB）。', badge: 'ext' },
            { icon: '💬', name: 'HZYAI（新地址）', url: 'https://chatai.bot.cd', group: '外部站点', desc: 'HZYAI 主站：多模型 AI 对话与创作工具。', badge: 'ext' },
            { icon: '🖥️', name: 'Windows 客户端', url: 'https://home.nflshcchat.cc.cd/windows.html', group: '外部站点', desc: 'Windows 客户端下载（安装版 / 便携版）。', badge: 'ext' },
            { icon: '📱', name: 'Android 客户端', url: 'https://home.nflshcchat.cc.cd/android.html', group: '外部站点', desc: 'Android 客户端下载与安装说明。', badge: 'ext' }
        ];

        let filter = '全部';
        const GROUPS = ['核心', '沟通协作', '学习与创作', '账号与安全', '数据与统计', '管理', '趣味', '外部站点'];

        function initChips() {
            const box = document.getElementById('chips');
            box.innerHTML = ['全部'].concat(GROUPS).map(g =>
                '<button class="' + (g === filter ? 'on' : '') + '" onclick="setFilter(\'' + g + '\')">' + g +
                (g === '全部' ? '' : '（' + PAGES.filter(p => p.group === g).length + '）') + '</button>').join('');
        }
        function setFilter(g) {
            filter = g;
            initChips();
            render();
        }
        window.setFilter = setFilter;

        function render() {
            const q = (document.getElementById('q').value || '').trim().toLowerCase();
            const out = document.getElementById('out');
            const list = PAGES.filter(p => {
                if (filter !== '全部' && p.group !== filter) return false;
                if (!q) return true;
                return (p.name + ' ' + p.desc + ' ' + p.url + ' ' + p.group).toLowerCase().indexOf(q) !== -1;
            });
            if (!list.length) {
                out.innerHTML = '<div class="empty">没有找到匹配的功能。<br>换个关键词试试，比如「会议」「笔记」「导出」「管理员」。</div>';
                return;
            }
            const byGroup = {};
            for (const p of list) (byGroup[p.group] = byGroup[p.group] || []).push(p);
            out.innerHTML = GROUPS.filter(g => byGroup[g]).map(g => `
                <div class="group">
                    <h3>${g} <span class="cnt">${byGroup[g].length} 项</span></h3>
                    <div class="grid">
                        ${byGroup[g].map(p => `
                            <a class="item${p.badge === 'ext' ? ' ext' : ''}" href="${p.url}"${p.badge === 'ext' ? ' target="_blank" rel="noopener"' : ''}>
                                <div class="ic">${p.icon}</div>
                                <div>
                                    <div class="tt">${p.name}${p.badge === 'admin' ? '<span class="badge admin">管理员</span>' : ''}${p.badge === 'new' ? '<span class="badge new">新</span>' : ''}${p.badge === 'ext' ? '<span class="badge ext">外部站点</span>' : ''}</div>
                                    <div class="dd">${p.desc}</div>
                                    <div class="url">${p.url}</div>
                                </div>
                            </a>`).join('')}
                    </div>
                </div>`).join('');
        }

        initChips();
        render();
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { document.getElementById('q').value = ''; render(); }
        });
