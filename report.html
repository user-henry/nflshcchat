<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 举报中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #eef4ff;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #2a2a3e;
            margin-bottom: 30px;
        }
        .header h1 { color: var(--accent-color, #ffd700); font-size: 32px; }
        .header p { color: var(--text-muted, #888); margin-top: 8px; }
        
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #2a2a3e;
            margin-bottom: 20px;
        }
        .card h2 { color: var(--accent-color, #ffd700); font-size: 18px; margin-bottom: 16px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: #aaa; font-size: 13px; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color, #2a2a3e);
            border-radius: 8px;
            background: var(--bg-primary, #1a1a2e);
            color: var(--text-primary, #fff);
            font-size: 14px;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color, #ffd700);
        }
        .form-group textarea { resize: vertical; min-height: 120px; }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-color, #ffd700) 0%, var(--accent-hover, #ffb347) 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .status-msg {
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }
        .status-msg.success { display: block; background: rgba(46,204,113,0.15); color: #2ecc71; border: 1px solid #2ecc71; }
        .status-msg.error { display: block; background: rgba(220,53,69,0.15); color: #dc3545; border: 1px solid #dc3545; }
        
        .nav-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-bar a {
            color: var(--text-muted, #888);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-bar a:hover { color: var(--accent-color, #ffd700); background: rgba(255,215,0,0.05); }
        .nav-bar a.active { color: var(--accent-color, #ffd700); background: rgba(255,215,0,0.1); }
        
        .report-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .report-item {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 3px solid #dc3545;
        }
        .report-item .reporter { color: var(--accent-color, #ffd700); font-weight: bold; }
        .report-item .target { color: #dc3545; font-weight: bold; }
        .report-item .reason { color: #aaa; margin: 6px 0; }
        .report-item .status { font-size: 12px; padding: 2px 10px; border-radius: 12px; display: inline-block; }
        .report-item .status.pending { background: #f39c12; color: #1a1a2e; }
        .report-item .status.resolved { background: #2ecc71; color: #1a1a2e; }
        .report-item .status.rejected { background: #dc3545; color: white; }
        .report-item .time { font-size: 11px; color: var(--text-muted, #666); margin-top: 4px; }
        
        .admin-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .admin-actions button {
            padding: 4px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .admin-actions .resolve-btn { background: #2ecc71; color: #1a1a2e; }
        .admin-actions .reject-btn { background: #dc3545; color: white; }
        .admin-actions .ban-btn { background: #f39c12; color: #1a1a2e; }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 24px; }
            .nav-bar { justify-content: center; }
        }
    </style>
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚨 举报中心</h1>
            <p>举报违规用户，维护社区环境</p>
        </div>
        
        <div class="nav-bar">
            <a href="#" class="active" onclick="switchTab('report')">📝 举报用户</a>
            <a href="#" onclick="switchTab('history')">📋 我的举报</a>
            <a href="#" id="adminTabBtn" style="display:none;" onclick="switchTab('admin')">👑 审核管理</a>
            <a href="chat.html">💬 返回聊天</a>
        </div>
        
        <!-- 举报 Tab -->
        <div id="reportTab">
            <div class="card">
                <h2>📝 举报用户</h2>
                <div class="form-group">
                    <label>被举报用户</label>
                    <input type="text" id="targetUser" placeholder="输入用户名" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>举报原因</label>
                    <select id="reportReason">
                        <option value="骚扰">骚扰行为</option>
                        <option value="辱骂">辱骂/人身攻击</option>
                        <option value="广告">垃圾广告</option>
                        <option value="色情">色情内容</option>
                        <option value="违法">违法信息</option>
                        <option value="诈骗">诈骗/欺诈</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>情况说明（请详细描述）</label>
                    <textarea id="reportDescription" placeholder="请描述具体情况，包括时间、聊天室、具体言论等..."></textarea>
                </div>
                <div class="form-group">
                    <label>证据链接（可选）</label>
                    <input type="text" id="reportEvidence" placeholder="https://... 消息截图或相关链接">
                </div>
                <button class="submit-btn" id="submitReportBtn" onclick="submitReport()">🚨 提交举报</button>
                <div id="reportStatus" class="status-msg"></div>
            </div>
        </div>
        
        <!-- 历史记录 Tab -->
        <div id="historyTab" style="display:none;">
            <div class="card">
                <h2>📋 我的举报记录</h2>
                <div class="report-list" id="reportHistory">
                    <div style="color:#666;text-align:center;padding:40px;">暂无举报记录</div>
                </div>
            </div>
        </div>
        
        <!-- 管理员审核 Tab -->
        <div id="adminTab" style="display:none;">
            <div class="card">
                <h2>👑 举报审核管理</h2>
                <div class="report-list" id="adminReportList">
                    <div style="color:#666;text-align:center;padding:40px;">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #2a2a3e;
            border-top-color: var(--accent-color, #ffd700);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 4px 12px;
            border: 1px solid #2a2a3e;
            border-radius: 4px;
            background: #1a1a2e;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
        }
        .pagination button.active {
            background: #ffd700;
            color: #1a1a2e;
            border-color: var(--accent-color, #ffd700);
        }
        .pagination button:hover:not(.active) {
            border-color: var(--accent-color, #ffd700);
            color: var(--accent-color, #ffd700);
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .report-item .admin-note-input {
            flex: 1;
            min-width: 120px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            color: white;
            font-size: 12px;
        }
        .report-item .admin-note-input:focus {
            outline: none;
            border-color: var(--accent-color, #ffd700);
        }
    </style>
    <script src="config.js"></script>
    <script>
        // ============================================================
        //  举报中心 - GitHub Issues 存储版本
        // ============================================================
        let currentUser = null;
        let isAdmin = false;
        let allReports = [];
        let currentPage = 1;
        const PAGE_SIZE = 10;
        const REPORT_LABEL = 'nflshc_report';

        function checkAuth() {
            let userStr = sessionStorage.getItem('currentUser');
            if (!userStr) { userStr = localStorage.getItem('nflshc_currentUser'); }
            if (userStr) {
                currentUser = JSON.parse(userStr);
                if (currentUser.isAdmin || currentUser.username === 'huangzhiyuan') { isAdmin = true; }
                return true;
            }
            return false;
        }
        if (!checkAuth()) { alert('请先登录'); window.location.href = 'index.html'; }
        if (isAdmin) { document.getElementById('adminTabBtn').style.display = 'inline-block'; }

        // ============================================================
        //  从 GitHub Issues 加载举报
        // ============================================================
        async function loadReports() {
            try {
                const url = 'https://api.github.com/repos/' + window.CONFIG.GITHUB_USERNAME + '/' + window.CONFIG.GITHUB_REPO + '/issues?labels=' + REPORT_LABEL + '&state=open';
                const res = await fetch(url, { headers: { 'Authorization': 'token ' + window.CONFIG.GITHUB_TOKEN, 'Accept': 'application/vnd.github.v3+json' } });
                const issues = await res.json();
                allReports = [];
                for (const issue of issues) {
                    const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) { try { allReports.push({ ...JSON.parse(match[1]), issueNumber: issue.number }); } catch (e) {} }
                }
                allReports.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                renderHistory();
                if (isAdmin) renderAdminList();
                updateStats();
            } catch (error) {
                console.error('加载举报失败:', error);
                document.getElementById('reportHistory').innerHTML = '<div style="color:#dc3545;text-align:center;padding:20px;">❌ 加载失败: ' + error.message + '</div>';
                if (isAdmin) document.getElementById('adminReportList').innerHTML = '<div style="color:#dc3545;text-align:center;padding:20px;">❌ 加载失败: ' + error.message + '</div>';
            }
        }

        // ============================================================
        //  提交举报到 GitHub Issues
        // ============================================================
        async function submitReport() {
            const targetUser = document.getElementById('targetUser').value.trim();
            const reason = document.getElementById('reportReason').value;
            const description = document.getElementById('reportDescription').value.trim();
            const evidence = document.getElementById('reportEvidence').value.trim();
            if (!targetUser) { showStatus('请填写被举报用户', 'error'); return; }
            if (!description) { showStatus('请填写情况说明', 'error'); return; }
            if (targetUser === currentUser.username) { showStatus('不能举报自己', 'error'); return; }
            const userExists = await checkUserExists(targetUser);
            if (!userExists) { showStatus('用户 "' + targetUser + '" 不存在', 'error'); return; }
            const report = {
                id: 'report_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                reporter: currentUser.username, targetUser: targetUser, reason: reason,
                description: description, evidence: evidence || '',
                status: 'pending', createdAt: new Date().toISOString(),
                resolvedAt: null, resolvedBy: null, adminNote: ''
            };
            try {
                const issueBody = '举报信息\n```json\n' + JSON.stringify(report, null, 2) + '\n```';
                await fetch('https://api.github.com/repos/' + window.CONFIG.GITHUB_USERNAME + '/' + window.CONFIG.GITHUB_REPO + '/issues', {
                    method: 'POST',
                    headers: { 'Authorization': 'token ' + window.CONFIG.GITHUB_TOKEN, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: '举报: ' + report.reporter + ' → ' + report.targetUser, body: issueBody, labels: [REPORT_LABEL] })
                });
                document.getElementById('targetUser').value = '';
                document.getElementById('reportDescription').value = '';
                document.getElementById('reportEvidence').value = '';
                showStatus('✅ 举报已提交，管理员将尽快审核', 'success');
                await loadReports();
            } catch (error) { console.error('提交举报失败:', error); showStatus('❌ 提交失败: ' + error.message, 'error'); }
        }

        async function checkUserExists(username) {
            if (username === 'huangzhiyuan') return true;
            try {
                const url = 'https://api.github.com/repos/' + window.CONFIG.GITHUB_USERNAME + '/' + window.CONFIG.GITHUB_REPO + '/issues?labels=user&state=open';
                const res = await fetch(url, { headers: { 'Authorization': 'token ' + window.CONFIG.GITHUB_TOKEN, 'Accept': 'application/vnd.github.v3+json' } });
                const issues = await res.json();
                for (const issue of issues) {
                    const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) { const userData = JSON.parse(match[1]); if (userData.username === username) return true; }
                }
                return false;
            } catch { return false; }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('reportStatus');
            el.textContent = msg; el.className = 'status-msg ' + type;
            setTimeout(function() { el.className = 'status-msg'; el.textContent = ''; }, 4000);
        }

        // ============================================================
        //  渲染举报历史
        // ============================================================
        function renderHistory() {
            const container = document.getElementById('reportHistory');
            const userReports = allReports.filter(function(r) { return r.reporter === currentUser.username; });
            if (userReports.length === 0) { container.innerHTML = '<div style="color:#666;text-align:center;padding:40px;">暂无举报记录</div>'; return; }
            container.innerHTML = userReports.map(function(r) {
                return '<div class="report-item"><div><span class="reporter">👤 ' + escapeHtml(r.reporter) + '</span> → <span class="target">' + escapeHtml(r.targetUser) + '</span></div><div class="reason">📌 ' + escapeHtml(r.reason) + (r.evidence ? ' · <a href="' + escapeHtml(r.evidence) + '" target="_blank" style="color:#ffd700;">证据链接</a>' : '') + '</div><div class="reason" style="color:#888;font-size:13px;">' + escapeHtml(r.description) + '</div><div><span class="status ' + r.status + '">' + getStatusText(r.status) + '</span>' + (r.resolvedAt ? '<span style="font-size:11px;color:#666;margin-left:8px;">处理时间: ' + new Date(r.resolvedAt).toLocaleString() + '</span>' : '') + (r.adminNote ? '<div style="font-size:12px;color:#aaa;margin-top:4px;">📝 管理员备注: ' + escapeHtml(r.adminNote) + '</div>' : '') + '</div><div class="time">📅 ' + new Date(r.createdAt).toLocaleString() + '</div></div>';
            }).join('');
        }

        function getStatusText(status) {
            if (status === 'pending') return '⏳ 待审核';
            if (status === 'resolved') return '✅ 已处理';
            return '❌ 已驳回';
        }

        // ============================================================
        //  管理员审核
        // ============================================================
        function renderAdminList() {
            const container = document.getElementById('adminReportList');
            if (allReports.length === 0) { container.innerHTML = '<div style="color:#666;text-align:center;padding:40px;">暂无举报</div>'; return; }
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const paginated = allReports.slice(start, end);
            const pendingReports = allReports.filter(function(r) { return r.status === 'pending'; });
            var html = '';
            if (pendingReports.length > 0) {
                html += '<h3 style="color:#f39c12;margin-bottom:12px;">⏳ 待审核 (' + pendingReports.length + ')</h3>';
                html += paginated.filter(function(r) { return r.status === 'pending'; }).map(function(r) {
                    return '<div class="report-item" style="border-left-color:#f39c12;"><div><span class="reporter">👤 ' + escapeHtml(r.reporter) + '</span> → <span class="target">' + escapeHtml(r.targetUser) + '</span></div><div class="reason">📌 ' + escapeHtml(r.reason) + '</div><div class="reason" style="color:#888;font-size:13px;">' + escapeHtml(r.description) + '</div>' + (r.evidence ? '<div class="reason"><a href="' + escapeHtml(r.evidence) + '" target="_blank" style="color:#ffd700;">🔗 证据链接</a></div>' : '') + '<div class="time">📅 ' + new Date(r.createdAt).toLocaleString() + '</div><div class="admin-actions"><button class="resolve-btn" onclick="resolveReport(\'' + r.id + '\')">✅ 处理</button><button class="reject-btn" onclick="rejectReport(\'' + r.id + '\')">❌ 驳回</button><button class="ban-btn" onclick="banUserFromReport(\'' + r.id + '\')">🚫 封禁用户</button><input type="text" id="adminNote_' + r.id + '" class="admin-note-input" placeholder="备注（可选）"></div></div>';
                }).join('');
            }
            var resolvedReports = allReports.filter(function(r) { return r.status !== 'pending'; });
            if (resolvedReports.length > 0) {
                html += '<h3 style="color:#2ecc71;margin-top:20px;margin-bottom:12px;">✅ 已处理 (' + resolvedReports.length + ')</h3>';
                html += paginated.filter(function(r) { return r.status !== 'pending'; }).map(function(r) {
                    return '<div class="report-item" style="border-left-color:' + (r.status === 'resolved' ? '#2ecc71' : '#dc3545') + ';"><div><span class="reporter">👤 ' + escapeHtml(r.reporter) + '</span> → <span class="target">' + escapeHtml(r.targetUser) + '</span></div><div class="reason">📌 ' + escapeHtml(r.reason) + '</div><div><span class="status ' + r.status + '">' + getStatusText(r.status) + '</span>' + (r.resolvedBy ? '<span style="font-size:11px;color:#666;margin-left:8px;">处理人: ' + escapeHtml(r.resolvedBy) + '</span>' : '') + '</div>' + (r.adminNote ? '<div style="font-size:12px;color:#aaa;">📝 ' + escapeHtml(r.adminNote) + '</div>' : '') + '<div class="time">📅 ' + new Date(r.createdAt).toLocaleString() + '</div></div>';
                }).join('');
            }
            var totalPages = Math.ceil(allReports.length / PAGE_SIZE);
            if (totalPages > 1) {
                html += '<div class="pagination">';
                html += '<button onclick="changePage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>←</button>';
                for (var i = 1; i <= totalPages; i++) { html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="changePage(' + i + ')">' + i + '</button>'; }
                html += '<button onclick="changePage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>→</button>';
                html += '</div>';
            }
            container.innerHTML = html || '<div style="color:#666;text-align:center;padding:40px;">暂无举报</div>';
        }

        function changePage(page) {
            var totalPages = Math.ceil(allReports.length / PAGE_SIZE);
            if (page < 1 || page > totalPages) return;
            currentPage = page; renderAdminList();
        }

        async function updateReportOnGitHub(report) {
            try {
                var issueBody = '举报信息\n```json\n' + JSON.stringify(report, null, 2) + '\n```';
                await fetch('https://api.github.com/repos/' + window.CONFIG.GITHUB_USERNAME + '/' + window.CONFIG.GITHUB_REPO + '/issues/' + report.issueNumber, {
                    method: 'PATCH',
                    headers: { 'Authorization': 'token ' + window.CONFIG.GITHUB_TOKEN, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ body: issueBody })
                });
            } catch (error) { console.error('更新举报失败:', error); alert('更新失败: ' + error.message); }
        }

        async function resolveReport(reportId) {
            var report = allReports.find(function(r) { return r.id === reportId; });
            if (!report) return;
            var noteInput = document.getElementById('adminNote_' + reportId);
            report.status = 'resolved'; report.resolvedAt = new Date().toISOString(); report.resolvedBy = currentUser.username; report.adminNote = noteInput ? noteInput.value : '';
            await updateReportOnGitHub(report);
            alert('✅ 举报已标记为已处理');
            await loadReports();
        }

        async function rejectReport(reportId) {
            var report = allReports.find(function(r) { return r.id === reportId; });
            if (!report) return;
            var noteInput = document.getElementById('adminNote_' + reportId);
            report.status = 'rejected'; report.resolvedAt = new Date().toISOString(); report.resolvedBy = currentUser.username; report.adminNote = noteInput ? noteInput.value : '';
            await updateReportOnGitHub(report);
            alert('❌ 举报已驳回');
            await loadReports();
        }

        async function banUserFromReport(reportId) {
            var report = allReports.find(function(r) { return r.id === reportId; });
            if (!report) return;
            if (!confirm('确定要封禁用户 ' + report.targetUser + ' 吗？')) return;
            var success = await toggleUserBan(report.targetUser, true);
            if (success) {
                report.status = 'resolved'; report.resolvedAt = new Date().toISOString(); report.resolvedBy = currentUser.username;
                var noteInput = document.getElementById('adminNote_' + reportId);
                report.adminNote = noteInput ? noteInput.value : '用户已被封禁';
                await updateReportOnGitHub(report);
                alert('✅ 用户 ' + report.targetUser + ' 已被封禁');
                await loadReports();
            }
        }

        async function toggleUserBan(username, shouldBan) {
            try {
                var url = 'https://api.github.com/repos/' + window.CONFIG.GITHUB_USERNAME + '/' + window.CONFIG.GITHUB_REPO + '/issues?labels=user&state=open';
                var res = await fetch(url, { headers: { 'Authorization': 'token ' + window.CONFIG.GITHUB_TOKEN, 'Accept': 'application/vnd.github.v3+json' } });
                var issues = await res.json();
                for (var i = 0; i < issues.length; i++) {
                    var match = issues[i].body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) {
                        var userData = JSON.parse(match[1]);
                        if (userData.username === username) {
                            userData.isBanned = shouldBan;
                            await fetch('https://api.github.com/repos/' + window.CONFIG.GITHUB_USERNAME + '/' + window.CONFIG.GITHUB_REPO + '/issues/' + issues[i].number, {
                                method: 'PATCH',
                                headers: { 'Authorization': 'token ' + window.CONFIG.GITHUB_TOKEN, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                                body: JSON.stringify({ body: '用户信息\n```json\n' + JSON.stringify(userData, null, 2) + '\n```' })
                            });
                            return true;
                        }
                    }
                }
                return false;
            } catch (error) { console.error('封禁失败:', error); alert('封禁失败: ' + error.message); return false; }
        }

        function updateStats() {
            var total = allReports.length;
            var pending = allReports.filter(function(r) { return r.status === 'pending'; }).length;
            document.getElementById('totalUsers').textContent = total;
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-bar a').forEach(function(a) { a.classList.remove('active'); });
            document.getElementById('reportTab').style.display = 'none';
            document.getElementById('historyTab').style.display = 'none';
            document.getElementById('adminTab').style.display = 'none';
            if (tab === 'report') {
                document.querySelector('.nav-bar a:first-child').classList.add('active');
                document.getElementById('reportTab').style.display = 'block';
            } else if (tab === 'history') {
                document.querySelector('.nav-bar a:nth-child(2)').classList.add('active');
                document.getElementById('historyTab').style.display = 'block';
                renderHistory();
            } else if (tab === 'admin') {
                document.querySelector('.nav-bar a:nth-child(3)').classList.add('active');
                document.getElementById('adminTab').style.display = 'block';
                renderAdminList();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadReports();
        setInterval(loadReports, 30000);

        window.submitReport = submitReport;
        window.switchTab = switchTab;
        window.resolveReport = resolveReport;
        window.rejectReport = rejectReport;
        window.banUserFromReport = banUserFromReport;
        window.changePage = changePage;

        console.log('🚨 举报中心已加载（GitHub Issues 存储），当前用户:', currentUser ? currentUser.username : '');
    </script>
    <script src="js/theme.js"></script>
</body>
</html>
