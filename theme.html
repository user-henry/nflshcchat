<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>const WORKER_API='https://worker.nflshcchat.cc.cd';</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 主题设置</title>
    <link rel="stylesheet" href="css/themes.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.4s, color 0.4s;
        }

        /* 顶部导航 */
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.4s, border-color 0.4s;
        }
        .top-bar .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.3s;
        }
        .top-bar .back-link:hover { opacity: 0.8; }
        .top-bar .title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .top-bar .badge {
            background: var(--accent-color);
            color: var(--bg-primary, #1a1a2e);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* 主内容 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .page-desc {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 15px;
            line-height: 1.6;
        }
        .page-desc .current-name {
            color: var(--accent-color);
            font-weight: 700;
        }

        /* 主题卡片网格 */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .theme-card {
            background: var(--bg-secondary);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            user-select: none;
        }
        .theme-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border-color: var(--accent-color);
        }
        .theme-card:active {
            transform: scale(0.97);
        }
        .theme-card.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.15), 0 8px 25px rgba(0,0,0,0.2);
        }
        .theme-card .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            transition: transform 0.3s;
        }
        .theme-card:hover .icon { transform: scale(1.1); }
        .theme-card .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .theme-card .accent-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .theme-card .preview-bar {
            display: flex;
            gap: 6px;
            margin-top: 14px;
            justify-content: center;
        }
        .theme-card .preview-swatch {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.15);
        }
        .theme-card .check-mark {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-color);
            color: var(--bg-primary, #1a1a2e);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .theme-card.active .check-mark { display: flex; }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid var(--accent-color);
            font-size: 15px;
            font-weight: 600;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container { padding: 20px 12px; }
            .theme-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
            .theme-card { padding: 20px 12px; }
            .theme-card .icon { font-size: 36px; }
            .theme-card .name { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="top-bar">
        <a href="index.html" class="back-link">← 返回登录</a>
        <span class="title">主题设置</span>
        <span class="badge" id="currentBadge">暗夜黑金</span>
    </div>

    <!-- 主内容 -->
    <div class="container">
        <p class="page-desc">
            当前主题：<span class="current-name" id="currentName">暗夜黑金</span><br>
            选择下方主题即可一键切换，所有页面即时生效
        </p>
        <div class="theme-grid" id="themeGrid"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="js/theme.js"></script>
    <script>
    (function() {
        var THEME_KEY = 'nflshc_theme';

        // 内联主题定义（不依赖外部文件，确保始终可用）
        var INLINE_THEMES = {
            dark:   { id: 'dark',   name: '暗夜黑金', icon: '🌙', accent: '#ffd700' },
            light:  { id: 'light',  name: '晨曦白光', icon: '☀️', accent: '#ffd700' },
            blue:   { id: 'blue',   name: '深海蓝调', icon: '🌊', accent: '#3498db' },
            purple: { id: 'purple', name: '紫罗兰夜', icon: '🔮', accent: '#9b59b6' },
            green:  { id: 'green',  name: '翡翠绿意', icon: '🌿', accent: '#2ecc71' }
        };
        var themeIds = ['dark', 'light', 'blue', 'purple', 'green'];

        // 每个主题的颜色预览样本
        var swatches = {
            dark:   ['#1a1a2e', '#16213e', '#0f0f1a', '#ffd700'],
            light:  ['#f5f5f5', '#ffffff', '#e8e8e8', '#ffd700'],
            blue:   ['#0d2137', '#122c47', '#091a2c', '#3498db'],
            purple: ['#1a0a2e', '#251545', '#0f0520', '#9b59b6'],
            green:  ['#0a2e1a', '#0f4525', '#052010', '#2ecc71']
        };

        // 从 localStorage 读取当前主题
        function getStoredTheme() {
            try { return localStorage.getItem(THEME_KEY) || 'dark'; }
            catch (e) { return 'dark'; }
        }
        var current = getStoredTheme();

        var toastTimer = null;
        var grid = document.getElementById('themeGrid');
        var badge = document.getElementById('currentBadge');
        var nameEl = document.getElementById('currentName');

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2000);
        }

        function updateUI(themeId) {
            var info = INLINE_THEMES[themeId] || INLINE_THEMES['dark'];
            if (badge) badge.textContent = info.name;
            if (nameEl) nameEl.textContent = info.name;

            if (!grid) return;
            var cards = grid.querySelectorAll('.theme-card');
            for (var i = 0; i < cards.length; i++) {
                var card = cards[i];
                if (card.getAttribute('data-theme-id') === themeId) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            }
        }

        function renderCards() {
            if (!grid) return;
            var html = '';
            for (var i = 0; i < themeIds.length; i++) {
                var id = themeIds[i];
                var t = INLINE_THEMES[id];
                if (!t) continue;
                var isActive = (id === current);
                var sc = swatches[id] || [];

                html += '<div class="theme-card' + (isActive ? ' active' : '') + '" data-theme-id="' + id + '">';
                html += '<span class="check-mark">&#10003;</span>';
                html += '<span class="icon">' + t.icon + '</span>';
                html += '<div class="name">' + t.name + '</div>';
                html += '<div class="preview-bar">';
                for (var s = 0; s < sc.length; s++) {
                    html += '<span class="preview-swatch" style="background:' + sc[s] + '"></span>';
                }
                html += '</div>';
                html += '</div>';
            }
            grid.innerHTML = html;

            // 绑定点击事件
            var cards = grid.querySelectorAll('.theme-card');
            for (var j = 0; j < cards.length; j++) {
                (function(card) {
                    card.addEventListener('click', function() {
                        var tid = card.getAttribute('data-theme-id');
                        selectTheme(tid);
                    });
                })(cards[j]);
            }
        }

        function applyTheme(themeId) {
            var htmlEl = document.documentElement;
            if (!htmlEl) return;
            if (themeId === 'dark') {
                htmlEl.removeAttribute('data-theme');
            } else {
                htmlEl.setAttribute('data-theme', themeId);
            }
        }

        function selectTheme(themeId) {
            if (themeId === current) return;
            if (!INLINE_THEMES[themeId]) return;

            // 存储 + 应用
            try { localStorage.setItem(THEME_KEY, themeId); } catch (e) {}
            applyTheme(themeId);
            current = themeId;

            // 也通过 ThemeManager 同步（如果可用）
            if (window.ThemeManager && window.ThemeManager.setTheme) {
                try { window.ThemeManager.setTheme(themeId); } catch (e) {}
            }

            updateUI(themeId);
            showToast('已切换至 ' + INLINE_THEMES[themeId].name);
        }

        // 页面加载：先应用当前主题（确保 data-theme 正确）
        applyTheme(current);

        // 渲染 UI
        updateUI(current);
        renderCards();
    })();
    </script>
</body>
</html>
