<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 主题设置</title>
    <link rel="stylesheet" href="css/themes.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.4s, color 0.4s;
        }

        /* 顶部导航 */
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.4s, border-color 0.4s;
        }
        .top-bar .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.3s;
        }
        .top-bar .back-link:hover { opacity: 0.8; }
        .top-bar .title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .top-bar .badge {
            background: var(--accent-color);
            color: #1a1a2e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* 主内容 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .page-desc {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 15px;
            line-height: 1.6;
        }
        .page-desc .current-name {
            color: var(--accent-color);
            font-weight: 700;
        }

        /* 主题卡片网格 */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .theme-card {
            background: var(--bg-secondary);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            user-select: none;
        }
        .theme-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border-color: var(--accent-color);
        }
        .theme-card:active {
            transform: scale(0.97);
        }
        .theme-card.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.15), 0 8px 25px rgba(0,0,0,0.2);
        }
        .theme-card .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            transition: transform 0.3s;
        }
        .theme-card:hover .icon { transform: scale(1.1); }
        .theme-card .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .theme-card .accent-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .theme-card .preview-bar {
            display: flex;
            gap: 6px;
            margin-top: 14px;
            justify-content: center;
        }
        .theme-card .preview-swatch {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.15);
        }
        .theme-card .check-mark {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-color);
            color: #1a1a2e;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .theme-card.active .check-mark { display: flex; }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid var(--accent-color);
            font-size: 15px;
            font-weight: 600;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container { padding: 20px 12px; }
            .theme-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
            .theme-card { padding: 20px 12px; }
            .theme-card .icon { font-size: 36px; }
            .theme-card .name { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="top-bar">
        <a href="index.html" class="back-link">← 返回登录</a>
        <span class="title">主题设置</span>
        <span class="badge" id="currentBadge">暗夜黑金</span>
    </div>

    <!-- 主内容 -->
    <div class="container">
        <p class="page-desc">
            当前主题：<span class="current-name" id="currentName">暗夜黑金</span><br>
            选择下方主题即可一键切换，所有页面即时生效
        </p>
        <div class="theme-grid" id="themeGrid"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="js/theme.js"></script>
    <script>
    (function() {
        var themes = window.ThemeManager.getThemes();
        var themeIds = ['dark', 'light', 'blue', 'purple', 'green'];
        var current = window.ThemeManager.getTheme();
        var toastTimer = null;
        var grid = document.getElementById('themeGrid');
        var badge = document.getElementById('currentBadge');
        var nameEl = document.getElementById('currentName');

        // 每个主题的颜色预览样本
        var swatches = {
            dark:   ['#1a1a2e', '#16213e', '#0f0f1a', '#ffd700'],
            light:  ['#f5f5f5', '#ffffff', '#e8e8e8', '#ffd700'],
            blue:   ['#0d2137', '#122c47', '#091a2c', '#3498db'],
            purple: ['#1a0a2e', '#251545', '#0f0520', '#9b59b6'],
            green:  ['#0a2e1a', '#0f4525', '#052010', '#2ecc71']
        };

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2000);
        }

        function updateUI(themeId) {
            var info = window.ThemeManager.getThemeInfo(themeId);
            badge.textContent = info.name;
            nameEl.textContent = info.name;

            var cards = grid.querySelectorAll('.theme-card');
            cards.forEach(function(card) {
                if (card.getAttribute('data-theme-id') === themeId) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }

        function renderCards() {
            var html = '';
            for (var i = 0; i < themeIds.length; i++) {
                var id = themeIds[i];
                var t = themes[id];
                if (!t) continue;
                var isActive = (id === current);
                var swatchColors = swatches[id] || [];

                html += '<div class="theme-card' + (isActive ? ' active' : '') + '" data-theme-id="' + id + '">';
                html += '<span class="check-mark">✓</span>';
                html += '<span class="icon">' + t.icon + '</span>';
                html += '<div class="name">' + t.name + '</div>';
                html += '<div class="preview-bar">';
                for (var s = 0; s < swatchColors.length; s++) {
                    html += '<span class="preview-swatch" style="background:' + swatchColors[s] + '"></span>';
                }
                html += '</div>';
                html += '</div>';
            }
            grid.innerHTML = html;

            // 绑定点击事件
            var cards = grid.querySelectorAll('.theme-card');
            cards.forEach(function(card) {
                card.addEventListener('click', function() {
                    var themeId = this.getAttribute('data-theme-id');
                    selectTheme(themeId);
                });
            });
        }

        function selectTheme(themeId) {
            if (themeId === current) return; // 同主题不重复切换

            var info = window.ThemeManager.getThemeInfo(themeId);
            if (!info) return;

            // 执行切换
            window.ThemeManager.setTheme(themeId);
            current = themeId;

            // 更新 UI
            updateUI(themeId);
            showToast('已切换至 ' + info.name);
        }

        // 启动
        updateUI(current);
        renderCards();
    })();
    </script>
</body>
</html>
