<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>const WORKER_API='https://worker.nflshcchat.cc.cd';</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 管理员后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
        }
        .nav {
            background: var(--bg-secondary);
            padding: 15px 30px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--accent-color);
        }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .logo {
            width: 40px;
            height: 40px;
            background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .nav h2 { font-size: 20px; color: var(--accent-color); }
        .nav a { color: var(--text-primary); text-decoration: none; margin-left: 20px; transition: color 0.3s; }
        .nav a:hover { color: var(--accent-color); }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .stat-number { font-size: 36px; font-weight: bold; color: var(--accent-color); }
        .stat-label { color: var(--text-secondary); margin-top: 8px; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active { background: var(--accent-color); color: var(--bg-primary); border-color: var(--accent-color); }
        
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }
        .card h2 { color: var(--accent-color); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .room-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #2a2a3e;
            transition: transform 0.2s;
        }
        .room-card:hover { transform: translateY(-3px); border-color: var(--accent-color, #ffd700); }
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .room-name { font-size: 18px; font-weight: bold; color: var(--accent-color, #ffd700); }
        .room-type {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .room-type.private { background: #dc3545; color: white; }
        .room-type.group { background: #28a745; color: white; }
        .room-info p { color: var(--text-secondary, #aaa); font-size: 13px; margin-bottom: 6px; }
        .room-members {
            background: #0f0f1a;
            border-radius: 8px;
            padding: 10px;
            margin: 12px 0;
        }
        .room-members h4 { color: var(--accent-color, #ffd700); font-size: 12px; margin-bottom: 8px; }
        .member-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .member-tag {
            background: #2a2a3e;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            color: #ddd;
        }
        .member-tag.creator { background: #ffd700; color: var(--bg-primary, #1a1a2e); }
        
        .user-list { max-height: 500px; overflow-y: auto; }
        .user-item {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .user-info { flex: 1; }
        .user-name { font-weight: bold; color: var(--accent-color, #ffd700); margin-bottom: 5px; }
        .user-meta { font-size: 12px; color: var(--text-secondary, #aaa); }
        .admin-badge, .banned-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
        }
        .admin-badge { background: #ffd700; color: var(--bg-primary, #1a1a2e); }
        .banned-badge { background: #dc3545; color: white; }
        
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .ban-user-btn, .unban-user-btn, .notify-user-btn, .ban-btn, .unban-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .ban-user-btn, .ban-btn { background: #dc3545; color: white; }
        .unban-user-btn, .unban-btn { background: #28a745; color: white; }
        .notify-user-btn { background: #ffc107; color: var(--bg-primary, #1a1a2e); }
        
        .clean-btn {
            background: #dc3545;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .clean-btn:hover { transform: translateY(-2px); background: #c82333; }
        .clean-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted, #666); }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary, #aaa); }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #16213e;
            padding: 30px;
            border-radius: 16px;
            width: 450px;
            border: 1px solid #ffd700;
        }
        .modal-content h3 { color: var(--accent-color, #ffd700); margin-bottom: 20px; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color, #2a2a3e);
            border-radius: 8px;
            background: var(--bg-primary, #1a1a2e);
            color: var(--text-primary, #fff);
            font-family: inherit;
        }
        .modal-content textarea { resize: vertical; min-height: 100px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-buttons button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        .modal-buttons button:first-child { background: #2a2a3e; color: white; }
        .modal-buttons button:last-child { background: #ffd700; color: var(--bg-primary, #1a1a2e); }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #0f0f1a;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: #ffd700;
            width: 0%;
            transition: width 0.3s;
        }
        .stats-info {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary, #aaa);
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .rooms-grid { grid-template-columns: 1fr; }
            .user-item { flex-direction: column; align-items: flex-start; }
            .actions { align-self: flex-end; }
        }
    </style>
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="nav">
        <div class="nav-left"><div class="logo"></div><h2>👑 NFLSHC Chat 管理后台</h2></div>
        <div>
            <span>欢迎，管理员 <span id="adminName"></span></span>
            <a href="admin-suggestions.html">💡 建议审核</a>
            <a href="chat.html">💬 聊天</a>
            <a href="notice.html">📢 公告</a>
            <a href="index.html" onclick="logout()">🚪 退出</a>
        </div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="totalUsers">0</div><div class="stat-label">总用户数</div></div>
            <div class="stat-card"><div class="stat-number" id="totalRooms">0</div><div class="stat-label">聊天室总数</div></div>
            <div class="stat-card"><div class="stat-number" id="totalGroupRooms">0</div><div class="stat-label">群聊数量</div></div>
            <div class="stat-card"><div class="stat-number" id="totalPrivateRooms">0</div><div class="stat-label">私聊数量</div></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('rooms')">💬 所有聊天室</button>
            <button class="tab-btn" onclick="switchTab('users')">👥 用户管理</button>
            <button class="tab-btn" onclick="switchTab('notifications')">📨 系统通知</button>
            <button class="tab-btn" onclick="switchTab('audit')">🛡️ 消息审计</button>
            <button class="tab-btn" onclick="switchTab('bans')">🔒 封禁管理</button>
        </div>

        <div id="roomsTab" class="card">
            <h2>📋 所有聊天室</h2>
            <div id="roomsList" class="rooms-grid"><div class="loading">加载中...</div></div>
        </div>

        <div id="usersTab" class="card" style="display: none;">
            <h2>👥 用户管理</h2>
            <div id="usersList" class="user-list"><div class="loading">加载中...</div></div>
            <div style="margin-top: 25px; text-align: center; padding-top: 20px; border-top: 1px solid #2a2a3e;">
                <button id="cleanDuplicateUsersBtn" class="clean-btn" onclick="cleanDuplicateUsers()">
                    🧹 清除多余账号
                </button>
                <p style="font-size: 12px; color: var(--text-secondary, #aaa); margin-top: 10px;">
                    此操作将删除因重复注册产生的相同用户名账号，仅保留最新创建的一个。
                </p>
            </div>
        </div>

        <div id="notificationsTab" class="card" style="display: none;">
            <h2>📨 系统通知记录</h2>
            <div id="notificationsList" class="user-list"><div class="loading">加载中...</div></div>
        </div>

        <div id="auditTab" class="card" style="display: none;">
            <h2>🛡️ 消息审计</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;">
                <select id="auditRoomFilter" style="flex:1; min-width: 200px; padding: 8px;"><option value="">全部聊天室</option></select>
                <input type="text" id="auditUserFilter" placeholder="按用户搜索（留空=全部）" style="flex:1; min-width: 160px; padding: 8px;">
                <button onclick="renderAudit()" style="padding: 8px 18px;">🔍 筛选</button>
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                <button onclick="auditSelectAll()" style="padding: 6px 14px;">☑️ 全选当前筛选结果</button>
                <button onclick="auditAiAnalyze()" style="padding: 6px 14px; background: #3498db; color: white;">🤖 用思知 AI 分析违规</button>
                <button onclick="auditDeleteSelected()" style="padding: 6px 14px; background: #dc3545; color: white;">🗑️ 删除选中违规消息</button>
                <span id="auditStatus" style="color: var(--text-secondary, #aaa); font-size: 12px; align-self: center;"></span>
            </div>
            <div id="auditResult" style="margin-bottom: 12px; display: none;"></div>
            <div id="auditMessages" class="user-list"><div class="loading">加载中...</div></div>
        </div>

        <div id="bansTab" class="card" style="display: none;">
            <h2>🔒 封禁管理</h2>
            <h3 style="margin: 14px 0 8px; color: var(--accent-color, #ffd700);">🚫 被封禁 IP</h3>
            <div id="bannedIpsList" class="user-list"><div class="loading">加载中...</div></div>
            <h3 style="margin: 20px 0 8px; color: var(--accent-color, #ffd700);">🧊 已冻结用户（可在此解冻）</h3>
            <div id="frozenUsersList" class="user-list"><div class="loading">加载中...</div></div>
        </div>
    </div>

    <div id="notifyModal" class="modal">
        <div class="modal-content">
            <h3>📨 发送系统通知</h3>
            <p style="color: var(--text-secondary, #aaa); margin-bottom: 15px;">发送给: <span id="notifyTargetUser" style="color: var(--accent-color, #ffd700);"></span></p>
            <input type="text" id="notifyTitle" placeholder="通知标题">
            <textarea id="notifyMessage" placeholder="通知内容..."></textarea>
            <div class="modal-buttons">
                <button onclick="closeNotifyModal()">取消</button>
                <button onclick="sendSystemNotification()">发送通知</button>
            </div>
        </div>
    </div>

    <div id="loadingProgress" style="display: none; margin: 20px;">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <div id="progressText" class="stats-info"></div>
    </div>

    
    <script>
        let currentAdmin = null;
        let allUsers = [];
        let allRooms = [];
        let allMessages = [];
        let allNotifications = [];
        let currentNotifyUser = null;

        function checkAdmin() {
            const userStr = sessionStorage.getItem('currentUser');
            if (!userStr) { window.location.href = 'index.html'; return null; }
            const user = JSON.parse(userStr);
            if (!user.isAdmin) { alert('无权访问管理员后台'); window.location.href = 'chat.html'; return null; }
            document.getElementById('adminName').textContent = user.username;
            return user;
        }
        function logout() { 
            // 清除 localStorage 和 sessionStorage 中的登录状态
            localStorage.removeItem('nflshc_currentUser');
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('nflshc_user');
            // 如果有全局清除函数也调用一下
            if (window.clearLoginState) window.clearLoginState();
            window.location.href = 'index.html'; 
        }

        // 统一解析 issue.body 中的 JSON 代码块。
        // 使用贪婪匹配到最后一个 ``` ，避免正文内嵌代码块导致内容被截断。
        function parseIssueJson(issue) {
            if (!issue || typeof issue.body !== 'string') return null;
            const match = issue.body.match(/```json\s*\n([\s\S]*)\n```/);
            if (!match) return null;
            try {
                return JSON.parse(match[1]);
            } catch (e) {
                // 回退到非贪婪匹配，兼容正文尾部还有其他内容的情况
                const fallback = issue.body.match(/```json\s*\n([\s\S]*?)\n```/);
                if (!fallback) return null;
                try { return JSON.parse(fallback[1]); } catch (e2) { return null; }
            }
        }

        // ========== 加载所有消息 ==========
        // 注意：Worker 的 /api/legacy/issues 会一次性返回该 label 的全部记录，
        // 并不支持 page/per_page 分页，也不返回 Link 头。
        // 因此这里只请求一次；若沿用旧的翻页循环会重复累加同一批数据。
        async function loadAllMessages() {
            const progressDiv = document.getElementById('loadingProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            if (progressDiv) progressDiv.style.display = 'block';
            if (progressText) progressText.innerHTML = '正在加载消息...';
            if (progressFill) progressFill.style.width = '30%';

            const allMsg = [];
            try {
                // 聊天消息存在专用 messages 表，不在 legacy chatmessage issues 里。
                // 旧写法查 misc_issues，永远返回 0 条，导致"消息总数"恒为 0。
                const url = `${WORKER_API}/api/messages?limit=50000`;
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const rows = await res.json();

                for (const m of (Array.isArray(rows) ? rows : [])) {
                    allMsg.push({
                        id: m.id,
                        roomId: m.room_id || m.roomId,
                        sender: m.sender,
                        content: m.content,
                        timestamp: m.timestamp,
                        isRecalled: !!(m.is_recalled || m.isRecalled),
                        isPinned: !!(m.is_pinned || m.isPinned),
                        number: m.id
                    });
                }

                if (progressFill) progressFill.style.width = '100%';
                if (progressText) progressText.innerHTML = `✅ 消息加载完成！共 ${allMsg.length} 条消息`;
                setTimeout(() => { if (progressDiv) progressDiv.style.display = 'none'; }, 1500);
            } catch (e) {
                console.error('加载消息失败:', e);
                if (progressText) progressText.innerHTML = '❌ 消息加载失败：' + (e && e.message ? e.message : e);
            }

            return allMsg;
        }

        async function loadAllData() {
            try {
                const baseUrl = `${WORKER_API}/api/legacy/issues`;
                
                // 用户数据
                const usersRes = await fetch(`${baseUrl}?labels=user&state=open`, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                const userIssues = await usersRes.json();
                allUsers = [];
                for (const issue of (Array.isArray(userIssues) ? userIssues : [])) {
                    const userData = parseIssueJson(issue);
                    if (userData) allUsers.push({ ...userData, issueNumber: issue.number });
                }

                // 聊天室数据
                const roomsRes = await fetch(`${baseUrl}?labels=chatroom&state=open`, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                const roomIssues = await roomsRes.json();
                allRooms = [];
                for (const issue of (Array.isArray(roomIssues) ? roomIssues : [])) {
                    const roomData = parseIssueJson(issue);
                    if (roomData) allRooms.push({ ...roomData, issueNumber: issue.number });
                }

                // 消息数据（分页加载所有）
                allMessages = await loadAllMessages();

                // 通知数据
                const notifRes = await fetch(`${baseUrl}?labels=system_notification&state=open`, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                const notifIssues = await notifRes.json();
                allNotifications = [];
                for (const issue of (Array.isArray(notifIssues) ? notifIssues : [])) {
                    const notifData = parseIssueJson(issue);
                    if (notifData) allNotifications.push(notifData);
                }

                updateStats();
                renderRooms();
                renderUsers();
                renderNotifications();
            } catch (error) {
                console.error('加载数据失败:', error);
                const progressDiv = document.getElementById('loadingProgress');
                const progressText = document.getElementById('progressText');
                if (progressDiv && progressText) {
                    progressDiv.style.display = 'block';
                    progressText.textContent = '❌ 加载失败：' + (error && error.message ? error.message : error);
                }
            }
        }

        function updateStats() {
            const groupRooms = allRooms.filter(r => r.type === 'group');
            const privateRooms = allRooms.filter(r => r.type === 'private');
            document.getElementById('totalUsers').textContent = allUsers.length;
            document.getElementById('totalRooms').textContent = allRooms.length;
            document.getElementById('totalGroupRooms').textContent = groupRooms.length;
            document.getElementById('totalPrivateRooms').textContent = privateRooms.length;
        }

        function getMessageCount(roomId) { return allMessages.filter(m => m.roomId === roomId).length; }
        function getActiveMembers(roomId) { return [...new Set(allMessages.filter(m => m.roomId === roomId).map(m => m.sender))]; }
        
        // ========== 私聊聊天双方显示 ==========
        function getRoomMembersDisplay(room) {
            const activeMembers = getActiveMembers(room.id);
            
            if (room.type === 'group') {
                if (activeMembers.length > 0) return activeMembers;
                return [room.creator];
            } else {
                if (activeMembers.length >= 2) return activeMembers;
                if (room.members && room.members.length >= 2) return room.members;
                if (room.privateWith) return [room.creator, room.privateWith];
                const nameMatch = room.name.match(/(.+?)\s+和\s+(.+?)\s+的私聊/);
                if (nameMatch) return [nameMatch[1], nameMatch[2]];
                if (activeMembers.length === 1) {
                    const singleMember = activeMembers[0];
                    const otherSenders = [...new Set(allMessages.filter(m => m.roomId === room.id && m.sender !== singleMember).map(m => m.sender))];
                    if (otherSenders.length > 0) return [singleMember, otherSenders[0]];
                    if (room.members && room.members.length === 1) return [singleMember, room.creator];
                    return [singleMember, '未知用户'];
                }
                return [room.creator, '私聊对象'];
            }
        }

        function renderRooms() {
            const container = document.getElementById('roomsList');
            if (allRooms.length === 0) { container.innerHTML = '<div class="empty-state">暂无聊天室</div>'; return; }
            container.innerHTML = allRooms.map(room => {
                const members = getRoomMembersDisplay(room);
                const messageCount = getMessageCount(room.id);
                return `
                    <div class="room-card">
                        <div class="room-header">
                            <span class="room-name">${escapeHtml(room.name)}</span>
                            <span class="room-type ${room.type}">${room.type === 'group' ? '👥 群聊' : '🔒 私聊'}</span>
                        </div>
                        <div class="room-info">
                            <p>📅 创建时间: ${new Date(room.createdAt).toLocaleString()}</p>
                            <p>👤 创建者: ${escapeHtml(room.creator)}</p>
                            <p>📊 消息总数: ${messageCount} 条</p>
                            <p>👥 ${room.type === 'group' ? '活跃成员数' : '参与人数'}: ${members.length} 人</p>
                            ${room.isBanned ? '<p style="color: #dc3545;">🚫 状态: 已封禁</p>' : '<p style="color: #28a745;">✅ 状态: 正常</p>'}
                        </div>
                        <div class="room-members">
                            <h4>📋 ${room.type === 'group' ? '活跃成员列表' : '聊天双方'}</h4>
                            <div class="member-list">
                                ${members.map(m => `<span class="member-tag ${m === room.creator ? 'creator' : ''}">${escapeHtml(m)}${m === room.creator ? ' (创建者)' : ''}</span>`).join('')}
                            </div>
                        </div>
                        ${room.type === 'group' ? `
                            <div>${room.isBanned ? 
                                `<button class="unban-btn" onclick="toggleRoomBan('${room.id}', false)">解除封禁群聊</button>` :
                                `<button class="ban-btn" onclick="toggleRoomBan('${room.id}', true)">封禁群聊</button>`}
                            </div>
                        ` : '<div style="margin-top: 12px;"><span style="font-size: 12px; color: var(--text-muted, #888);">💡 私聊无法封禁，只能封禁用户</span></div>'}
                    </div>
                `;
            }).join('');
        }

        function renderUsers() {
            const container = document.getElementById('usersList');
            if (allUsers.length === 0) { container.innerHTML = '<div class="empty-state">暂无用户</div>'; return; }
            const userRoomCount = {};
            for (const msg of allMessages) {
                if (!userRoomCount[msg.sender]) userRoomCount[msg.sender] = new Set();
                userRoomCount[msg.sender].add(msg.roomId);
            }
            container.innerHTML = allUsers.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-name">${escapeHtml(user.username)}${user.username === 'huangzhiyuan' ? '<span class="admin-badge">管理员</span>' : ''}${user.isBanned ? '<span class="banned-badge">已封禁</span>' : ''}</div>
                        <div class="user-meta">注册时间: ${new Date(user.createdAt).toLocaleString()}<br>参与聊天室: ${userRoomCount[user.username]?.size || 0} 个<br>发送消息: ${allMessages.filter(m => m.sender === user.username).length} 条</div>
                    </div>
                    <div class="actions">
                        ${user.username !== 'huangzhiyuan' ? `
                            <button class="notify-user-btn" onclick="showNotifyModal('${user.username}')">📨 发通知</button>
                            ${user.isBanned ? 
                                `<button class="unban-user-btn" onclick="toggleUserBan('${user.username}', false)">解除封禁</button>` :
                                `<button class="ban-user-btn" onclick="toggleUserBan('${user.username}', true)">封禁用户</button>`}
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderNotifications() {
            const container = document.getElementById('notificationsList');
            if (allNotifications.length === 0) { container.innerHTML = '<div class="empty-state">暂无系统通知记录</div>'; return; }
            allNotifications.sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt));
            container.innerHTML = allNotifications.map(notif => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-name">📨 ${escapeHtml(notif.title)}</div>
                        <div class="user-meta">发送给: ${escapeHtml(notif.targetUser)}<br>发送时间: ${new Date(notif.sentAt).toLocaleString()}<br>内容: ${escapeHtml(notif.content)}</div>
                    </div>
                </div>
            `).join('');
        }

        // ========== 清除多余账号功能 ==========
        async function cleanDuplicateUsers() {
            const button = document.getElementById('cleanDuplicateUsersBtn');
            
            if (!confirm('⚠️ 警告：此操作将删除所有重复注册的账号（相同用户名仅保留最新创建的一个），且不可恢复。\n\n是否继续？')) {
                return;
            }

            const originalText = button.innerText;
            button.innerText = '⏳ 处理中...';
            button.disabled = true;

            try {
                const url = `${WORKER_API}/api/legacy/issues?labels=user&state=open`;
                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                const issues = await response.json();

                const userMap = new Map();
                for (const issue of (Array.isArray(issues) ? issues : [])) {
                    const userData = parseIssueJson(issue);
                    if (userData) {
                        try {
                            const username = userData.username;
                            const createdAt = new Date(userData.createdAt);
                            if (!userMap.has(username)) {
                                userMap.set(username, []);
                            }
                            userMap.get(username).push({
                                issueNumber: issue.number,
                                createdAt: createdAt,
                                userData: userData
                            });
                        } catch (e) {}
                    }
                }

                const toDelete = [];
                for (const [username, users] of userMap.entries()) {
                    if (users.length > 1) {
                        users.sort((a, b) => b.createdAt - a.createdAt);
                        const keep = users[0];
                        const duplicates = users.slice(1);
                        for (const dup of duplicates) {
                            toDelete.push({
                                issueNumber: dup.issueNumber,
                                username: username,
                                createdAt: dup.createdAt
                            });
                        }
                        console.log(`用户 "${username}" 共有 ${users.length} 个账号，保留 ${keep.createdAt.toLocaleString()}，删除 ${duplicates.length} 个`);
                    }
                }

                if (toDelete.length === 0) {
                    alert('✅ 没有发现重复注册的账号，无需清理。');
                    button.innerText = originalText;
                    button.disabled = false;
                    return;
                }

                if (!confirm(`发现 ${toDelete.length} 个重复账号，确定要删除吗？此操作不可恢复！`)) {
                    button.innerText = originalText;
                    button.disabled = false;
                    return;
                }

                let deletedCount = 0;
                let failedCount = 0;
                for (const dup of toDelete) {
                    try {
                        const deleteUrl = `${WORKER_API}/api/legacy/issues/${dup.issueNumber}`;
                        const deleteResponse = await fetch(deleteUrl, {
                            method: 'PATCH',
                            headers: {
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ state: 'closed' })
                        });
                        if (deleteResponse.ok) {
                            deletedCount++;
                        } else {
                            failedCount++;
                        }
                    } catch (error) {
                        failedCount++;
                    }
                }

                alert(`🎉 清理完成！\n\n成功删除: ${deletedCount} 个重复账号\n失败: ${failedCount} 个`);
                await loadAllData();
                
            } catch (error) {
                console.error('清理重复账号失败:', error);
                alert('❌ 清理失败：' + error.message);
            } finally {
                button.innerText = originalText;
                button.disabled = false;
            }
        }

        // ========== 系统通知功能 ==========
        async function sendSystemNotification() {
            const title = document.getElementById('notifyTitle').value.trim();
            const content = document.getElementById('notifyMessage').value.trim();
            if (!title || !content) { alert('请填写通知标题和内容'); return; }
            const notificationData = {
                id: `notif_${Date.now()}`,
                type: 'system',
                title: title,
                content: content,
                targetUser: currentNotifyUser,
                sender: 'system',
                sentAt: new Date().toISOString(),
                isRead: false
            };
            try {
                const issueBody = `系统通知\n\`\`\`json\n${JSON.stringify(notificationData, null, 2)}\n\`\`\``;
                await fetch(`${WORKER_API}/api/legacy/issues`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: `系统通知: ${title}`, body: issueBody, labels: ['system_notification'] })
                });
                alert(`通知已发送给 ${currentNotifyUser}`);
                closeNotifyModal();
                loadAllData();
            } catch (error) { alert('发送失败: ' + error.message); }
        }

        function showNotifyModal(username) { currentNotifyUser = username; document.getElementById('notifyTargetUser').textContent = username; document.getElementById('notifyTitle').value = ''; document.getElementById('notifyMessage').value = ''; document.getElementById('notifyModal').style.display = 'flex'; }
        function closeNotifyModal() { document.getElementById('notifyModal').style.display = 'none'; currentNotifyUser = null; }

        async function toggleUserBan(username, shouldBan) {
            if (!confirm(`确定要${shouldBan ? '封禁' : '解除封禁'}用户 ${username} 吗？`)) return;
            const user = allUsers.find(u => u.username === username);
            if (!user) return;
            try {
                // users 表主键是 username；直接更新 is_banned 列
                const res = await fetch(`${WORKER_API}/api/users/${encodeURIComponent(username)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_banned: shouldBan })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                user.isBanned = shouldBan;
            } catch (error) {
                alert('操作失败：' + (error && error.message ? error.message : error));
                return;
            }
            alert(shouldBan ? `用户 ${username} 已被封禁` : `用户 ${username} 已解除封禁`);
            loadAllData();
        }

        async function toggleRoomBan(roomId, shouldBan) {
            if (!confirm(`确定要${shouldBan ? '封禁' : '解除封禁'}该群聊吗？`)) return;
            const room = allRooms.find(r => r.id === roomId);
            if (!room) return;
            try {
                const res = await fetch(`${WORKER_API}/api/rooms/${encodeURIComponent(roomId)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_banned: shouldBan })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                room.isBanned = shouldBan;
            } catch (error) {
                alert('操作失败：' + (error && error.message ? error.message : error));
                return;
            }
            alert(shouldBan ? `群聊已被封禁` : `群聊已解除封禁`);
            loadAllData();
        }

        function switchTab(tab) {
            const roomsTab = document.getElementById('roomsTab');
            const usersTab = document.getElementById('usersTab');
            const notificationsTab = document.getElementById('notificationsTab');
            const auditTab = document.getElementById('auditTab');
            const bansTab = document.getElementById('bansTab');
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            roomsTab.style.display = 'none';
            usersTab.style.display = 'none';
            notificationsTab.style.display = 'none';
            auditTab.style.display = 'none';
            bansTab.style.display = 'none';
            if (tab === 'rooms') { roomsTab.style.display = 'block'; btns[0].classList.add('active'); }
            else if (tab === 'users') { usersTab.style.display = 'block'; btns[1].classList.add('active'); }
            else if (tab === 'audit') { auditTab.style.display = 'block'; btns[3].classList.add('active'); renderAudit(); }
            else if (tab === 'bans') { bansTab.style.display = 'block'; btns[4].classList.add('active'); loadBanManagement(); }
            else { notificationsTab.style.display = 'block'; btns[2].classList.add('active'); renderNotifications(); }
        }

        // ========== 消息审计 ==========
        let auditSelected = new Set();
        let auditFilteredMsgs = [];

        function renderAudit() {
            const roomFilter = document.getElementById('auditRoomFilter').value;
            const userFilter = document.getElementById('auditUserFilter').value.trim().toLowerCase();
            // 填充房间下拉
            const sel = document.getElementById('auditRoomFilter');
            const roomNames = {};
            (allRooms || []).forEach(r => roomNames[r.id] = r.name);
            const roomOpts = ['<option value="">全部聊天室</option>'].concat((allRooms || []).map(r => `<option value="${r.id}">${escapeHtml(r.name || r.id)}</option>`));
            if (sel.options.length !== roomOpts.length) sel.innerHTML = roomOpts.join('');
            // 筛选
            auditFilteredMsgs = (allMessages || []).filter(m => {
                if (m.isRecalled) return false;
                if (roomFilter && m.roomId !== roomFilter) return false;
                if (userFilter && !(m.sender || '').toLowerCase().includes(userFilter)) return false;
                return true;
            });
            // 按聊天室分组
            const groups = {};
            auditFilteredMsgs.forEach(m => {
                const key = m.roomId || '未知房间';
                if (!groups[key]) groups[key] = [];
                groups[key].push(m);
            });
            const container = document.getElementById('auditMessages');
            const roomTotal = Object.keys(groups).length;
            const msgTotal = auditFilteredMsgs.length;
            document.getElementById('auditStatus').textContent = `共 ${msgTotal} 条消息 · ${roomTotal} 个聊天室 · 已选 ${auditSelected.size} 条`;
            if (msgTotal === 0) { container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary,#aaa);">暂无匹配消息</div>'; return; }
            container.innerHTML = Object.keys(groups).map(rid => {
                const msgs = groups[rid];
                const roomName = roomNames[rid] || rid;
                return `<div style="margin-bottom:14px;">
                    <div style="font-weight:bold;color:var(--accent-color,#ffd700);margin-bottom:6px;">💬 ${escapeHtml(roomName)} <span style="font-size:11px;color:var(--text-secondary,#aaa);">(${msgs.length} 条)</span>
                        <button onclick="auditSelectRoom('${rid}')" style="margin-left:8px;padding:2px 8px;font-size:11px;">全选本房间</button>
                        <button onclick="auditAiAnalyzeRoom('${rid}')" style="margin-left:4px;padding:2px 8px;font-size:11px;background:#3498db;color:white;">🤖 AI 分析本房间</button>
                    </div>
                    ${msgs.map(m => {
                        const checked = auditSelected.has(m.id) ? 'checked' : '';
                        return `<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 8px;background:var(--bg-tertiary,#12121f);border-radius:6px;margin-bottom:4px;">
                            <input type="checkbox" ${checked} onchange="auditToggle('${m.id}')">
                            <div style="flex:1;min-width:0;">
                                <div style="font-size:11px;color:var(--text-muted,#888);">${escapeHtml(m.sender || '未知')} · ${new Date(m.timestamp).toLocaleString()}</div>
                                <div style="font-size:13px;word-break:break-word;color:#ddd;">${escapeHtml((m.content || '').substring(0, 200))}</div>
                            </div>
                            <button onclick="auditDeleteOne('${m.id}')" title="删除此消息" style="background:transparent;border:none;color:#dc3545;cursor:pointer;">🗑️</button>
                        </div>`;
                    }).join('')}
                </div>`;
            }).join('');
        }

        function auditToggle(id) { if (auditSelected.has(id)) auditSelected.delete(id); else auditSelected.add(id); document.getElementById('auditStatus').textContent = `共 ${auditFilteredMsgs.length} 条消息 · 已选 ${auditSelected.size} 条`; }
        function auditSelectAll() { auditFilteredMsgs.forEach(m => auditSelected.add(m.id)); renderAudit(); }
        function auditSelectRoom(rid) { auditFilteredMsgs.filter(m => m.roomId === rid).forEach(m => auditSelected.add(m.id)); renderAudit(); }
        async function auditDeleteOne(id) {
            if (!confirm('确定删除这条消息吗？')) return;
            try {
                const res = await fetch(`${WORKER_API}/api/messages/${encodeURIComponent(id)}`, { method: 'DELETE' });
                if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || ('HTTP ' + res.status)); }
                allMessages = allMessages.filter(m => m.id !== id);
                auditSelected.delete(id);
                renderAudit();
            } catch (e) { alert('删除失败：' + e.message); }
        }
        async function auditDeleteSelected() {
            const ids = [...auditSelected];
            if (ids.length === 0) { alert('请先勾选要删除的消息'); return; }
            if (!confirm(`确定删除选中的 ${ids.length} 条消息吗？此操作不可恢复。`)) return;
            let ok = 0, fail = 0;
            for (const id of ids) {
                try {
                    const res = await fetch(`${WORKER_API}/api/messages/${encodeURIComponent(id)}`, { method: 'DELETE' });
                    if (res.ok) { ok++; allMessages = allMessages.filter(m => m.id !== id); }
                    else fail++;
                } catch (e) { fail++; }
            }
            auditSelected.clear();
            alert(`删除完成：成功 ${ok} 条，失败 ${fail} 条`);
            renderAudit();
        }

        // 思知 AI 违规分析
        const SIZHI_AUDIT_URL = 'https://api.sizhi.com/chat';
        const SIZHI_AUDIT_APPID = 'd18408ec60b14c5f844d5004881808eb';
        async function sizhiAsk(prompt) {
            const url = `${SIZHI_AUDIT_URL}?appid=${SIZHI_AUDIT_APPID}&userid=admin_audit&spoken=${encodeURIComponent(prompt)}&memory=false`;
            const res = await fetch(url);
            const data = await res.json();
            if (data && data.status === 0 && data.data && data.data.info && data.data.info.text) return data.data.info.text;
            throw new Error('思知 AI 返回异常');
        }
        function auditMsgsPrompt(msgs) {
            const lines = msgs.map((m, i) => `${i + 1}. [${m.sender}] ${(m.content || '').substring(0, 200)}`).join('\n');
            return '你是平台内容审核助手。请判断以下聊天消息是否违规（违规类型包括：色情低俗、暴力威胁、人身攻击辱骂、垃圾广告、泄露他人隐私、涉政敏感等）。请逐条给出结论：违规/正常 + 违规类型 + 简要理由。\n\n消息列表：\n' + lines;
        }
        async function auditAiAnalyze() {
            const msgs = [...auditSelected].map(id => allMessages.find(m => m.id === id)).filter(Boolean);
            if (msgs.length === 0) { alert('请先勾选要分析的消息'); return; }
            await runAiAudit(msgs, '已选消息');
        }
        async function auditAiAnalyzeRoom(rid) {
            const msgs = auditFilteredMsgs.filter(m => m.roomId === rid);
            if (msgs.length === 0) { alert('该房间没有消息'); return; }
            await runAiAudit(msgs, '房间消息');
        }
        async function runAiAudit(msgs, label) {
            const box = document.getElementById('auditResult');
            box.style.display = 'block';
            box.innerHTML = `<div style="color:#3498db;">🤖 正在用思知 AI 分析 ${msgs.length} 条${label}，请稍候...</div>`;
            try {
                const text = await sizhiAsk(auditMsgsPrompt(msgs));
                box.innerHTML = `<div style="background:#0f1e2e;border:1px solid #3498db;border-radius:8px;padding:12px;max-height:300px;overflow:auto;white-space:pre-wrap;font-size:13px;color:#ddd;">🤖 <b>AI 审核结果</b>\n${escapeHtml(text)}</div>`;
            } catch (e) {
                box.innerHTML = `<div style="color:#dc3545;">❌ AI 分析失败：${escapeHtml(e.message)}</div>`;
            }
        }

        // ========== 封禁管理 ==========
        async function loadBanManagement() {
            const ipBox = document.getElementById('bannedIpsList');
            const userBox = document.getElementById('frozenUsersList');
            ipBox.innerHTML = '<div class="loading">加载中...</div>';
            userBox.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const res = await fetch(`${WORKER_API}/api/auth/banned-ips`);
                const data = await res.json();
                const list = (data && data.list) || [];
                ipBox.innerHTML = list.length === 0
                    ? '<div style="padding:10px;color:var(--text-secondary,#aaa);">暂无被封禁 IP</div>'
                    : list.map(b => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--bg-tertiary,#12121f);border-radius:6px;margin-bottom:4px;">
                        <div><div style="font-family:monospace;color:#ffd700;">${escapeHtml(b.ip)}</div><div style="font-size:11px;color:var(--text-muted,#888);">${escapeHtml(b.reason || '')} · ${b.banned_at ? new Date(b.banned_at).toLocaleString() : ''}</div></div>
                        <button onclick="unbanIp('${escapeAttr(b.ip)}')" style="background:#2ecc71;color:white;padding:4px 12px;">解封</button>
                    </div>`).join('');
                // 冻结用户 = users.is_banned = 1
                const frozen = (allUsers || []).filter(u => u.isBanned);
                userBox.innerHTML = frozen.length === 0
                    ? '<div style="padding:10px;color:var(--text-secondary,#aaa);">暂无被冻结用户</div>'
                    : frozen.map(u => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--bg-tertiary,#12121f);border-radius:6px;margin-bottom:4px;">
                        <div>${escapeHtml(u.username)}</div>
                        <button onclick="unfreezeUser('${escapeAttr(u.username)}')" style="background:#2ecc71;color:white;padding:4px 12px;">解冻</button>
                    </div>`).join('');
            } catch (e) { ipBox.innerHTML = `<div style="color:#dc3545;">加载失败：${escapeHtml(e.message)}</div>`; }
        }
        function escapeAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
        async function unbanIp(ip) {
            if (!confirm(`确定解封 IP ${ip} 吗？`)) return;
            try {
                const res = await fetch(`${WORKER_API}/api/auth/banned-ips/${encodeURIComponent(ip)}`, { method: 'DELETE' });
                if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || ('HTTP ' + res.status)); }
                alert('✅ 已解封 IP');
                loadBanManagement();
            } catch (e) { alert('解封失败：' + e.message); }
        }
        async function unfreezeUser(username) {
            if (!confirm(`确定解冻用户 ${username} 吗？`)) return;
            try {
                const res = await fetch(`${WORKER_API}/api/users/${encodeURIComponent(username)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_banned: 0 })
                });
                if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || ('HTTP ' + res.status)); }
                alert('✅ 已解冻用户');
                await loadAllData();
                loadBanManagement();
            } catch (e) { alert('解冻失败：' + e.message); }
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        currentAdmin = checkAdmin();
        if (currentAdmin) { loadAllData(); setInterval(loadAllData, 60000); }
    </script>
