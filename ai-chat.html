<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - AI 问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #eef4ff;
        }
        
        /* ===== 导航栏（与主站一致） ===== */
        .nav {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            padding: 12px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #ffd700;
        }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .logo {
            width: 40px;
            height: 40px;
            background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .nav h2 { font-size: 20px; color: #ffd700; }
        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }
        .nav a:hover { color: #ffd700; }
        
        @media (max-width: 768px) {
            .nav { flex-direction: column; gap: 10px; text-align: center; }
            .nav div:last-child { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
            .nav a { margin-left: 0; }
        }
        
        /* ===== AI 聊天容器 ===== */
        .ai-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
        }
        
        .ai-header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #2a2a3e;
            margin-bottom: 16px;
        }
        .ai-header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .ai-header p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }
        
        /* ===== AI 搜索组件容器 ===== */
        .ai-chat-wrapper {
            flex: 1;
            min-height: 400px;
            background: #16213e;
            border-radius: 16px;
            border: 1px solid #2a2a3e;
            overflow: hidden;
            position: relative;
        }
        
        /* ===== 自定义组件样式 ===== */
        chat-page-snippet {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 500px;
        }
        
        /* 覆盖组件样式以匹配主站主题 */
        chat-page-snippet {
            --search-snippet-primary-color: #ffd700;
            --search-snippet-primary-hover: #e6c200;
            --search-snippet-background: #1a1a2e;
            --search-snippet-surface: #16213e;
            --search-snippet-text-color: #eef4ff;
            --search-snippet-text-secondary: #888;
            --search-snippet-text-description: #aaa;
            --search-snippet-border-color: #2a2a3e;
            --search-snippet-hover-background: #2a2a3e;
            --search-snippet-focus-ring: rgba(255, 215, 0, 0.4);
            --search-snippet-error-color: #dc3545;
            --search-snippet-success-color: #2ecc71;
            --search-snippet-warning-color: #f39c12;
            --search-snippet-user-message-bg: #ffd700;
            --search-snippet-user-message-text: #1a1a2e;
            --search-snippet-assistant-message-bg: #16213e;
            --search-snippet-assistant-message-text: #eef4ff;
            --search-snippet-system-message-bg: rgba(243, 156, 18, 0.2);
            --search-snippet-system-message-text: #f39c12;
            --search-snippet-font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --search-snippet-font-size-base: 14px;
            --search-snippet-border-radius: 12px;
            --search-snippet-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --search-snippet-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --search-snippet-z-modal: 100;
            --search-snippet-z-popover: 110;
            --search-snippet-z-tooltip: 120;
        }
        
        /* ===== 加载状态 ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            padding: 40px;
            text-align: center;
        }
        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 14px;
            max-width: 400px;
        }
        
        /* ===== 加载动画 ===== */
        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid #2a2a3e;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .ai-container { padding: 12px; height: calc(100vh - 70px); }
            .ai-header h1 { font-size: 22px; }
            .ai-chat-wrapper { min-height: 350px; border-radius: 12px; }
            chat-page-snippet { min-height: 400px; }
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <div class="nav">
        <div class="nav-left">
            <div class="logo"></div>
            <h2>💬 NFLSHC Chat</h2>
        </div>
        <div>
            <a href="chat.html">💬 聊天</a>
            <a href="about.html">ℹ️ 关于</a>
            <a href="index.html" onclick="logout()">🚪 退出</a>
        </div>
    </div>

    <!-- ===== AI 聊天主区域 ===== -->
    <div class="ai-container">
        <div class="ai-header">
            <h1>🤖 AI 智能问答</h1>
            <p>基于 Cloudflare AI Search · 问任何关于 NFLSHC Chat 的问题</p>
        </div>

        <div class="ai-chat-wrapper" id="aiChatWrapper">
            <!-- 加载状态 -->
            <div class="empty-state" id="loadingState">
                <div class="loading-spinner"></div>
                <h3>⏳ 加载中...</h3>
                <p>AI 问答助手正在启动，请稍候</p>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  Cloudflare AI Search 组件（延迟加载）                        -->
    <!-- ============================================================ -->
    <script>
        // 延迟加载 AI 组件，确保页面先渲染
        document.addEventListener('DOMContentLoaded', function() {
            const wrapper = document.getElementById('aiChatWrapper');
            
            // 移除加载状态
            const loadingState = document.getElementById('loadingState');
            if (loadingState) loadingState.remove();
            
            // 动态创建 chat-page-snippet 组件
            const chatPage = document.createElement('chat-page-snippet');
            chatPage.setAttribute('api-url', 'https://2c177107-5a66-4ac2-bf55-04f0bcad8fef.search.ai.cloudflare.com/');
            chatPage.setAttribute('placeholder', '输入问题，AI 帮你解答...');
            chatPage.setAttribute('hide-branding', 'false');
            wrapper.appendChild(chatPage);
            
            // 动态加载组件库
            const script = document.createElement('script');
            script.type = 'module';
            script.src = 'https://2c177107-5a66-4ac2-bf55-04f0bcad8fef.search.ai.cloudflare.com/assets/v0.0.40/search-snippet.es.js';
            document.head.appendChild(script);
            
            console.log('🤖 AI 问答页面已加载');
        });

        // ===== 退出登录 =====
        function logout() {
            localStorage.removeItem('nflshc_currentUser');
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('nflshc_user');
            if (window.clearLoginState) window.clearLoginState();
            window.location.href = 'index.html';
        }
        
        // ===== 检查登录状态（可选，不强制） =====
        function checkAuth() {
            const userStr = sessionStorage.getItem('currentUser') || localStorage.getItem('nflshc_currentUser');
            if (!userStr) {
                console.log('💡 AI 问答支持匿名使用');
                return null;
            }
            return JSON.parse(userStr);
        }
        
        const currentUser = checkAuth();
        console.log('👤 当前用户:', currentUser?.username || '匿名');
    </script>

    <!-- ===== 备选：如果组件加载失败，显示提示 ===== -->
    <noscript>
        <div style="text-align:center;padding:60px;color:#666;">
            <span style="font-size:48px;display:block;margin-bottom:16px;">⚠️</span>
            <h3>需要启用 JavaScript</h3>
            <p>AI 问答功能需要 JavaScript 支持，请启用后重试。</p>
        </div>
    </noscript>

</body>
</html>
