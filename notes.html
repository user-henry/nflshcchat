<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=4"></script>
    <script>const WORKER_API = 'https://worker.nflshcchat.cc.cd';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 笔记</title>
    <link rel="stylesheet" href="css/themes.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .nav { background: var(--bg-secondary); padding: 12px 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 14px; }
        .logo { width: 36px; height: 36px; background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png'); background-size: contain; background-repeat: no-repeat; background-position: center; }
        .nav h2 { font-size: 18px; color: var(--accent-color); }
        .nav a { color: var(--text-primary); text-decoration: none; margin-left: 16px; font-size: 14px; }
        .nav a:hover { color: var(--accent-color); }
        .layout { flex: 1; display: flex; min-height: 0; }
        .list-pane { width: 300px; border-right: 1px solid var(--border-color); background: var(--bg-secondary); display: flex; flex-direction: column; min-height: 0; }
        .list-head { padding: 12px 14px 8px; display: flex; gap: 8px; flex-wrap: wrap; }
        .list-head input { flex: 1; min-width: 120px; padding: 9px 11px; border: 1px solid var(--border-color); border-radius: 9px; background: var(--bg-primary); color: var(--text-primary); font-size: 13.5px; font-family: inherit; }
        .list-head input:focus { outline: none; border-color: var(--accent-color); }
        .notes { flex: 1; overflow: auto; padding: 0 10px 14px; min-height: 0; }
        .note-item { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: var(--bg-primary); transition: .15s; }
        .note-item:hover { border-color: var(--accent-color); }
        .note-item.on { border-color: var(--accent-color); box-shadow: 0 0 0 1px rgba(255,215,0,.25); }
        .note-item .t { font-size: 14px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
        .note-item .m { font-size: 11.5px; color: var(--text-secondary); display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border-color); color: var(--text-secondary); }
        .tag.meeting { color: #3498db; border-color: rgba(52,152,219,.5); }
        .tag.edit { color: #28a745; border-color: rgba(40,167,69,.5); }
        .tag.view { color: #f39c12; border-color: rgba(243,156,18,.5); }
        .editor { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .ed-head { padding: 12px 18px; border-bottom: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .ed-head input.title { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 9px; background: var(--bg-secondary); color: var(--text-primary); font-size: 15px; font-weight: 600; font-family: inherit; }
        .ed-head input.title:focus { outline: none; border-color: var(--accent-color); }
        .ed-body { flex: 1; display: flex; min-height: 0; }
        .ed-body textarea { flex: 1; padding: 18px 20px; border: none; outline: none; resize: none; background: var(--bg-primary); color: var(--text-primary); font-size: 14.5px; line-height: 1.85; font-family: Consolas, Monaco, 'Courier New', monospace; min-height: 0; }
        .preview { flex: 1; padding: 18px 20px; overflow: auto; border-left: 1px solid var(--border-color); background: var(--bg-secondary); font-size: 14.5px; line-height: 1.85; min-height: 0; }
        .preview h1, .preview h2, .preview h3 { margin: 14px 0 8px; }
        .preview p { margin-bottom: 10px; }
        .preview code { background: var(--bg-primary); padding: 2px 6px; border-radius: 5px; font-size: 13px; color: var(--accent-color); }
        .preview pre { background: var(--bg-primary); padding: 12px; border-radius: 10px; overflow: auto; margin-bottom: 10px; }
        .preview ul, .preview ol { margin: 8px 0 10px 22px; }
        .preview a { color: var(--accent-color); }
        .preview blockquote { border-left: 3px solid var(--accent-color); padding-left: 12px; color: var(--text-secondary); margin: 8px 0; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; font-size: 13.5px; transition: .18s; font-family: inherit; }
        .btn:hover:not(:disabled) { border-color: var(--accent-color); color: var(--accent-color); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn.on { background: #28a745; border-color: #28a745; color: #fff; }
        .btn.primary { background: var(--accent-color, #ffd700); color: #1a1a2e; border-color: transparent; font-weight: 600; }
        .btn.danger { border-color: rgba(231,76,60,.6); color: var(--danger, #e74c3c); }
        .btn.sm { padding: 5px 10px; font-size: 12.5px; }
        .status { font-size: 12.5px; color: var(--text-secondary); min-height: 16px; }
        .ok { color: #28a745; } .err { color: #e74c3c; } .muted { color: var(--text-secondary); } .warn { color: #f39c12; }
        .empty { padding: 40px 20px; text-align: center; color: var(--text-secondary); font-size: 14px; line-height: 1.9; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 60; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal .box { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; padding: 22px; max-width: 460px; width: 100%; max-height: 80vh; overflow: auto; }
        .modal h3 { font-size: 17px; margin-bottom: 12px; }
        .modal p { color: var(--text-secondary); font-size: 13.5px; line-height: 1.7; margin-bottom: 12px; }
        .modal input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 9px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; margin-bottom: 10px; font-family: inherit; }
        .share-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 9px; margin-bottom: 8px; font-size: 13.5px; }
        .btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
        @media (max-width: 820px) {
            .layout { flex-direction: column; }
            .list-pane { width: 100%; max-height: 34vh; border-right: none; border-bottom: 1px solid var(--border-color); }
            .ed-body { flex-direction: column; }
            .preview { border-left: none; border-top: 1px solid var(--border-color); max-height: 34vh; }
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="nav-left"><div class="logo"></div><h2>📝 笔记</h2></div>
        <div>
            <span class="muted" style="font-size:13px;"><span id="whoami">…</span></span>
            <a href="chat.html">💬 聊天</a>
            <a href="meeting.html">📅 会议</a>
            <a href="security.html">🔐 账号与安全</a>
        </div>
    </div>

    <div class="layout">
        <div class="list-pane">
            <div class="list-head">
                <input type="text" id="q" placeholder="搜索标题或内容…" oninput="renderList()">
                <button class="btn primary sm" onclick="createNote()">＋ 新建</button>
            </div>
            <div class="notes" id="notes"><div class="empty">加载中…</div></div>
        </div>

        <div class="editor">
            <div class="ed-head">
                <input type="text" class="title" id="title" placeholder="笔记标题" disabled>
                <span class="status" id="status"></span>
                <button class="btn sm" id="btnSave" onclick="saveNote()" disabled>💾 保存</button>
                <button class="btn sm" id="btnShare" onclick="openShare()" disabled>👥 共享</button>
                <button class="btn sm" id="btnPreview" onclick="togglePreview()">👁️ 预览</button>
                <button class="btn sm danger" id="btnDelete" onclick="deleteNote()" disabled>🗑️ 删除</button>
            </div>
            <div class="ed-body">
                <textarea id="content" placeholder="开始记录…（支持 Markdown：# 标题、**加粗**、- 列表、``` 代码块）" disabled></textarea>
                <div class="preview" id="preview" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="shareModal">
        <div class="box">
            <h3>👥 共享笔记</h3>
            <p>输入对方的用户名即可共享；勾选「可修改」后对方能编辑这篇笔记。</p>
            <input type="text" id="shareUser" placeholder="用户名">
            <label style="font-size:13.5px;color:var(--text-secondary);display:block;margin-bottom:12px;">
                <input type="checkbox" id="shareEdit" checked> 允许对方修改
            </label>
            <div class="btns"><button class="btn" onclick="closeShare()">关闭</button><button class="btn primary" onclick="doShare()">添加共享</button></div>
            <div class="status" id="shareMsg" style="margin:8px 0 12px;"></div>
            <div id="shareList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const API = WORKER_API;
        let me = '';
        let notes = [];
        let cur = null;          // 当前笔记 { id, title, content, role, canEdit, owner, meetingId }
        let dirty = false;
        let saveTimer = null;

        function escapeHtml(t) {
            if (t === null || t === undefined) return '';
            const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML;
        }
        function token() { return (window.AuthToken && window.AuthToken.get()) || ''; }
        function fmt(t) {
            if (!t) return '';
            const d = new Date(t);
            return isNaN(d.getTime()) ? String(t) : d.toLocaleString('zh-CN', { hour12: false });
        }
        async function api(path, opts) {
            const o = opts || {};
            const headers = Object.assign({}, o.headers || {});
            if (o.body) headers['Content-Type'] = 'application/json';
            const res = await fetch(API + path, { method: o.method || (o.body ? 'POST' : 'GET'), headers, body: o.body ? JSON.stringify(o.body) : undefined });
            const data = await res.json().catch(() => ({}));
            return { status: res.status, ok: res.ok, data };
        }
        function setStatus(text, cls) {
            const el = document.getElementById('status');
            el.className = 'status ' + (cls || '');
            el.textContent = text || '';
        }

        // ---------- 列表 ----------
        async function loadList() {
            const r = await api('/api/notes/list');
            if (r.status === 401) { window.location.href = 'index.html?next=notes.html'; return; }
            if (!r.ok || !r.data.ok) { document.getElementById('notes').innerHTML = '<div class="empty err">加载失败：' + escapeHtml(r.data.error || ('HTTP ' + r.status)) + '</div>'; return; }
            notes = r.data.notes || [];
            renderList();
        }

        function renderList() {
            const q = (document.getElementById('q').value || '').trim().toLowerCase();
            const box = document.getElementById('notes');
            const list = notes.filter(n => !q || String(n.title || '').toLowerCase().indexOf(q) !== -1
                || (n.id === (cur && cur.id)));
            if (!list.length) {
                box.innerHTML = '<div class="empty">' + (notes.length ? '没有匹配的笔记。' : '还没有笔记。<br>点「＋ 新建」开始记录吧。') + '</div>';
                return;
            }
            box.innerHTML = list.map(n => {
                const roleTag = n.role === 'owner' ? '' :
                    (n.role === 'edit' ? '<span class="tag edit">可编辑</span>' : '<span class="tag view">只读</span>');
                const kindTag = n.kind === 'meeting' ? '<span class="tag meeting">会议笔记</span>' : '';
                return '<div class="note-item' + (cur && cur.id === n.id ? ' on' : '') + '" onclick="openNote(\'' + escapeHtml(n.id) + '\')">' +
                    '<div class="t">' + escapeHtml(n.title || '未命名笔记') + '</div>' +
                    '<div class="m">' + kindTag + roleTag +
                    '<span>' + escapeHtml(n.owner === me ? '我' : n.owner) + '</span>' +
                    '<span>' + fmt(n.updatedAt) + '</span></div></div>';
            }).join('');
        }

        // ---------- 打开 / 保存 ----------
        async function openNote(id) {
            if (dirty && !confirm('当前笔记有未保存的修改，仍要切换吗？')) return;
            const r = await api('/api/notes/get?id=' + encodeURIComponent(id));
            if (!r.ok || !r.data.ok) { alert('打开失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status))); return; }
            cur = Object.assign({}, r.data.note, { role: r.data.role, canEdit: r.data.canEdit, shares: r.data.shares || [] });
            const t = document.getElementById('title');
            const c = document.getElementById('content');
            t.value = cur.title || '';
            c.value = cur.content || '';
            const editable = !!cur.canEdit;
            t.disabled = !editable;
            c.disabled = !editable;
            document.getElementById('btnSave').disabled = !editable;
            document.getElementById('btnDelete').disabled = cur.role !== 'owner';
            document.getElementById('btnShare').disabled = cur.role !== 'owner';
            document.getElementById('btnShare').textContent = '👥 共享' + (cur.meetingId ? '' : '');
            dirty = false;
            setStatus('最后修改：' + fmt(cur.updatedAt) + (cur.updatedBy ? '（' + cur.updatedBy + '）' : ''), 'muted');
            if (cur.meetingId) {
                setStatus('会议笔记 · 关联会议 ' + cur.meetingId.slice(-6) + ' · 最后修改 ' + fmt(cur.updatedAt), 'muted');
            }
            renderList();
            updatePreview();
        }

        async function createNote() {
            if (dirty && !confirm('当前笔记有未保存的修改，仍要新建吗？')) return;
            const r = await api('/api/notes/create', { body: { title: '新笔记 ' + new Date().toLocaleString('zh-CN', { hour12: false }) } });
            if (!r.ok || !r.data.ok) { alert('创建失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status))); return; }
            await loadList();
            openNote(r.data.note.id);
            document.getElementById('title').focus();
        }

        async function saveNote(silent) {
            if (!cur || !cur.canEdit) return;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const r = await api('/api/notes/update', { body: { id: cur.id, title, content } });
            if (!r.ok || !r.data.ok) { setStatus('保存失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status)), 'err'); return; }
            cur.title = title;
            cur.content = content;
            cur.updatedAt = r.data.updatedAt;
            cur.updatedBy = r.data.updatedBy;
            dirty = false;
            setStatus('已保存 · ' + fmt(r.data.updatedAt), 'ok');
            const idx = notes.findIndex(n => n.id === cur.id);
            if (idx >= 0) { notes[idx].title = title; notes[idx].updatedAt = r.data.updatedAt; }
            renderList();
        }

        async function deleteNote() {
            if (!cur) return;
            if (!confirm('删除笔记「' + cur.title + '」？该操作不可恢复。')) return;
            const r = await api('/api/notes/delete', { body: { id: cur.id } });
            if (!r.ok || !r.data.ok) { alert('删除失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status))); return; }
            cur = null;
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            document.getElementById('title').disabled = true;
            document.getElementById('content').disabled = true;
            ['btnSave', 'btnShare', 'btnDelete'].forEach(id => { document.getElementById(id).disabled = true; });
            setStatus('已删除', 'ok');
            loadList();
        }

        // ---------- 共享 ----------
        function openShare() {
            if (!cur) return;
            document.getElementById('shareModal').classList.add('active');
            document.getElementById('shareMsg').textContent = '';
            renderShares();
        }
        function closeShare() { document.getElementById('shareModal').classList.remove('active'); }
        function renderShares() {
            const box = document.getElementById('shareList');
            const list = (cur && cur.shares) || [];
            if (!list.length) { box.innerHTML = '<div class="muted" style="font-size:13px;">还没有共享给任何人（只有你自己可见）。</div>'; return; }
            box.innerHTML = list.map(s =>
                '<div class="share-item"><span>' + escapeHtml(s.username) +
                (s.canEdit ? ' <span class="tag edit">可修改</span>' : ' <span class="tag view">只读</span>') +
                '</span><button class="btn sm danger" onclick="doUnshare(\'' + escapeHtml(s.username) + '\')">移除</button></div>').join('');
        }
        async function doShare() {
            if (!cur) return;
            const username = document.getElementById('shareUser').value.trim();
            const canEdit = document.getElementById('shareEdit').checked;
            const msg = document.getElementById('shareMsg');
            if (!username) { msg.className = 'status err'; msg.textContent = '请输入用户名'; return; }
            msg.className = 'status muted'; msg.textContent = '处理中…';
            const r = await api('/api/notes/share', { body: { id: cur.id, username, canEdit } });
            if (!r.ok || !r.data.ok) { msg.className = 'status err'; msg.textContent = '共享失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status)); return; }
            msg.className = 'status ok';
            msg.textContent = '已共享给 ' + username + (canEdit ? '（可修改）' : '（只读）');
            document.getElementById('shareUser').value = '';
            const g = await api('/api/notes/get?id=' + encodeURIComponent(cur.id));
            if (g.ok && g.data.ok) { cur.shares = g.data.shares || []; renderShares(); }
        }
        async function doUnshare(username) {
            if (!cur) return;
            const r = await api('/api/notes/unshare', { body: { id: cur.id, username } });
            if (!r.ok || !r.data.ok) { alert('移除失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status))); return; }
            const g = await api('/api/notes/get?id=' + encodeURIComponent(cur.id));
            if (g.ok && g.data.ok) { cur.shares = g.data.shares || []; renderShares(); }
        }

        // ---------- 预览 ----------
        function togglePreview() {
            const p = document.getElementById('preview');
            const show = p.style.display === 'none';
            p.style.display = show ? '' : 'none';
            document.getElementById('btnPreview').classList.toggle('on', show);
            if (show) updatePreview();
        }
        function updatePreview() {
            const p = document.getElementById('preview');
            if (p.style.display === 'none') return;
            const text = document.getElementById('content').value || '';
            let html = escapeHtml(text);
            try { if (typeof marked !== 'undefined') html = marked.parse(text); } catch (e) { /* 用纯文本 */ }
            p.innerHTML = html;
        }

        // 自动保存（停止输入 2.5 秒后）
        function markDirty() {
            dirty = true;
            setStatus('有未保存的修改…', 'warn');
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => { if (dirty) saveNote(true); }, 2500);
        }

        (function init() {
            try {
                const raw = localStorage.getItem('nflshc_currentUser') || sessionStorage.getItem('currentUser');
                if (raw) me = (JSON.parse(raw) || {}).username || '';
            } catch (e) { /* 忽略 */ }
            document.getElementById('whoami').textContent = me || '已登录';
            if (!token()) { window.location.href = 'index.html?next=notes.html'; return; }
            document.getElementById('title').addEventListener('input', markDirty);
            document.getElementById('content').addEventListener('input', function () { markDirty(); updatePreview(); });
            window.addEventListener('beforeunload', function (e) {
                if (dirty) { e.preventDefault(); e.returnValue = ''; }
            });
            loadList().then(() => {
                // 支持 notes.html?id=xxx 直接打开某篇
                const id = new URLSearchParams(window.location.search).get('id');
                if (id) openNote(id);
            });
        })();
    </script>
    <script src="shortcuts.js"></script>
</body>
</html>
