            }
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) {
                setRelayStatus('无法访问麦克风：' + e.message, 'err');
                return;
            }
            // 复用同一条本地音频轨道（也能让 P2P 那条路继续有机会）
            if (!localStream) localStream = new MediaStream();
            stream.getAudioTracks().forEach(t => {
                if (localStream.getAudioTracks().length === 0) localStream.addTrack(t); else t.stop();
            });
            await pushLocalToPeers();

            relayOn = true;
            relaySeq = 0;
            relayLastId = 0;
            btn.classList.add('on');
            btn.textContent = '📻 停止对讲';
            setRelayStatus('对讲中：约 1~2 秒延迟，说完等对方回（网络直连不通时的兜底）', 'ok');
            relayRecordLoop();
            relayPollTimer = setInterval(relayPollVoice, 800);
            relayPollVoice();
        }
        window.toggleRelay = toggleRelay;

        // 录一段固定时长（默认 1.2 秒）的完整片段，发出去后再录下一段
        function relayRecordLoop() {
            if (!relayOn) return;
            const dur = Number(document.getElementById('relayClip') && document.getElementById('relayClip').value) || 1200;
            let rec = null;
            try {
                const stream = new MediaStream(localStream.getAudioTracks());
                const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
                rec = new MediaRecorder(stream, { mimeType: mime });
            } catch (e) {
                setRelayStatus('无法开始录音：' + e.message, 'err');
                return;
            }
            relayRec = rec;
            const parts = [];
            rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) parts.push(ev.data); };
            rec.onstop = async () => {
                const blob = new Blob(parts, { type: parts[0] && parts[0].type || 'audio/webm' });
                if (relayOn && blob.size > 200) {
                    try {
                        const buf = await blob.arrayBuffer();
                        let bin = '';
                        const bytes = new Uint8Array(buf);
                        for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
                        const r = await api('/api/meeting/voice', { body: {
                            meetingId: meetingId, seq: ++relaySeq, mime: blob.type, data: btoa(bin),
                        } });
                        if (r.ok && r.data.ok) { relaySent++; setRelayStatus('对讲中 · 已发 ' + relaySent + ' 段 / 已播 ' + relayPlayed + ' 段'); }
                        else setRelayStatus('发送失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status)), 'err');
                    } catch (e) { setRelayStatus('发送异常：' + e.message, 'err'); }
                }
                if (relayOn) relayClipTimer = setTimeout(relayRecordLoop, 60);
            };
            try { rec.start(); } catch (e) { setRelayStatus('录音失败：' + e.message, 'err'); return; }
            relayClipTimer = setTimeout(() => { try { if (rec.state !== 'inactive') rec.stop(); } catch (e) { /* 忽略 */ } }, dur);
        }

        async function relayPollVoice() {
            if (!relayOn || !meetingId) return;
            try {
                const r = await api('/api/meeting/voice?meetingId=' + encodeURIComponent(meetingId) + '&since=' + relayLastId);
                if (!r.ok || !r.data.ok) return;
                const chunks = r.data.chunks || [];
                for (const c of chunks) {
                    relayLastId = Math.max(relayLastId, c.id);
                    relayQueue.push(c);
                }
                // 队列太长说明播放跟不上：丢掉最旧的，避免延迟越积越大
                while (relayQueue.length > 4) relayQueue.shift();
                relayPlayNext();
                if (typeof r.data.lastId === 'number' && r.data.lastId > relayLastId && !chunks.length) relayLastId = r.data.lastId;
            } catch (e) { /* 下一轮重试 */ }
        }

        function relayPlayNext() {
            if (relayPlaying || !relayQueue.length) return;
            const c = relayQueue.shift();
            try {
                let bin = atob(c.data || '');
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const url = URL.createObjectURL(new Blob([bytes], { type: c.mime || 'audio/webm' }));
                const audio = new Audio(url);
                relayPlaying = true;
                const done = () => {
                    relayPlaying = false;
                    URL.revokeObjectURL(url);
                    relayPlayed++;
                    setRelayStatus('对讲中 · 已发 ' + relaySent + ' 段 / 已播 ' + relayPlayed + ' 段');
                    relayPlayNext();
                };
                audio.onended = done;
                audio.onerror = done;
                audio.play().catch(() => done());
            } catch (e) {
                relayPlaying = false;
                relayPlayNext();
            }
        }

        // ============================================================
        //  画面兜底（视频版的「对讲」；点对点画面传不过去时用，不需要 TURN）
        //  原理：每 2~5 秒把本地画面压成一张 480px 宽的 JPEG（质量 0.45），
        //  POST 给 Worker 落库；另一端每 1.5 秒轮询「每个对端最新的一帧」显示在
        //  对应的小窗里。相当于幻灯片式画面：不流畅、有几秒延迟，但至少能看到
        //  对方在不在、在做什么。帧只保留 3 分钟，不落盘、不留档。
        // ============================================================
        let frameOn = false, frameLastId = 0, frameSent = 0, frameGot = 0;
        let frameSendTimer = null, framePollTimer = null, frameCanvas = null;
        let frameBusy = false;

        function setFrameStatus(text, cls) {
            const el = document.getElementById('frameStatus');
            if (el) { el.className = 'muted ' + (cls || ''); el.textContent = text || ''; }
        }

        function frameEl(name) {
            const el = ensureTile(name, name === me);
            let img = el.querySelector('img.fallback');
            if (!img) {
                img = document.createElement('img');
                img.className = 'fallback off';
                img.alt = '';
                el.appendChild(img);
            }
            return img;
        }

        async function toggleFrame() {
            const btn = document.getElementById('btnFrame');
            if (frameOn) {
                frameOn = false;
                if (frameSendTimer) { clearInterval(frameSendTimer); frameSendTimer = null; }
                if (framePollTimer) { clearInterval(framePollTimer); framePollTimer = null; }
                btn.classList.remove('on');
                btn.textContent = '🖼 画面兜底';
                setFrameStatus('已停止画面兜底（发送 ' + frameSent + ' 帧，收到 ' + frameGot + ' 帧）');
                return;
            }
            // 有摄像头就用现成的，没有就单独申请一路视频（顺便也给 P2P 多一次机会）
            let track = (localStream && localStream.getVideoTracks().length) ? localStream.getVideoTracks()[0] : null;
            if (!track) {
                try {
                    const s = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } } });
                    track = s.getVideoTracks()[0];
                } catch (e) {
                    setFrameStatus('无法访问摄像头：' + e.message, 'err');
                    return;
                }
                if (!localStream) localStream = new MediaStream();
                localStream.addTrack(track);
                const v = tileVideo(me);
                v.srcObject = localStream;
                v.play().catch(() => {});
                try { await pushLocalToPeers(); } catch (e) { /* 兜底不依赖 P2P */ }
            }
            frameOn = true;
            frameLastId = 0;
            btn.classList.add('on');
            btn.textContent = '🖼 停止兜底';
            setFrameStatus('画面兜底中：每 ' + (frameInterval() / 1000) + ' 秒发一张，对端约 1~3 秒后看到', 'ok');
            framePollTimer = setInterval(framePoll, 1500);
            framePoll();
            frameSendLoop();
        }
        window.toggleFrame = toggleFrame;

        function frameInterval() {
            return Number(document.getElementById('frameEvery') && document.getElementById('frameEvery').value) || 3000;
        }

        function frameSendLoop() {
            if (!frameOn) return;
            const src = tileVideo(me);
            const track = localStream && localStream.getVideoTracks()[0];
            if (!track || track.readyState !== 'live' || !src.videoWidth) {
                frameSendTimer = setTimeout(frameSendLoop, 500);
                return;
            }
            try {
                if (!frameCanvas) frameCanvas = document.createElement('canvas');
                const w = 480;
                const h = Math.max(1, Math.round(w * src.videoHeight / src.videoWidth));
                frameCanvas.width = w; frameCanvas.height = h;
                const c = frameCanvas.getContext('2d');
                c.drawImage(src, 0, 0, w, h);
                const url = frameCanvas.toDataURL('image/jpeg', 0.45);
                const data = url.split(',')[1] || '';
                if (!data || data.length > 320 * 1024) {
                    setFrameStatus('画面太大，已跳过这一帧（降低分辨率或画质）', 'err');
                } else {
                    api('/api/meeting/frame', { body: { meetingId: meetingId, mime: 'image/jpeg', data } })
                        .then(r => {
                            if (r.ok && r.data && r.data.ok) {
                                frameSent++;
                                setFrameStatus('画面兜底中 · 已发 ' + frameSent + ' 帧 / 已收 ' + frameGot + ' 帧');
                            } else {
                                setFrameStatus('发送失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status)), 'err');
                            }
                        })
                        .catch(e => setFrameStatus('发送异常：' + e.message, 'err'));
                }
            } catch (e) {
                setFrameStatus('截取画面失败：' + e.message, 'err');
            }
            frameSendTimer = setTimeout(frameSendLoop, frameInterval());
        }

        async function framePoll() {
            if (!frameOn || !meetingId || frameBusy) return;
            frameBusy = true;
            try {
                const r = await api('/api/meeting/frame?meetingId=' + encodeURIComponent(meetingId) + '&since=' + frameLastId);
                if (r.ok && r.data && r.data.ok) {
                    for (const f of (r.data.frames || [])) {
                        frameLastId = Math.max(frameLastId, f.id);
                        frameGot++;
                        const img = frameEl(f.from_user);
                        // 如果这条 P2P 连接已经能收到对方的实时画面，就别用兜底画面盖住它
                        const p2p = peers[f.from_user];
                        if (p2p && p2p.recvVideo && p2p.pc && p2p.pc.connectionState === 'connected') {
                            img.classList.add('off');
                            continue;
                        }
                        img.src = 'data:' + (f.mime || 'image/jpeg') + ';base64,' + f.data;
                        img.classList.remove('off');
                        setBadge(f.from_user, '🖼 兜底画面');
                        // 很久没有新帧就把角标撤掉，避免把「上一张」当实时画面
                        const name = f.from_user;
                        setTimeout(() => { if (frameOn) setBadge(name, ''); }, frameInterval() * 2 + 4000);
                    }
                    if (frameGot) setFrameStatus('画面兜底中 · 已发 ' + frameSent + ' 帧 / 已收 ' + frameGot + ' 帧');
                }
            } catch (e) { /* 下一轮重试 */ }
            frameBusy = false;
        }

        // ============================================================
        //  共享白板：固定虚拟画布 1600×900，笔画经 /api/meeting/board 同步
        // ============================================================
        const BOARD_W = 1600, BOARD_H = 900;
        const BOARD_COLORS = ['#111111', '#e74c3c', '#f39c12', '#28a745', '#3498db', '#9b59b6', '#ffd700'];
        let boardOpen = false, boardTimer = null, boardLastId = 0;
        let boardTool = 'pen', boardColor = '#111111';
        let drawing = false, curPoints = [];
        let ctx = null;

        function boardCtx() {
            const cv = document.getElementById('board');
            if (!cv) return null;
            if (!ctx) ctx = cv.getContext('2d');
            return ctx;
        }

        function initBoardPalette() {
            const box = document.getElementById('boardPalette');
            if (!box || box.dataset.ready) return;
            box.dataset.ready = '1';
            box.innerHTML = BOARD_COLORS.map((c, i) =>
                '<span class="sw' + (i === 0 ? ' on' : '') + '" data-color="' + c + '" style="background:' + c + '"></span>').join('');
            box.querySelectorAll('.sw').forEach(el => {
                el.onclick = () => {
                    boardColor = el.dataset.color;
                    boardTool = 'pen';
                    document.getElementById('btnEraser').classList.remove('on');
                    box.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
                    el.classList.add('on');
                };
            });
        }

        function toggleEraser() {
            boardTool = (boardTool === 'eraser') ? 'pen' : 'eraser';
            document.getElementById('btnEraser').classList.toggle('on', boardTool === 'eraser');
        }

        function drawStroke(stroke) {
            const c = boardCtx();
            if (!c || !stroke || !Array.isArray(stroke.points) || stroke.points.length === 0) return;
            c.save();
            c.lineCap = 'round';
            c.lineJoin = 'round';
            c.lineWidth = stroke.width || 3;
            c.strokeStyle = stroke.tool === 'eraser' ? '#ffffff' : (stroke.color || '#111111');
            const pts = stroke.points;
            if (pts.length === 1) {
                c.beginPath();
                c.arc(pts[0][0], pts[0][1], (stroke.width || 3) / 2, 0, Math.PI * 2);
                c.fillStyle = c.strokeStyle;
                c.fill();
            } else {
                c.beginPath();
                c.moveTo(pts[0][0], pts[0][1]);
                for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
                c.stroke();
            }
            c.restore();
        }

        function boardPoint(ev) {
            const cv = document.getElementById('board');
            const rect = cv.getBoundingClientRect();
            const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
            const cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
            return [
                Math.max(0, Math.min(BOARD_W, Math.round(cx * BOARD_W / rect.width))),
                Math.max(0, Math.min(BOARD_H, Math.round(cy * BOARD_H / rect.height))),
            ];
        }

        function bindBoardEvents() {
            const cv = document.getElementById('board');
            if (!cv || cv.dataset.bound) return;
            cv.dataset.bound = '1';
            const start = (e) => { e.preventDefault(); drawing = true; curPoints = [boardPoint(e)]; };
            const move = (e) => {
                if (!drawing) return;
                e.preventDefault();
                curPoints.push(boardPoint(e));
                // 本地即时绘制（只画最后一段，避免整笔重绘）
                const c = boardCtx();
                const width = Number(document.getElementById('boardWidth').value) || 3;
                drawStroke({ tool: boardTool, color: boardColor, width, points: curPoints.slice(-2) });
            };
            const end = async (e) => {
                if (!drawing) return;
                drawing = false;
                const width = Number(document.getElementById('boardWidth').value) || 3;
                const stroke = { tool: boardTool, color: boardColor, width, points: curPoints };
                curPoints = [];
                if (stroke.points.length === 1) {
                    // 单击也留一个点（橡皮点用于擦除小区域）
                    drawStroke(stroke);
                }
                try {
                    const r = await api('/api/meeting/board', { body: { meetingId: meetingId, stroke } });
                    if (r.ok && r.data && r.data.id) boardLastId = Math.max(boardLastId, r.data.id);
                } catch (err) { /* 忽略 */ }
            };
            // 统一用 Pointer Events：鼠标、触摸、手写笔/触控笔都走同一套（canvas 已设 touch-action:none），
            // 比只监听 mouse/touch 两套更可靠（触控笔在部分设备上只发 pointer 事件）
            cv.addEventListener('pointerdown', (e) => { try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ } start(e); });
            cv.addEventListener('pointermove', move);
            cv.addEventListener('pointerup', end);
            cv.addEventListener('pointercancel', end);
        }

        let boardPolling = false;
        async function pollBoard() {
            if (!boardOpen || !meetingId || boardPolling) return;   // 防叠加
            boardPolling = true;
            try {
                const r = await api('/api/meeting/board?meetingId=' + encodeURIComponent(meetingId) + '&since=' + boardLastId);
                if (!r.ok || !r.data.ok) return;
                for (const s of (r.data.strokes || [])) {
                    if (s.user === me) { boardLastId = Math.max(boardLastId, s.id); continue; }
                    drawStroke(s.stroke);
                    boardLastId = Math.max(boardLastId, s.id);
                }
                if (typeof r.data.lastId === 'number') boardLastId = Math.max(boardLastId, r.data.lastId);
            } catch (e) { /* 下一轮重试 */ } finally { boardPolling = false; }
        }

        async function loadBoard() {
            const c = boardCtx();
            if (!c) return;
            c.clearRect(0, 0, BOARD_W, BOARD_H);
            boardLastId = 0;
            try {
                const r = await api('/api/meeting/board?meetingId=' + encodeURIComponent(meetingId) + '&since=0');
                if (r.ok && r.data.ok) {
                    for (const s of (r.data.strokes || [])) { drawStroke(s.stroke); boardLastId = Math.max(boardLastId, s.id); }
                }
            } catch (e) { /* 忽略 */ }
        }

        function toggleBoard() {
            const wrap = document.getElementById('boardWrap');
            boardOpen = !boardOpen;
            wrap.style.display = boardOpen ? '' : 'none';
            document.getElementById('btnBoard').classList.toggle('on', boardOpen);
            if (boardOpen) {
                initBoardPalette();
                bindBoardEvents();
                loadBoard();
                if (boardTimer) clearInterval(boardTimer);
                boardTimer = setInterval(pollBoard, 700);
            } else if (boardTimer) {
                clearInterval(boardTimer); boardTimer = null;
            }
        }

        async function clearBoard() {
            if (!confirm('清空白板？所有参与者看到的内容都会被清空。')) return;
            const r = await api('/api/meeting/board/clear', { body: { meetingId: meetingId } });
            if (!r.ok || !r.data.ok) { alert('清空失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status))); return; }
            const c = boardCtx();
            if (c) c.clearRect(0, 0, BOARD_W, BOARD_H);
            boardLastId = 0;
        }

        function downloadBoard() {
            const cv = document.getElementById('board');
            if (!cv) return;
            const a = document.createElement('a');
            a.download = 'whiteboard-' + Date.now() + '.png';
            a.href = cv.toDataURL('image/png');
            a.click();
        }

        window.toggleScreenShare = toggleScreenShare;
        window.toggleBoard = toggleBoard;
        window.toggleEraser = toggleEraser;
        window.clearBoard = clearBoard;
        window.downloadBoard = downloadBoard;

        function resumeAudio() {
            let ok = false;
            document.querySelectorAll('#grid video').forEach(v => {
                if (v.muted) return;
                v.play().then(() => { ok = true; }).catch(() => {});
            });
            if (ok) document.getElementById('playBanner').style.display = 'none';
        }
        window.resumeAudio = resumeAudio;

        // 离开页面时通知服务端（带 Authorization 头，sendBeacon 无法带鉴权头）
        function notifyLeave() {
            try {
                cleanupMedia();
                fetch(API + '/api/meeting/leave', {
                    method: 'POST',
                    keepalive: true,
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() },
                    body: JSON.stringify({ meetingId: meetingId }),
                }).catch(() => {});
            } catch (e) { /* 忽略 */ }
        }
        window.addEventListener('pagehide', notifyLeave);

        // ============================================================
        //  六、启动
        // ============================================================
        let pollTimers = [];
        function startPollers() {
            pollTimers.forEach(t => clearInterval(t));
            pollTimers = [
                setInterval(() => { if (!document.hidden) loadDetail(); }, 3000),
                setInterval(() => { if (!document.hidden) pollSignals(); }, 1000),
                setInterval(() => { if (!document.hidden) loadChat(); }, 2500),
            ];
        }

        (async function init() {
            try {
                const raw = localStorage.getItem('nflshc_currentUser') || sessionStorage.getItem('currentUser');
                if (raw) me = (JSON.parse(raw) || {}).username || '';
            } catch (e) { /* 忽略 */ }
            if (!token()) { window.location.href = 'index.html?next=' + encodeURIComponent('meeting-room.html' + window.location.search); return; }
            if (!meetingId && !meetingCode) { window.location.href = 'meeting.html'; return; }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                document.getElementById('hint').innerHTML = '⚠️ 当前浏览器不支持音视频通话（需要 HTTPS 与较新的浏览器）。你仍然可以使用会议聊天。';
            }
            if (!me) { window.location.href = 'index.html?next=' + encodeURIComponent('meeting-room.html' + window.location.search); return; }

            ensureTile(me, true);
            document.getElementById('mtCode').textContent = meetingCode || '—';

            // 先取一次 ICE 提示信息（只用 STUN），再入会/建连接
            await loadIceConfig();

            // 关键：先入会，成为会议成员后再开始聊天与信令
            let ok = await joinMeeting();
            // 入会失败（网络抖动）时定时自动重试，别让页面停在「正在加入会议…」
            for (let i = 0; !ok && i < 10; i++) {
                await new Promise(res => setTimeout(res, 3000));
                if (joined) { ok = true; break; }
                setDiag('Join', 'wait', '入会未成功，3 秒后自动重试…（第 ' + (i + 1) + '/10 次）');
                ok = await joinMeeting().catch(() => false);
            }
            await loadDetail();
            await loadMeetingNote(true).catch(() => null);   // 会议笔记（逐字稿/讨论区/纪要都写这里）
            if (ok) {
                startPollers();
                await loadChat();
                await pollSignals();
            } else {
                setDiag('Join', 'bad', '入会失败：请刷新页面或检查网络');
                sysMsg('无法入会：请刷新页面重试；若持续失败，请检查网络或稍后再试。');
            }
        })().catch(e => {
            // 兜底：init 里任何未预料的异常都不应该让页面静默卡死
            try {
                setDiag('Join', 'bad', '初始化失败：' + (e && e.message ? e.message : e));
                sysMsg('页面初始化出错：' + (e && e.message ? e.message : e) + '（请刷新重试）');
            } catch (err) { /* 忽略 */ }
        });
    </script>
    <script src="shortcuts.js"></script>
</body>
