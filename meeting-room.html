<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=4"></script>
    <script>const WORKER_API = 'https://worker.nflshcchat.cc.cd';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 会议中</title>
    <link rel="stylesheet" href="css/themes.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .top { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .top .ttl { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .code { font-family: Consolas, Monaco, monospace; background: var(--bg-primary); border: 1px dashed var(--border-color); border-radius: 8px; padding: 2px 10px; color: var(--accent-color); font-weight: 700; letter-spacing: 1px; cursor: pointer; }
        .top .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; font-size: 13.5px; transition: .2s; }
        .btn:hover:not(:disabled) { border-color: var(--accent-color); color: var(--accent-color); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn.on { background: #28a745; border-color: #28a745; color: #fff; }
        .btn.danger { border-color: rgba(231,76,60,.6); color: var(--danger, #e74c3c); }
        .main { flex: 1; display: flex; min-height: 0; }
        .stage { flex: 1; padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
        .tile { position: relative; background: #101018; border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; }
        .tile video { width: 100%; height: 100%; object-fit: cover; background: #101018; }
        .tile .nm { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #fff; background: rgba(0,0,0,.55); border-radius: 999px; padding: 2px 10px; }
        .tile .badge { position: absolute; right: 10px; top: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); border-radius: 999px; padding: 2px 9px; }
        /* 画面兜底：一张张 JPEG 帧盖在 tile 上（点对点画面传不过去时用） */
        .tile .fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0b0b10; z-index: 2; }
        .tile .fallback.off { display: none; }
        .avatar { width: 66px; height: 66px; border-radius: 50%; background: var(--bg-secondary); border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--accent-color); }
        .hint { color: var(--text-secondary); font-size: 13px; line-height: 1.8; background: var(--bg-secondary); border: 1px dashed var(--border-color); border-radius: 12px; padding: 12px 14px; }
        .hint b { color: var(--text-primary); }
        .diag { font-size: 12.5px; line-height: 1.9; color: var(--text-secondary); background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; }
        .diag .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.ok { background: #28a745; } .dot.wait { background: #f39c12; } .dot.bad { background: #e74c3c; } .dot.idle { background: #888; }
        .side { width: 340px; border-left: 1px solid var(--border-color); background: var(--bg-secondary); display: flex; flex-direction: column; min-height: 0; }
        .side h4 { font-size: 13.5px; padding: 12px 16px 8px; color: var(--text-secondary); }
        .members { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow: auto; }
        .members .m { font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--border-color); border-radius: 999px; background: var(--bg-primary); color: var(--text-secondary); }
        .members .m.host { border-color: rgba(52,152,219,.6); color: #3498db; }
        .members .m.me { border-color: var(--accent-color); color: var(--accent-color); }
        .chat { flex: 1; overflow: auto; padding: 6px 16px; min-height: 0; }
        .cmsg { margin-bottom: 10px; }
        .cmsg .who { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 2px; }
        .cmsg .txt { font-size: 13.5px; line-height: 1.6; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 11px; word-break: break-word; }
        .cmsg.mine .txt { border-color: rgba(255,215,0,.45); }
        .cmsg.sys .txt { background: transparent; border: none; color: var(--text-secondary); font-size: 12.5px; padding: 0 0 0 2px; }
        .composer { border-top: 1px solid var(--border-color); padding: 10px 12px; display: flex; gap: 8px; }
        .composer input { flex: 1; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; font-family: inherit; }
        .composer input:focus { outline: none; border-color: var(--accent-color); }

        /* ===== 会议笔记面板 ===== */
        .note-panel { border-bottom: 1px solid var(--border-color); padding: 10px 12px; background: var(--bg-primary); }
        .note-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13.5px; }
        .note-panel textarea { width: 100%; height: 168px; resize: vertical; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-secondary); color: var(--text-primary); font-size: 13.5px; line-height: 1.7; font-family: Consolas, Monaco, 'Courier New', monospace; }
        .note-panel textarea:focus { outline: none; border-color: var(--accent-color); }
        .note-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .btn.sm { padding: 5px 10px; font-size: 12.5px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal .box { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; max-width: 440px; width: 100%; }
        .modal h3 { margin-bottom: 10px; font-size: 17px; }
        .modal p { color: var(--text-secondary); font-size: 13.5px; line-height: 1.7; margin-bottom: 12px; }
        .modal input { width: 100%; padding: 11px 13px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; margin-bottom: 12px; font-family: inherit; }
        .modal .btns { display: flex; gap: 10px; justify-content: flex-end; }
        .msg { font-size: 12.5px; min-height: 16px; }
        .ok { color: #28a745; } .err { color: #e74c3c; } .muted { color: var(--text-secondary); } .warn { color: #f39c12; }
        .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border-color); border-top-color: var(--accent-color); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
        @keyframes sp { to { transform: rotate(360deg); } }

        /* ===== 共享白板 ===== */
        /* 注意：.stage 是「固定高度的 flex 列」，它里面的每一项默认都可以被压缩（flex-shrink:1）。
           白板以前没写 flex:none，视频墙一高就被压成只剩工具条那点高度，canvas 被 overflow:hidden
           裁掉 —— 表现就是「只看到颜色选择区、白板不显示」。这里固定不可压缩，并在容器内滚动。 */
        .board-wrap { flex: none; max-height: 70vh; overflow: auto; border: 1px solid var(--border-color); border-radius: 14px; background: #ffffff; }
        .board-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 2; }
        .board-tools .palette { display: inline-flex; gap: 6px; }
        .board-tools .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-color); cursor: pointer; }
        .board-tools .sw.on { border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(255,215,0,.35); }
        #board { display: block; flex: none; width: 100%; height: auto; aspect-ratio: 16 / 9; min-height: 240px; cursor: crosshair; touch-action: none; background: #ffffff; }

        @media (max-width: 820px) {
            .main { flex-direction: column; }
            .side { width: 100%; border-left: none; border-top: 1px solid var(--border-color); max-height: 45vh; }
        }
    </style>
</head>
<body>
    <div class="top">
        <div class="ttl">
            <span id="mtTitle">会议</span>
            <span class="code" id="mtCode" onclick="copyCode()" title="点击复制会议编号">—</span>
            <span class="muted" style="font-size:12.5px;" id="mtStatus"></span>
        </div>
        <div class="right">
            <button class="btn" id="btnMic" onclick="toggleMic()">🎙️ 开启语音</button>
            <button class="btn" id="btnCam" onclick="toggleCam()">🎥 开启视频</button>
            <button class="btn" id="btnShare" onclick="toggleScreenShare()">🖥️ 共享屏幕</button>
            <button class="btn" id="btnRelated" style="display:none"></button>
            <button class="btn" id="btnRelay" onclick="toggleRelay()" title="点对点连不上时的语音兜底：走 HTTPS 中转，约 1~2 秒延迟">📻 语音对讲</button>
            <select id="relayClip" title="每段语音时长（秒）" style="padding:8px 10px;border-radius:10px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-size:13px">
                <option value="1200">1.2s/段</option>
                <option value="2000" selected>2s/段</option>
                <option value="3000">3s/段</option>
            </select>
            <button class="btn" id="btnFrame" onclick="toggleFrame()" title="点对点画面传不过去时的兜底：每几秒发一张画面（幻灯片式，比看不到强）">🖼 画面兜底</button>
            <select id="frameEvery" title="每隔多久发一张画面" style="padding:8px 10px;border-radius:10px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-size:13px">
                <option value="2000">2s/帧</option>
                <option value="3000" selected>3s/帧</option>
                <option value="5000">5s/帧</option>
            </select>
            <button class="btn" id="btnBoard" onclick="toggleBoard()">✏️ 白板</button>
            <button class="btn" id="btnNotes" onclick="toggleNotes()">📝 笔记</button>
            <button class="btn" onclick="openInvite()">✉️ 邀请</button>
            <button class="btn danger" onclick="leaveMeeting()">🚪 离开</button>
            <button class="btn danger" id="btnEnd" style="display:none;" onclick="endMeeting()">⛔ 结束会议</button>
        </div>
    </div>

    <div class="main">
        <div class="stage">
            <div class="hint" id="hint">
                点「🎙️ 开启语音」或「🎥 开启视频」开始通话（浏览器会请求麦克风/摄像头权限）。<br>
                音视频在参与者之间<strong>点对点直连</strong>（只用 STUN 发现地址，不经服务器中转、不录制）；会议结束后不保留任何录音录像。
            </div>
            <div id="playBanner" style="display:none;">
                <button class="btn" onclick="resumeAudio()" style="border-color:var(--accent-color);color:var(--accent-color);">🔊 点击开启对方声音（浏览器自动播放限制）</button>
            </div>

            <!-- ===== 共享白板（固定虚拟画布 1600×900，各端按容器缩放） ===== -->
            <div class="board-wrap" id="boardWrap" style="display:none;">
                <div class="board-tools">
                    <span class="muted" style="font-size:12.5px;">共享白板 · 所有参与者实时可见</span>
                    <span class="palette" id="boardPalette"></span>
                    <label class="muted" style="font-size:12.5px;">粗细
                        <input type="range" id="boardWidth" min="1" max="16" value="3" style="vertical-align:middle;width:80px;">
                    </label>
                    <button class="btn" id="btnEraser" onclick="toggleEraser()" style="padding:5px 12px;font-size:12.5px;">🩹 橡皮</button>
                    <button class="btn" onclick="clearBoard()" style="padding:5px 12px;font-size:12.5px;">🧽 清空</button>
                    <button class="btn" onclick="downloadBoard()" style="padding:5px 12px;font-size:12.5px;">💾 保存图片</button>
                    <button class="btn" onclick="toggleBoard()" style="padding:5px 12px;font-size:12.5px;">✖ 收起</button>
                </div>
                <canvas id="board" width="1600" height="900"></canvas>
            </div>

            <div class="grid" id="grid"></div>
            <div class="diag" id="diag">
                <div class="row"><span class="dot idle" id="dotJoin"></span><span id="txtJoin">正在加入会议…</span></div>
                <div class="row"><span class="dot idle" id="dotSignal"></span><span id="txtSignal">信令：等待中</span></div>
                <div class="row"><span class="dot idle" id="dotIce"></span><span id="iceHint">网络穿透：检测中…</span></div>
                <div id="peerStates" style="margin-top:4px;"></div>
                <div class="row" style="margin-top:6px;">
                    <button class="btn" onclick="restartConnections()" style="padding:5px 12px;font-size:12.5px;">🔄 重新连接</button>
                    <span class="muted" style="font-size:12px;">连接卡住时点一下（双方都会重连）</span>
                </div>
            </div>
            <div class="msg" id="mediaMsg"></div>
            <div class="msg" id="relayStatus" style="min-height:14px;"></div>
            <div class="msg" id="frameStatus" style="min-height:14px;"></div>
        </div>
        <div class="side">
            <!-- ===== 会议笔记（随时记录，会上/会后都能看；逐字稿与讨论区都进这里） ===== -->
            <div class="note-panel" id="notePanel" style="display:none;">
                <div class="note-head">
                    <b>📝 会议笔记</b>
                    <span class="muted" id="noteStatus" style="font-size:11.5px;"></span>
                </div>
                <textarea id="noteArea" placeholder="在这里记录会议要点…（自动保存）"></textarea>
                <div class="note-tools">
                    <button class="btn sm" id="btnStt" onclick="toggleStt()">🎤 语音转文字</button>
                    <button class="btn sm" onclick="importChat()">📥 导入讨论区</button>
                    <button class="btn sm" onclick="generateMinutes()">🤖 生成纪要</button>
                    <button class="btn sm" onclick="openNotePage()">↗ 笔记页</button>
                </div>
            </div>

            <h4>👥 参与者（<span id="memberCount">0</span>）</h4>
            <div class="members" id="members"><span class="muted" style="font-size:12.5px;">加载中…</span></div>
            <h4 style="border-top:1px solid var(--border-color);padding-top:10px;">💬 会议聊天</h4>
            <div class="chat" id="chat"><div class="cmsg sys"><div class="txt">会议聊天记录对所有参与者可见。</div></div></div>
            <div class="composer">
                <input type="text" id="chatInput" placeholder="输入消息，回车发送" maxlength="2000" onkeydown="if(event.key==='Enter'){sendChat();}">
                <button class="btn" onclick="sendChat()">发送</button>
            </div>
        </div>
    </div>

    <div class="modal" id="inviteModal">
        <div class="box">
            <h3>✉️ 邀请他人参会</h3>
            <p>输入用户名（多个用逗号分隔），对方会收到站内会议邀请通知，通知里包含会议编号。</p>
            <input type="text" id="inviteNames" placeholder="alice, bob">
            <div class="btns">
                <button class="btn" onclick="closeInvite()">取消</button>
                <button class="btn" onclick="sendInvite()" style="background:var(--accent-color,#ffd700);color:#1a1a2e;border-color:transparent;font-weight:600;">发送邀请</button>
            </div>
            <div class="msg" id="inviteMsg"></div>
        </div>
    </div>

    <div class="modal" id="pwdModal">
        <div class="box">
            <h3>🔒 该会议需要密码</h3>
            <p>请输入主持人设置的会议密码后加入。</p>
            <input type="text" id="pwdInput" placeholder="会议密码" maxlength="32">
            <div class="btns">
                <button class="btn" onclick="location.href='meeting.html'">返回</button>
                <button class="btn" onclick="submitPwd()" style="background:var(--accent-color,#ffd700);color:#1a1a2e;border-color:transparent;font-weight:600;">加入</button>
            </div>
            <div class="msg" id="pwdMsg"></div>
        </div>
    </div>

    <script>
        const API = WORKER_API;
        const params = new URLSearchParams(window.location.search);
        let meetingId = params.get('id') || '';
        let meetingCode = params.get('code') || '';
        let me = '';
        let isHost = false;
        let meeting = null;
        let joined = false;
        let meetingPassword = '';

        // ---------- 工具 ----------
        function escapeHtml(t) {
            if (t === null || t === undefined) return '';
            const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML;
        }
        function token() { return (window.AuthToken && window.AuthToken.get()) || ''; }
        function fmt(t) { const d = new Date(t); return isNaN(d.getTime()) ? '' : d.toLocaleTimeString('zh-CN', { hour12: false }); }
        // 统一的 API 调用：带超时（9 秒）。
        // 网络抖动时浏览器可能长时间挂住一个请求（表现为「信令网络错误：Failed to fetch」或界面卡住），
        // 有超时才能快速失败、交给重试逻辑，否则轮询会被一个卡死的请求永久挡住。
        async function api(path, opts) {
            const o = opts || {};
            const headers = Object.assign({}, o.headers || {});
            if (o.body) headers['Content-Type'] = 'application/json';
            const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) { /* 忽略 */ } }, o.timeout || 9000) : null;
            try {
                const res = await fetch(API + path, {
                    method: o.method || (o.body ? 'POST' : 'GET'),
                    headers: headers,
                    body: o.body ? JSON.stringify(o.body) : undefined,
                    signal: ctrl ? ctrl.signal : undefined,
                });
                const data = await res.json().catch(() => ({}));
                return { status: res.status, ok: res.ok, data };
            } finally {
                if (timer) clearTimeout(timer);
            }
        }        function sysMsg(text) {
            const box = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'cmsg sys';
            div.innerHTML = '<div class="txt">' + escapeHtml(text) + '</div>';
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
        function copyCode() {
            const t = meetingCode;
            if (!t) return;
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t);
            const msg = document.getElementById('mediaMsg');
            msg.innerHTML = '<span class="ok">✅ 已复制会议编号 ' + escapeHtml(t) + '</span>';
            setTimeout(() => { msg.innerHTML = ''; }, 2500);
        }
        function setDiag(which, state, text) {
            const dot = document.getElementById('dot' + which);
            const txt = document.getElementById('txt' + which);
            if (dot) dot.className = 'dot ' + state;
            if (txt && text !== undefined) txt.textContent = text;
        }

        // ============================================================
        //  一、入会（关键：必须先成为会议成员，否则聊天与信令都会被拒绝）
        // ============================================================
        // 入会：带重试。网络抖动（Failed to fetch / 超时）时不能让整个页面卡死在「正在加入会议…」——
        // 以前这里没有 try/catch，一次请求失败就会让 init() 的 Promise 直接 reject，页面从此不再工作。
        async function joinMeeting() {
            setDiag('Join', 'wait', '正在加入会议…');
            const body = { code: meetingCode || meetingId };
            if (meetingPassword) body.password = meetingPassword;
            for (let attempt = 1; attempt <= 3; attempt++) {
                let r = null;
                try {
                    r = await api('/api/meeting/join', { body: body });
                } catch (e) {
                    sysMsg('入会请求失败（第 ' + attempt + ' 次）：' + (e.message || e) + '，正在重试…');
                    setDiag('Join', 'wait', '入会重试中…（第 ' + attempt + ' 次）');
                    await new Promise(res => setTimeout(res, 400 * attempt));
                    continue;
                }
                if (r.ok && r.data.ok) {
                    joined = true;
                    meetingCode = r.data.code || meetingCode;
                    if (!meetingId && r.data.meeting && r.data.meeting.id) meetingId = r.data.meeting.id;
                    setDiag('Join', 'ok', '已入会（' + meetingCode + '）');
                    return true;
                }
                if (r.status === 403 && r.data.code === 'need_password') {
                    setDiag('Join', 'bad', '该会议需要密码');
                    document.getElementById('pwdModal').classList.add('active');
                    document.getElementById('pwdInput').focus();
                    return false;
                }
                if (r.status === 401) {
                    setDiag('Join', 'bad', '登录已过期');
                    window.location.href = 'index.html?next=' + encodeURIComponent('meeting-room.html' + window.location.search);
                    return false;
                }
                // 5xx / 404 之类：退避后重试，仍失败就明确提示
                if (attempt < 3) {
                    setDiag('Join', 'wait', '入会失败，正在重试…（' + (r.data.error || ('HTTP ' + r.status)) + '）');
                    await new Promise(res => setTimeout(res, 400 * attempt));
                    continue;
                }
                setDiag('Join', 'bad', '入会失败：' + (r.data.error || ('HTTP ' + r.status)));
                sysMsg('入会失败：' + (r.data.error || ('HTTP ' + r.status)));
                return false;
            }
            return false;
        }

        function submitPwd() {
            const v = document.getElementById('pwdInput').value.trim();
            const msg = document.getElementById('pwdMsg');
            if (!v) { msg.innerHTML = '<span class="err">请输入会议密码。</span>'; return; }
            msg.innerHTML = '验证中… <span class="spin"></span>';
            meetingPassword = v;
            joinMeeting().then(function (ok) {
                if (ok) {
                    document.getElementById('pwdModal').classList.remove('active');
                    startPollers();
                    loadDetail();
                } else {
                    msg.innerHTML = '<span class="err">密码不正确，请重试。</span>';
                    meetingPassword = '';
                }
            });
        }

        // ============================================================
        //  二、聊天
        // ============================================================
        let lastChatAt = '';
        let chatPolling = false;
        async function loadChat() {
            if (!meetingId || !joined || chatPolling) return;   // 防叠加：上一个请求没回来就不要发新的
            chatPolling = true;
            try {
                const q = '/api/meeting/chat?meetingId=' + encodeURIComponent(meetingId) + (lastChatAt ? '&since=' + encodeURIComponent(lastChatAt) : '');
                const r = await api(q);
                if (!r.ok) {
                    if (r.status === 403) { joined = false; joinMeeting().then(ok => { if (ok) loadChat(); }).catch(() => {}); }
                    return;
                }
                const msgs = r.data.messages || [];
                const box = document.getElementById('chat');
                for (const m of msgs) {
                    if (m.created_at && m.created_at > lastChatAt) lastChatAt = m.created_at;
                    const div = document.createElement('div');
                    div.className = 'cmsg' + (m.sender === me ? ' mine' : '');
                    div.innerHTML = '<div class="who">' + escapeHtml(m.sender) + ' · ' + fmt(m.created_at) + '</div>' +
                        '<div class="txt">' + escapeHtml(m.content) + '</div>';
                    box.appendChild(div);
                }
                if (msgs.length) box.scrollTop = box.scrollHeight;
            } catch (e) { /* 下一轮重试 */ } finally { chatPolling = false; }
        }
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content) return;
            input.value = '';
            try {
                const r = await api('/api/meeting/chat', { body: { meetingId: meetingId, content: content } });
                if (!r.ok || !r.data.ok) { sysMsg('发送失败：' + (r.data.error || ('HTTP ' + r.status))); return; }
                loadChat();
            } catch (e) { sysMsg('发送失败：' + e.message); }
        }

        // ============================================================
        //  三、成员 / 会议状态
        // ============================================================
        let knownMembers = new Set();
        let detailPolling = false;
        async function loadDetail() {
            if (!meetingId || detailPolling) return;   // 防叠加
            detailPolling = true;
            try {
                const r = await api('/api/meeting/detail?id=' + encodeURIComponent(meetingId));
                if (!r.ok || !r.data.ok) {
                    if (r.status === 404) setDiag('Join', 'bad', '会议不存在或已被删除');
                    return;
                }
                meeting = r.data.meeting;
                meetingCode = meeting.code || meetingCode;
                isHost = meeting.host === me;
                document.getElementById('mtTitle').textContent = meeting.title || '会议';
                document.getElementById('mtCode').textContent = meetingCode || '—';
                document.getElementById('mtStatus').textContent =
                    meeting.status === 'ended' ? '（已结束）' : (meeting.status === 'live' ? '（进行中）' : '（未开始）');
                document.getElementById('btnEnd').style.display = (isHost && meeting.status !== 'ended') ? '' : 'none';

                const members = r.data.members || [];
                const active = members.filter(m => m.state === 'joined');
                document.getElementById('memberCount').textContent = active.length;
                document.getElementById('members').innerHTML = members.map(m => {
                    const cls = 'm' + (m.role === 'host' ? ' host' : '') + (m.username === me ? ' me' : '');
                    const state = m.state === 'joined' ? '' : (m.state === 'left' ? '（已离开）' : '（未加入）');
                    return '<span class="' + cls + '">' + escapeHtml(m.username) + (m.role === 'host' ? ' 👑' : '') + state + '</span>';
                }).join('') || '<span class="muted" style="font-size:12.5px;">暂无成员</span>';

                // 成员变化 → 建立/清理点对点连接
                const names = active.map(m => m.username);
                for (const n of names) {
                    if (n !== me && !knownMembers.has(n)) {
                        knownMembers.add(n);
                        sysMsg('👤 ' + n + ' 加入了会议');
                        connectTo(n);
                    }
                }
                for (const n of Array.from(knownMembers)) {
                    if (!names.includes(n)) { knownMembers.delete(n); closePeer(n); sysMsg(n + ' 离开了会议'); }
                }
                renderPeerStates();
                if (meeting.status === 'ended') {
                    document.getElementById('hint').innerHTML = '⛔ 会议已结束。你可以继续查看聊天记录，或返回会议中心。';
                } else if (active.length < 2) {
                    document.getElementById('hint').innerHTML =
                        '你已入会，当前只有你一个人。把会议编号 <b>' + escapeHtml(meetingCode) + '</b> 发给对方，' +
                        '对方在<a href="meeting.html" style="color:var(--accent-color);">会议中心</a>输入编号即可加入。<br>' +
                        '<span style="color:var(--text-secondary);font-size:12.5px;">注意：同一个账号在多个标签页打开无法互相通话（信令按用户名区分），请用另一账号或另一台设备测试。</span>';
                } else {
                    document.getElementById('hint').innerHTML = '已与 ' + (active.length - 1) + ' 位参与者建立连接中。双方都点「开启语音/视频」就能互相听到、看到。';
                }
            } catch (e) { /* 下一轮重试 */ } finally { detailPolling = false; }
        }

        async function endMeeting() {
            if (!confirm('确定结束这场会议？所有参与者都会退出。')) return;
            const r = await api('/api/meeting/end', { body: { meetingId: meetingId } });
            if (!r.ok || !r.data.ok) { sysMsg('结束失败：' + (r.data.error || ('HTTP ' + r.status))); return; }
            sysMsg('会议已结束。');
            cleanupMedia();
            setTimeout(() => { window.location.href = 'meeting.html'; }, 1200);
        }

        async function leaveMeeting() {
            try { await api('/api/meeting/leave', { body: { meetingId: meetingId } }); } catch (e) { /* 忽略 */ }
            cleanupMedia();
            window.location.href = 'meeting.html';
        }

        // ============================================================
        //  四、邀请
        // ============================================================
        function openInvite() { document.getElementById('inviteModal').classList.add('active'); }
        function closeInvite() { document.getElementById('inviteModal').classList.remove('active'); }
        async function sendInvite() {
            const msg = document.getElementById('inviteMsg');
            const names = document.getElementById('inviteNames').value.split(/[,，;；\s]+/).map(s => s.trim()).filter(Boolean);
            if (!names.length) { msg.innerHTML = '<span class="err">请输入至少一个用户名。</span>'; return; }
            msg.innerHTML = '发送中… <span class="spin"></span>';
            try {
                const r = await api('/api/meeting/invite', { body: { meetingId: meetingId, usernames: names } });
                if (!r.ok || !r.data.ok) { msg.innerHTML = '<span class="err">发送失败：' + escapeHtml(r.data.error || ('HTTP ' + r.status)) + '</span>'; return; }
                const invited = r.data.invited || [];
                msg.innerHTML = '<span class="ok">✅ 已邀请 ' + invited.length + ' 人' + (invited.length ? '：' + escapeHtml(invited.join('、')) : '（用户名不存在）') + '</span>';
                document.getElementById('inviteNames').value = '';
                setTimeout(closeInvite, 1500);
            } catch (e) { msg.innerHTML = '<span class="err">网络错误：' + escapeHtml(e.message) + '</span>'; }
        }

        // ============================================================
        //  五、WebRTC 点对点音视频
        //  协商规则（避免 glare）：只有用户名较大的一方（initiator）负责发 offer；
        //  另一方需要新增/变更媒体时，发一条 __renegotiate 请求让 initiator 重新发 offer。
        // ============================================================
        // ICE 配置：只用公共 STUN（不需要 TURN、不需要绑卡）。
        // 多放几家 STUN（含国内可达的），并把候选池开大一点：候选越多，穿透成功率越高。
        const RTC_CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' },
                { urls: 'stun:stun.miwifi.com:3478' },
                { urls: 'stun:stun.chat.bilibili.com:3478' },
                { urls: 'stun:stun.nextcloud.com:443' }
            ],
            iceCandidatePoolSize: 4
        };

        function updateIceHint(text) {
            const box = document.getElementById('iceHint');
            if (box) box.textContent = text;
            const dot = document.getElementById('dotIce');
            if (dot) dot.className = 'dot ok';
        }
        // 服务端若配置了自建 TURN（coturn）就采用；默认只有 STUN（点对点直连）
        async function loadIceConfig() {
            try {
                const r = await api('/api/rtc/ice');
                if (r.ok && r.data && Array.isArray(r.data.iceServers) && r.data.iceServers.length) {
                    const hasTurn = r.data.iceServers.some(s => JSON.stringify(s.urls).indexOf('turn') !== -1);
                    if (hasTurn) {
                        RTC_CONFIG.iceServers = r.data.iceServers;
                        updateIceHint('ICE：STUN + TURN 中继（' + (r.data.source || 'server') + '）');
                        return;
                    }
                }
            } catch (e) { /* 用内置配置 */ }
            updateIceHint('仅 STUN 直连（无需 TURN）');
        }

        let localStream = null;
        let cameraTrack = null;      // 摄像头轨道（共享屏幕时临时替换，结束后恢复）
        let screenTrack = null;      // 屏幕共享轨道
        let micOn = false, camOn = false, sharing = false;
        const peers = {};          // username -> { pc, stream, pending, initiator, answered, offerTimer }
        let lastSignalId = 0;

        // 用户名较大的一方主动发起 offer（双方计算结果互补，不会同时发起）
        function shouldInitiate(other) { return String(me) > String(other); }

        function ensureTile(name, isLocal) {
            let el = document.getElementById('tile-' + cssId(name));
            if (el) return el;
            el = document.createElement('div');
            el.className = 'tile';
            el.id = 'tile-' + cssId(name);
            el.innerHTML = '<div class="avatar">' + escapeHtml((name || '?').slice(0, 1).toUpperCase()) + '</div>' +
                '<div class="nm">' + escapeHtml(name) + (isLocal ? '（我）' : '') + '</div>' +
                '<div class="badge" style="display:none;"></div>';
            document.getElementById('grid').appendChild(el);
            return el;
        }
        function cssId(n) { return String(n).replace(/[^A-Za-z0-9_-]/g, '_'); }
        function tileVideo(name) {
            const el = ensureTile(name, name === me);
            let v = el.querySelector('video');
            if (!v) {
                v = document.createElement('video');
                v.autoplay = true; v.playsInline = true; v.muted = (name === me);
                el.appendChild(v);
            }
            return v;
        }
        function setBadge(name, text) {
            const el = ensureTile(name, name === me);
            const b = el.querySelector('.badge');
            if (!b) return;
            if (text) { b.textContent = text; b.style.display = ''; } else { b.style.display = 'none'; }
        }

        function renderPeerStates() {
            const names = Object.keys(peers);
            const box = document.getElementById('peerStates');
            if (!box) return;
            if (!names.length) { box.innerHTML = '<span class="muted">尚未与其他参与者建立连接（等待对方加入）。</span>'; return; }
            box.innerHTML = names.map(n => {
                const p = peers[n];
                const st = p.pc.connectionState || 'new';
                const map = { new: ['idle', '准备中'], connecting: ['wait', '连接中'], connected: ['ok', '已连接'], disconnected: ['bad', '连接断开'], failed: ['bad', '连接失败'], closed: ['idle', '已关闭'] };
                const m = map[st] || ['idle', st];
                const kinds = [];
                if (p.recvAudio) kinds.push('🔊 已收到声音');
                if (p.recvVideo) kinds.push('🎬 已收到画面');
                return '<div class="row"><span class="dot ' + m[0] + '"></span>' + escapeHtml(n) + '：' + m[1] +
                    (kinds.length ? '（' + kinds.join(' · ') + '）' : (st === 'connected' ? '（我方已发送，等待对方开启语音/视频）' : '')) +
                    '</div>';
            }).join('');
        }

        async function getMedia(wantVideo) {
            return navigator.mediaDevices.getUserMedia({
                audio: true,
                video: wantVideo ? { width: { ideal: 1280 }, height: { ideal: 720 } } : false,
            });
        }

        // 按需打开麦克风 / 摄像头（与 chat.html 的通话一致：先拿到轨道，再 addTrack 挂到各条连接上，
        // 然后按「只有发起方发 offer」的规则重新协商一次）。
        async function ensureLocal(wantVideo) {
            const needAudio = !localStream || localStream.getAudioTracks().length === 0;
            const needVideo = wantVideo && (!localStream || localStream.getVideoTracks().length === 0);
            if (!needAudio && !needVideo) { await pushLocalToPeers(); return localStream; }

            if (!localStream) localStream = new MediaStream();
            const addFrom = (s) => {
                s.getAudioTracks().forEach(t => { if (localStream.getAudioTracks().length === 0) localStream.addTrack(t); else t.stop(); });
                s.getVideoTracks().forEach(t => { if (localStream.getVideoTracks().length === 0) localStream.addTrack(t); else t.stop(); });
            };
            addFrom(await getMedia(needVideo));
            // 摄像头有时第一次拿不到（设备被别的程序占用、刚授权、虚拟摄像头初始化慢）：
            // 重试几次，否则会出现「点了开启视频，但对方一直看不到你」。
            for (let i = 0; i < 3 && wantVideo && localStream.getVideoTracks().length === 0; i++) {
                await new Promise(r => setTimeout(r, 500));
                try { addFrom(await getMedia(true)); } catch (e) { /* 继续重试 */ }
            }
            // 麦克风同理
            for (let i = 0; i < 2 && localStream.getAudioTracks().length === 0; i++) {
                await new Promise(r => setTimeout(r, 400));
                try { addFrom(await getMedia(false)); } catch (e) { /* 继续重试 */ }
            }
            const v = tileVideo(me);
            v.srcObject = localStream;
            v.muted = true;
            v.play().catch(() => { /* 本地预览静音，通常不会被拦截 */ });
            await pushLocalToPeers();
            return localStream;
        }

        async function toggleMic() {
            const msg = document.getElementById('mediaMsg');
            const btn = document.getElementById('btnMic');
            try {
                if (!localStream || localStream.getAudioTracks().length === 0) {
                    await ensureLocal(false);
                    if (!localStream || localStream.getAudioTracks().length === 0) {
                        micOn = false;
                        btn.classList.remove('on');
                        btn.textContent = '🎙️ 开启语音';
                        msg.innerHTML = '<span class="err">没有拿到麦克风（可能被其它程序占用或权限被拒绝）。请检查后重试。</span>';
                        renderPeerStates();
                        return;
                    }
                    micOn = true;
                    btn.classList.add('on');
                    btn.textContent = '🎙️ 静音';
                    setBadge(me, '');
                    msg.innerHTML = '<span class="ok">✅ 语音已开启并开始发送。</span>';
                } else {
                    micOn = !micOn;
                    localStream.getAudioTracks().forEach(t => { t.enabled = micOn; });
                    btn.classList.toggle('on', micOn);
                    btn.textContent = micOn ? '🎙️ 静音' : '🎙️ 开启语音';
                    setBadge(me, micOn ? '' : '🔇');
                    msg.innerHTML = micOn ? '<span class="ok">🎙️ 已取消静音。</span>' : '<span class="muted">🔇 已静音（对方听不到你的声音）。</span>';
                }
            } catch (e) {
                msg.innerHTML = '<span class="err">无法访问麦克风：' + escapeHtml(e.message) + '（请检查浏览器权限，并确认站点使用 HTTPS）</span>';
            }
            renderPeerStates();
        }

        async function toggleCam() {
            const msg = document.getElementById('mediaMsg');
            const btn = document.getElementById('btnCam');
            try {
                if (!localStream || localStream.getVideoTracks().length === 0) {
                    msg.innerHTML = '正在请求摄像头权限…';
                    await ensureLocal(true);
                    if (!localStream || localStream.getVideoTracks().length === 0) {
                        camOn = false;
                        btn.classList.remove('on');
                        btn.textContent = '🎥 开启视频';
                        msg.innerHTML = '<span class="err">没有拿到摄像头画面（可能被其它程序占用或权限被拒绝）。请检查后重试，你仍然可以使用语音。</span>';
                        renderPeerStates();
                        return;
                    }
                    camOn = true;
                    btn.classList.add('on');
                    btn.textContent = '🎥 关闭视频';
                    if (localStream.getAudioTracks().length) {
                        micOn = true;
                        document.getElementById('btnMic').classList.add('on');
                        document.getElementById('btnMic').textContent = '🎙️ 静音';
                    }
                    msg.innerHTML = '<span class="ok">✅ 摄像头已开启并开始发送画面。</span>';
                } else {
                    camOn = !camOn;
                    localStream.getVideoTracks().forEach(t => { t.enabled = camOn; });
                    btn.classList.toggle('on', camOn);
                    btn.textContent = camOn ? '🎥 关闭视频' : '🎥 开启视频';
                    msg.innerHTML = camOn ? '<span class="ok">🎥 视频已恢复。</span>' : '<span class="muted">🎥 视频已关闭（对方看不到画面）。</span>';
                }
            } catch (e) {
                msg.innerHTML = '<span class="err">无法访问摄像头：' + escapeHtml(e.message) + '（请检查浏览器权限，并确认没有其它程序占用摄像头）</span>';
            }
            renderPeerStates();
        }

        // 找到某条连接上该类型的 transceiver：
        //   idle —— sender 还没有轨道的那条（占位 transceiver，或对端 offer 协商出来的接收通道），
        //          开麦/开摄像头时优先把轨道放进它，这样 m-line 不会多出来、answer 也不会变 recvonly；
        //   busy —— 已经挂着同类型轨道的（例如摄像头/屏幕切换时用）。
        function transceiverFor(p, kind) {
            const same = p.pc.getTransceivers().filter(t => !t.stopped).filter(t => {
                const k = (t.sender && t.sender.track && t.sender.track.kind)
                    || (t.receiver && t.receiver.track && t.receiver.track.kind);
                return k === kind;
            });
            // 优先选「已经和 m-line 关联(mid 非空)」的那条空 transceiver：
            // 只有它才是真正协商出去的通道；把轨道挂到 mid=null 的孤立 transceiver 上，
            // 对方永远收不到（这是之前「能听能看对方、自己发不出去」的根源）。
            const idle = same.find(t => t.mid !== null && !t.sender.track)
                || same.find(t => !t.sender.track)
                || null;
            return { idle: idle, busy: same.find(t => t.sender.track) || null };
        }

        // 发起方在生成 offer 之前，为「自己还没有本地轨道的媒体类型」补一条 recvonly transceiver：
        // 保证 offer 里一定有 audio/video 两条 m-line，这样即使自己没开麦，对方也能通过 answer 把
        // 声音画面发过来（answer 不能新增 m-line，只能跟着 offer 走）。
        function ensureOfferTransceivers(p) {
            for (const kind of ['audio', 'video']) {
                const has = p.pc.getTransceivers().some(t => {
                    const k = (t.sender && t.sender.track && t.sender.track.kind)
                        || (t.receiver && t.receiver.track && t.receiver.track.kind);
                    return k === kind;
                });
                if (has) continue;
                try { p.pc.addTransceiver(kind, { direction: 'recvonly' }); } catch (e) { console.warn('addTransceiver 失败', e); }
            }
        }

        // 把本地音视频轨道挂到某条连接上（与 chat.html 的通话一致）
        //   1) 优先复用同类型、sender 还没轨道的 transceiver（自己 offer 里的占位，或对方 offer 协商出来的那条）
        //      —— 用 replaceTrack 并改成 sendrecv，这样不会多出 m-line，answer 里也是 sendrecv；
        //   2) 没有可复用的才用 addTrack（新建的 transceiver 可以被对方后续的 offer 按类型匹配到）。
        async function attachLocal(name) {
            const p = peers[name];
            if (!p || !localStream) return;
            for (const track of localStream.getTracks()) {
                if (p.addedTracks.has(track.id)) continue;
                const { idle } = transceiverFor(p, track.kind);
                if (idle) {
                    try {
                        await idle.sender.replaceTrack(track);
                        idle.direction = 'sendrecv';
                        p.addedTracks.add(track.id);
                        continue;
                    } catch (e) { console.warn('replaceTrack 失败', name, e); }
                }
                try {
                    p.pc.addTrack(track, localStream);
                    p.addedTracks.add(track.id);
                } catch (e) { console.warn('addTrack 失败', name, e); }
            }
        }

        // 媒体发生变化（首次开麦/开摄像头）后：
        // 先把轨道挂到所有连接上，再按 chat.html 的规则重新协商——发起方发新 offer，
        // 被动方发一条 __renegotiate 请求，让对方来 offer（避免双方同时 offer 造成 glare）。
        async function pushLocalToPeers() {
            for (const name of Object.keys(peers)) {
                await attachLocal(name);
                await sendSignal(name, 'ice', { __ready: true });   // 通知对端「我已经有媒体了」
                const p = peers[name];
                if (p && p.initiator && p.peerReady) await makeOffer(name);
                else await requestNegotiation(name);
            }
            // 挂完轨道后立刻自检一次（不等 5 秒定时器）：
            // 常见情况是某一方先发了 offer（那时自己摄像头还没就绪，m-line 协商成了 recvonly），
            // 之后轨道才挂上——这里马上再协商一轮，双向就都通了。
            setTimeout(checkNegotiationDrift, 800);
        }

        function createPeer(name, initiator) {
            if (peers[name]) return peers[name];
            const pc = new RTCPeerConnection(RTC_CONFIG);
            const p = {
                pc: pc, stream: null, pending: [], initiator: !!initiator, answered: false,
                offerAt: 0, recvAudio: false, recvVideo: false, negotiating: false,
                addedTracks: new Set(),   // 已经 addTrack 到这条连接的轨道 id（避免重复添加）
                queue: Promise.resolve(), // 信令处理串行化：避免多轮 offer/answer 交叉执行
                offerTimer: null,
            };
            peers[name] = p;

            // 注意：这里**不能**预建 transceiver。
            // addTransceiver() 建出来的 transceiver 只会成为「自己发出的 offer」里的 m-line，
            // 永远不会被匹配到「别人发来的 offer」的 m-line 上；被动方预建之后，自己的轨道就会挂在
            // mid=null 的孤立 transceiver 上 → 表现为「能看到听到对方，但自己的声音画面发不出去」。
            // 正确做法（与 chat.html 的通话一致）：
            //   · 发起方在 makeOffer 前才为「自己还没有的媒体类型」补一条 recvonly transceiver，保证 offer 里有 m-line；
            //   · 被动方收到 offer、应用之后再把自己的轨道挂到 offer 协商出来的 transceiver 上（见 attachLocal）。
            pc.onicecandidate = (ev) => {
                if (ev.candidate) queueCandidate(name, ev.candidate.toJSON());
            };
            pc.ontrack = (ev) => {
                if (!p.stream) {
                    p.stream = new MediaStream();
                    const v = tileVideo(name);
                    v.srcObject = p.stream;
                    v.play().then(() => {
                        document.getElementById('playBanner').style.display = 'none';
                    }).catch(() => {
                        // 浏览器自动播放策略拦截了带声音的播放：给一个手动恢复入口
                        document.getElementById('playBanner').style.display = 'block';
                    });
                }
                p.stream.addTrack(ev.track);
                const kind = ev.track.kind;
                if (kind === 'audio') p.recvAudio = true;
                if (kind === 'video') p.recvVideo = true;
                ev.track.onunmute = () => {
                    if (kind === 'audio') p.recvAudio = true;
                    if (kind === 'video') p.recvVideo = true;
                    setBadge(name, '');
                    renderPeerStates();
                };
                ev.track.onmute = () => {
                    if (kind === 'audio') p.recvAudio = false;
                    if (kind === 'video') p.recvVideo = false;
                    renderPeerStates();
                };
                renderPeerStates();
            };
            pc.onconnectionstatechange = () => {
                renderPeerStates();
                const st = pc.connectionState;
                if (st === 'connected') {
                    document.getElementById('mediaMsg').innerHTML = '<span class="ok">🔗 已与 ' + escapeHtml(name) + ' 建立点对点连接。</span>';
                    setTimeout(checkNegotiationDrift, 600);   // 连上后再自检一次方向
                } else if (st === 'failed' || st === 'disconnected') {
                    setBadge(name, '⚠️ 连接不稳定');
                    // 尝试用 ICE 重启恢复（只有发起方重新发 offer）
                    if (shouldInitiate(name) && !p.renegotiating) {
                        p.renegotiating = true;
                        setTimeout(() => { p.renegotiating = false; makeOffer(name, true); }, 1200);
                    }
                }
            };
            return p;
        }

        // 新成员出现时调用。
        // 协商时机（与 chat.html 的通话一致：先有媒体再 offer/answer）：
        //   · 自己已有媒体、且对端也报过「我也有媒体」→ 立刻 offer（一轮就把双向都协商成 sendrecv）
        //   · 自己已有媒体但还没等到对方 → 3 秒宽限后仍然 offer（对方不开媒体也能先看到听到我们）
        //   · 自己还没有媒体 → 不主动 offer，等对方的 __ready 或自己开麦后再协商
        async function connectTo(name) {
            const p = createPeer(name, shouldInitiate(name));
            await attachLocal(name);
            const hasMedia = !!(localStream && localStream.getTracks().length);
            if (hasMedia) await sendSignal(name, 'ice', { __ready: true });   // 告诉对方我已经有媒体
            if (p.initiator && hasMedia) {
                if (p.peerReady) await makeOffer(name);
                else {
                    if (p.readyTimer) clearTimeout(p.readyTimer);
                    p.readyTimer = setTimeout(() => { p.readyTimer = null; if (objectsStableReady(p)) makeOffer(name); }, 3000);
                }
            }
            renderPeerStates();
        }

        // offer 前再确认一次连接状态可用（避免刚被关掉/正在关闭）
        function objectsStableReady(p) {
            return p && p.pc && !p.pc.__closed && (p.pc.signalingState === 'stable' || p.pc.signalingState === 'new');
        }

        // 等连接回到 stable（正在协商时不要叠加新的 offer）
        async function waitStable(pc, tries) {
            for (let i = 0; i < (tries || 12); i++) {
                if (pc.signalingState === 'stable') return true;
                await new Promise(r => setTimeout(r, 250));
            }
            return pc.signalingState === 'stable';
        }

        async function makeOffer(name, iceRestart) {
            const p = createPeer(name, shouldInitiate(name));
            await attachLocal(name);
            if (!(await waitStable(p.pc))) return;      // 正在协商中：交给当前这一轮，等它结束再重试
            try {
                ensureOfferTransceivers(p);             // 保证 offer 里一定有 audio/video 两条 m-line
                const offer = await p.pc.createOffer(iceRestart ? { iceRestart: true } : {});
                await p.pc.setLocalDescription(offer);
                p.offerAt = Date.now();
                p.answered = false;
                const sent = await sendSignal(name, 'offer', { type: offer.type, sdp: offer.sdp });
                // 答案迟迟不来（例如对方页面刚从后台恢复）→ 重试一次（同一时刻只保留一个重试定时器）
                if (sent) {
                    if (p.offerTimer) clearTimeout(p.offerTimer);
                    p.offerTimer = setTimeout(() => {
                        p.offerTimer = null;
                        if (!p.answered && p.pc && p.pc.signalingState === 'have-local-offer') makeOffer(name, false);
                    }, 6000);
                }
            } catch (e) { console.warn('createOffer 失败', e); }
        }

        // 媒体变化后请求（重新）协商：
        //   发起方直接发新 offer；被动方发一条 __renegotiate 信令，让发起方来 offer。
        async function requestNegotiation(name) {
            const p = peers[name];
            if (!p) return;
            // 节流：2 秒内不对同一个对端重复请求协商，避免「自检 + 媒体变化」叠加成一串 __renegotiate
            const now = Date.now();
            if (p.negAt && now - p.negAt < 2000) return;
            p.negAt = now;
            await attachLocal(name);
            if (p.initiator) {
                await makeOffer(name, false);
            } else {
                await sendSignal(name, 'ice', { __renegotiate: true });
            }
        }

        // 自愈：本地明明有轨道、方向也写着要发（sendrecv/sendonly），但协商结果却没让我们发
        // （currentDirection 是 recvonly/inactive）——这通常是「双方几乎同时开麦/开摄像头」时
        // 挂轨道与协商交错造成的，再协商一轮即可恢复。发现漂移后会连着复查几轮直到收敛。
        let driftRetries = 0;
        function checkNegotiationDrift() {
            let drifted = false;
            for (const name of Object.keys(peers)) {
                const p = peers[name];
                if (!p || !p.pc || p.pc.signalingState !== 'stable') continue;
                const drift = p.pc.getTransceivers().some(t => {
                    const want = (t.direction === 'sendrecv' || t.direction === 'sendonly');
                    const got = (t.currentDirection === 'sendrecv' || t.currentDirection === 'sendonly');
                    return want && t.sender && t.sender.track && !got;
                });
                if (drift) { requestNegotiation(name); drifted = true; }
            }
            if (drifted && driftRetries < 5) {
                driftRetries++;
                setTimeout(checkNegotiationDrift, 3000);   // 一轮没修好就接着来，最多 5 轮
            } else if (!drifted) {
                driftRetries = 0;
            }
        }
        setInterval(checkNegotiationDrift, 5000);

        // 手动「重新连接」：发起方直接做 ICE 重启，被动方请求对方重启
        async function restartConnections() {
            const msg = document.getElementById('mediaMsg');
            const names = Object.keys(peers);
            if (!names.length) { msg.innerHTML = '<span class="muted">还没有可重连的对端（等待对方加入会议）。</span>'; return; }
            msg.innerHTML = '正在重新建立连接… <span class="spin"></span>';
            for (const name of names) {
                setBadge(name, '🔄 重连中');
                if (shouldInitiate(name)) {
                    await makeOffer(name, true);
                } else {
                    await attachLocal(name);
                    await sendSignal(name, 'ice', { __renegotiate: true, iceRestart: true });
                }
            }
            msg.innerHTML = '<span class="warn">已发起重连，请让对方的诊断条也变成「已连接」。</span>';
        }
        window.restartConnections = restartConnections;

        // 信令处理：每条连接串行执行，避免多轮 offer/answer 交叉（否则会出现
        // 「Failed to set local answer sdp: Called in wrong state: stable」这类竞态，双方都连不上）
        async function handleSignal(sig) {
            const from = sig.from_user;
            if (!from || from === me) return;
            const p = createPeer(from, false);
            p.queue = p.queue.then(() => handleSignalNow(p, from, sig)).catch(e => console.warn('处理信令失败', sig.kind, e));
            return p.queue;
        }

        async function handleSignalNow(p, from, sig) {
            const payload = sig.payload;
            const pc = p.pc;
            if (sig.kind === 'offer') {
                // 被动方才会收到 offer（发起方由 webrtc 的 shouldInitiate 规则唯一确定）
                if (p.initiator) return;
                // 顺序很关键（照搬 chat.html 通话的被叫流程）：
                // 先 setRemoteDescription 把对方 offer 的 m-line 建出来，再把本地轨道挂到这些
                // transceiver 上（attachLocal 里的 replaceTrack + sendrecv），最后 createAnswer ——
                // 这样 answer 里对应 m-line 才是 sendrecv，自己的声音画面才发得出去。
                await pc.setRemoteDescription(new RTCSessionDescription(payload));
                await attachLocal(from);
                if (pc.signalingState !== 'have-remote-offer') return;
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendSignal(from, 'answer', { type: answer.type, sdp: answer.sdp });
            } else if (sig.kind === 'answer') {
                p.answered = true;
                if (pc.signalingState === 'have-local-offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(payload));
                }
                // 协商完成后自检：如果对方 answer 里我们的 m-line 是 recvonly（对方当时还没开麦/开摄像头），
                // 等我们自己的轨道挂上后要主动再协商一次
                setTimeout(checkNegotiationDrift, 300);
            } else if (sig.kind === 'ice') {
                if (payload && payload.__ready) {
                    // 对方已开启音视频：如果我是发起方且有媒体，立刻 offer（一轮协商双向都通）
                    p.peerReady = true;
                    const hasMedia = !!(localStream && localStream.getTracks().length);
                    if (p.initiator && hasMedia && pc.signalingState !== 'have-local-offer') await makeOffer(from);
                } else if (payload && payload.__renegotiate) {
                    // 对方需要重新协商（例如刚开启摄像头）→ 由我们发新 offer；带 iceRestart 时顺便重启 ICE
                    await makeOffer(from, !!payload.iceRestart);
                } else if (payload && Array.isArray(payload.candidates)) {
                    // 合并发来的候选（新格式）
                    for (const c of payload.candidates) {
                        if (pc.remoteDescription && pc.remoteDescription.type) {
                            try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) { /* 忽略单个候选 */ }
                        } else {
                            p.pending.push(c);
                        }
                    }
                } else if (pc.remoteDescription && pc.remoteDescription.type) {
                    await pc.addIceCandidate(new RTCIceCandidate(payload));
                } else {
                    p.pending.push(payload);
                }
            }
            if (pc.remoteDescription && pc.remoteDescription.type && p.pending.length) {
                for (const c of p.pending.splice(0)) {
                    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) { /* 忽略 */ }
                }
            }
        }

        // ------------------------------------------------------------
        //  信令发送：串行 + 失败重试 + ICE 候选合并
        //  之前每个 ICE 候选都单独 POST，一个连接动辄几十条请求，叠加 1 秒一次的信令轮询，
        //  很容易出现「信令网络错误：Failed to fetch」（请求在浏览器/边缘层就断了），
        //  候选与 SDP 丢掉之后就再也协商不起来。现在：
        //    · 候选先缓冲，300ms 或攒够 8 条合并成一条信令发出；
        //    · 所有信令排成一个队列逐条发送（不并发抢连接）；
        //    · 发送失败自动退避重试（最多 6 次），不再静默丢包。
        // ------------------------------------------------------------
        const signalQueue = [];
        let signalFlushing = false;
        let sigSent = 0, sigFailed = 0;

        function queueSignal(to, kind, payload) {
            signalQueue.push({ to: to, kind: kind, payload: payload, tries: 0 });
            flushSignals();
        }

        async function flushSignals() {
            if (signalFlushing) return;
            signalFlushing = true;
            try {
                while (signalQueue.length) {
                    const s = signalQueue[0];
                    const ok = await postSignal(s.to, s.kind, s.payload);
                    if (ok) { signalQueue.shift(); sigSent++; }
                    else {
                        s.tries++;
                        if (s.tries >= 6) {
                            signalQueue.shift(); sigFailed++;
                            setDiag('Signal', 'bad', '信令发送失败（已重试 6 次，连接可能不稳定）');
                        } else {
                            setDiag('Signal', 'wait', '信令重试中…（第 ' + (s.tries + 1) + ' 次）');
                            await new Promise(r => setTimeout(r, 250 * s.tries));
                        }
                    }
                }
            } finally {
                signalFlushing = false;
                if (signalQueue.length) setTimeout(flushSignals, 50);
            }
        }

        async function postSignal(to, kind, payload) {
            try {
                const r = await api('/api/meeting/signal', { body: { meetingId: meetingId, to: to, kind: kind, payload: payload } });
                if (!r.ok) {
                    if (r.status === 403) { joined = false; joinMeeting(); return true; }   // 重新入会后再协商
                    return false;
                }
                setDiag('Signal', 'ok', '信令：正常');
                return true;
            } catch (e) {
                // 网络层失败（Failed to fetch 等）：返回 false 交给队列退避重试，不再直接报错
                return false;
            }
        }

        // 向下兼容：sendSignal 仍然可用（内部走队列）
        async function sendSignal(to, kind, payload) {
            queueSignal(to, kind, payload);
            return true;
        }

        // ICE 候选：逐条立即入队发送（与 chat.html 通话一致 —— 那边就是这么发的，最可靠）。
        // 队列会把它们串行化 + 失败重试，所以不会像以前那样「几十条并发 POST 打满连接」。
        function queueCandidate(name, cand) {
            queueSignal(name, 'ice', cand);
        }

        // 轮询信令（同一时刻只跑一个，避免请求堆叠）
        let signalPolling = false;
        async function pollSignals() {
            if (!meetingId || !joined || signalPolling) return;
            signalPolling = true;
            try {
                const r = await api('/api/meeting/signal?meetingId=' + encodeURIComponent(meetingId) + '&since=' + lastSignalId);
                if (!r.ok) {
                    if (r.status === 403) { joined = false; setDiag('Signal', 'bad', '信令：无权访问（正在重新入会）'); joinMeeting(); }
                    return;
                }
                const list = r.data.signals || [];
                for (const sig of list) {
                    if (sig.id > lastSignalId) lastSignalId = sig.id;
                    // 关键：不要 await —— 处理一条信令可能涉及协商（要等 stable、createOffer…），
                    // 一旦在这里 await，轮询就被卡住，后面的 answer/candidate 迟迟取不到，
                    // 表现为「一方一直 have-local-offer、另一方一直 checking」，永远连不上。
                    // handleSignal 内部按对端串行（p.queue），这里直接放手让它跑即可。
                    handleSignal(sig).catch(() => {});
                }
                if (typeof r.data.lastId === 'number' && r.data.lastId > lastSignalId) lastSignalId = r.data.lastId;
            } catch (e) {
                // 网络抖动：下一轮继续（不影响已建立的点对点连接）
            } finally {
                signalPolling = false;
            }
        }

        // ============================================================
        //  会议笔记：会上随时记录，逐字稿 / 讨论区 / AI 纪要都写进同一篇笔记
        //  笔记存于笔记系统（notes 表，kind='meeting'），会后可在 notes.html 查看/修改/共享
        // ============================================================
        let meetingNote = null;      // { id, content, canEdit, role }
        let noteDirty = false;
        let noteTimer = null;
        let sttOn = false, sttRec = null;

        async function loadMeetingNote(create) {
            try {
                const q = '/api/notes/meeting?meetingId=' + encodeURIComponent(meetingId) + (create ? '&create=1' : '');
                const r = await api(q);
                if (!r.ok || !r.data.ok) { setNoteStatus('笔记不可用：' + ((r.data && r.data.error) || ('HTTP ' + r.status)), 'err'); return null; }
                if (!r.data.note) { meetingNote = null; setNoteStatus('还没有会议笔记', 'muted'); return null; }
                meetingNote = r.data.note;
                meetingNote.canEdit = r.data.canEdit;
                meetingNote.role = r.data.role;
                const area = document.getElementById('noteArea');
                if (area && document.activeElement !== area) area.value = meetingNote.content || '';
                if (area) {
                    area.readOnly = !meetingNote.canEdit;
                    area.placeholder = meetingNote.canEdit ? '在这里记录会议要点…（自动保存）' : '（只读：你对这篇笔记没有修改权限，主持人可在笔记页共享给你编辑权）';
                }
                setNoteStatus((meetingNote.canEdit ? '' : '只读 · ') + '最后修改 ' + fmt(meetingNote.updatedAt) + (meetingNote.updatedBy ? '（' + meetingNote.updatedBy + '）' : ''), 'muted');
                return meetingNote;
            } catch (e) { setNoteStatus('笔记加载失败：' + e.message, 'err'); return null; }
        }

        function setNoteStatus(text, cls) {
            const el = document.getElementById('noteStatus');
            if (!el) return;
            el.className = 'muted ' + (cls || '');
            el.textContent = text || '';
        }

        async function toggleNotes() {
            const panel = document.getElementById('notePanel');
            const show = panel.style.display === 'none';
            panel.style.display = show ? '' : 'none';
            document.getElementById('btnNotes').classList.toggle('on', show);
            if (show) {
                if (!meetingNote) await loadMeetingNote(true);
                const a = document.getElementById('noteArea');
                if (a && meetingNote && a !== document.activeElement) a.value = meetingNote.content || '';
            }
        }

        function noteChanged() {
            if (!meetingNote || !meetingNote.canEdit) return;
            noteDirty = true;
            setNoteStatus('有未保存的修改…', 'warn');
            if (noteTimer) clearTimeout(noteTimer);
            noteTimer = setTimeout(saveMeetingNote, 2000);
        }

        async function saveMeetingNote(silent) {
            if (!meetingNote || !meetingNote.canEdit) return;
            const area = document.getElementById('noteArea');
            const content = area ? area.value : '';
            if (!noteDirty && silent) return;
            const r = await api('/api/notes/update', { body: { id: meetingNote.id, content } });
            if (!r.ok || !r.data.ok) { setNoteStatus('保存失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status)), 'err'); return; }
            meetingNote.content = content;
            meetingNote.updatedAt = r.data.updatedAt;
            meetingNote.updatedBy = r.data.updatedBy;
            noteDirty = false;
            setNoteStatus('已保存 · ' + fmt(r.data.updatedAt), 'ok');
        }

        // 往笔记里追加一段（带小标题，已存在则不重复建标题）
        async function appendToNote(sectionTitle, text) {
            if (!meetingNote) await loadMeetingNote(true);
            if (!meetingNote) { sysMsg('笔记不可用，无法写入'); return false; }
            if (!meetingNote.canEdit) {
                // 只读时：把内容附加到本地视图并提示（不写库）
                const area = document.getElementById('noteArea');
                if (area) area.value += '\n\n' + sectionTitle + '\n' + text;
                setNoteStatus('你没有修改权限，内容只显示在本地；可让主持人在笔记页给你编辑权', 'warn');
                return false;
            }
            const cur = meetingNote.content || '';
            let next;
            if (cur.indexOf(sectionTitle) === -1) {
                next = cur.replace(/\s*$/, '') + (cur.trim() ? '\n\n' : '') + sectionTitle + '\n\n' + text;
            } else {
                next = cur.replace(/\s*$/, '') + '\n' + text;
            }
            const r = await api('/api/notes/update', { body: { id: meetingNote.id, content: next } });
            if (!r.ok || !r.data.ok) { setNoteStatus('写入失败：' + ((r.data && r.data.error) || ('HTTP ' + r.status)), 'err'); return false; }
            meetingNote.content = next;
            meetingNote.updatedAt = r.data.updatedAt;
            const area = document.getElementById('noteArea');
            if (area && document.activeElement !== area) area.value = next;
            setNoteStatus('已写入笔记 · ' + fmt(r.data.updatedAt), 'ok');
            return true;
        }

        // 导入本次会议的讨论区消息
        async function importChat() {
            const btn = event && event.target;
            if (btn) btn.disabled = true;
            try {
                const r = await api('/api/meeting/chat?meetingId=' + encodeURIComponent(meetingId));
                const msgs = (r.data && r.data.messages) || [];
                if (!msgs.length) { sysMsg('本次会议还没有讨论区消息'); return; }
                const stamp = new Date().toLocaleString('zh-CN', { hour12: false });
                const lines = msgs.map(m => '- [' + fmt(m.created_at) + '] **' + m.sender + '**：' + String(m.content || '').replace(/\n/g, ' ')).join('\n');
                const ok = await appendToNote('## 讨论区记录（导入于 ' + stamp + '）', lines);
                sysMsg(ok ? ('已把 ' + msgs.length + ' 条讨论区消息导入会议笔记') : '讨论区消息已显示在笔记面板（无写入权限）');
            } finally { if (btn) btn.disabled = false; }
        }

        function openNotePage() {
            if (!meetingNote) { window.location.href = 'notes.html'; return; }
            window.open('notes.html?id=' + encodeURIComponent(meetingNote.id), '_blank');
        }

        // ---------- 语音转文字（浏览器实时识别，逐字稿写入笔记） ----------
        function toggleStt() {
            const btn = document.getElementById('btnStt');
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!sttOn) {
                if (!SR) { sysMsg('当前浏览器不支持实时语音识别（请用桌面版 Chrome / Edge）'); return; }
                sttRec = new SR();
                sttRec.lang = 'zh-CN';
                sttRec.continuous = true;
                sttRec.interimResults = false;
                sttRec.onresult = async (ev) => {
                    for (let i = ev.resultIndex; i < ev.results.length; i++) {
                        if (!ev.results[i].isFinal) continue;
                        const text = String(ev.results[i][0].transcript || '').trim();
                        if (!text) continue;
                        sysMsg('🎤 ' + text);
                        await appendToNote('## 语音逐字稿', '- [' + fmt(new Date().toISOString()) + '] **' + me + '**：' + text);
                    }
                };
                sttRec.onerror = (e) => { sysMsg('语音识别出错：' + (e.error || '未知错误')); };
                sttRec.onend = () => { if (sttOn) { try { sttRec.start(); } catch (e) { /* 忽略 */ } } };
                try { sttRec.start(); } catch (e) { sysMsg('无法启动语音识别：' + e.message); return; }
                sttOn = true;
                btn.classList.add('on');
                btn.textContent = '🎤 停止转写';
                sysMsg('已开启语音转文字：你说的话会被转成文字写入会议笔记（逐字稿）');
            } else {
                sttOn = false;
                try { sttRec && sttRec.stop(); } catch (e) { /* 忽略 */ }
                btn.classList.remove('on');
                btn.textContent = '🎤 语音转文字';
                sysMsg('已停止语音转文字');
            }
        }

        // ---------- AI 会议托管：基于逐字稿 + 讨论区生成纪要 ----------
        async function generateMinutes() {
            const btn = event && event.target;
            if (btn) { btn.disabled = true; btn.textContent = '🤖 生成中…'; }
            try {
                if (!meetingNote) await loadMeetingNote(true);
                if (!meetingNote) { sysMsg('笔记不可用'); return; }
                const noteText = (document.getElementById('noteArea') || {}).value || meetingNote.content || '';
                const cr = await api('/api/meeting/chat?meetingId=' + encodeURIComponent(meetingId));
                const msgs = (cr.data && cr.data.messages) || [];
                const chatText = msgs.map(m => m.sender + '：' + String(m.content || '').replace(/\n/g, ' ')).join('\n');
                if (!noteText.trim() && !chatText.trim()) { sysMsg('还没有逐字稿或讨论区内容，无法生成纪要'); return; }
                sysMsg('正在生成会议纪要，请稍候…');
                const summary = await callHzyaiSummary(noteText, chatText, (meeting && meeting.title) || '会议');
                if (!summary) { sysMsg('生成失败：AI 服务暂时不可用（可稍后重试）'); return; }
                const stamp = new Date().toLocaleString('zh-CN', { hour12: false });
                const ok = await appendToNote('## 会议纪要（AI 生成于 ' + stamp + '）', summary);
                sysMsg(ok ? '会议纪要已写入笔记' : '纪要已显示在笔记面板（无写入权限）');
            } catch (e) {
                sysMsg('生成失败：' + e.message);
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '🤖 生成纪要'; }
            }
        }

        async function callHzyaiSummary(noteText, chatText, title) {
            const prompt = '你是会议记录助手。请根据下面的会议材料输出中文会议纪要，格式：\n' +
                '### 会议主题\n（一句话）\n### 关键讨论\n（3-6 条要点）\n### 结论与决定\n（如有）\n### 待办事项\n（负责人 + 事项，如无则写"无"）\n' +
                '要求：只依据材料，不要编造；材料不足时明确说明。\n\n' +
                '会议标题：' + title + '\n\n【会议笔记/逐字稿】\n' + String(noteText).slice(0, 6000) +
                '\n\n【讨论区消息】\n' + String(chatText).slice(0, 4000);
            // HZYAI 网关：POST /chat，body { messages:[{role,content}], model, max_tokens }，返回 { response }
            const endpoints = [
                { url: 'https://hzyai-worker.nflshcchat.cc.cd/chat', body: { messages: [{ role: 'user', content: prompt }], max_tokens: 2048 } },
                { url: 'https://hzyai-worker.nflshcchat.cc.cd/chat', body: { messages: [{ role: 'user', content: prompt }], model: '@cf/meta/llama-3.1-8b-instruct', max_tokens: 2048 } },
            ];
            for (const ep of endpoints) {
                try {
                    const res = await fetch(ep.url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(ep.body),
                    });
                    if (!res.ok) continue;
                    const data = await res.json().catch(() => null);
                    if (!data) continue;
                    const text = data.response || data.reply || data.content || data.text || data.answer ||
                        (data.choices && data.choices[0] && (data.choices[0].message ? data.choices[0].message.content : data.choices[0].text)) ||
                        (data.result && data.result.response) || (data.data && data.data.content);
                    if (text && String(text).trim().length > 10) return String(text).trim();
                } catch (e) { /* 试下一个入口 */ }
            }
            return null;
        }

        window.toggleNotes = toggleNotes;
        window.saveMeetingNote = saveMeetingNote;
        window.importChat = importChat;
        window.openNotePage = openNotePage;
        window.toggleStt = toggleStt;
        window.generateMinutes = generateMinutes;

        function closePeer(name) {
            const p = peers[name];
            if (!p) return;
            try { p.pc.close(); } catch (e) { /* 忽略 */ }
            delete peers[name];
            const el = document.getElementById('tile-' + cssId(name));
            if (el) el.remove();
            renderPeerStates();
        }

        function cleanupMedia() {
            for (const n of Object.keys(peers)) closePeer(n);
            if (localStream) { localStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); localStream = null; }
            if (screenTrack) { try { screenTrack.stop(); } catch (e) {} screenTrack = null; }
        }

        // ============================================================
        //  屏幕共享：把显示器/窗口的轨道换到「正在发送视频的那个 sender」上。
        //  同类型轨道替换用 replaceTrack 即可（不需要重新协商）；若对方还没有任何视频轨道，
        //  则用 addTrack 挂上并触发一次重新协商。
        // ============================================================
        function videoSenderOf(p) {
            return p.pc.getSenders().find(s => s.track && s.track.kind === 'video') || null;
        }

        async function swapVideoTrack(name, track, replacedTrack) {
            const p = peers[name];
            if (!p) return;
            const sender = videoSenderOf(p);
            if (sender) {
                try { await sender.replaceTrack(track); } catch (e) { console.warn('替换视频轨道失败', name, e); }
            } else if (track) {
                // 还没有视频 sender：优先复用一条空闲的 video transceiver（对方 offer 协商出来的那条）
                const { idle } = transceiverFor(p, 'video');
                if (idle) {
                    try { await idle.sender.replaceTrack(track); idle.direction = 'sendrecv'; p.addedTracks.add(track.id); }
                    catch (e) { console.warn('replaceTrack 失败', name, e); }
                } else {
                    try { p.pc.addTrack(track, localStream); p.addedTracks.add(track.id); } catch (e) { console.warn('addTrack 失败', name, e); }
                }
                await requestNegotiation(name);
            }
            if (replacedTrack) p.addedTracks.delete(replacedTrack.id);
        }

        async function toggleScreenShare() {
            const msg = document.getElementById('mediaMsg');
            const btn = document.getElementById('btnShare');
            try {
                if (sharing) {
                    // 结束共享：恢复摄像头（若之前开着），否则置空
                    if (screenTrack) { try { screenTrack.stop(); } catch (e) {} screenTrack = null; }
                    sharing = false;
                    btn.classList.remove('on');
                    btn.textContent = '🖥️ 共享屏幕';
                    setBadge(me, '');
                    const restore = (cameraTrack && cameraTrack.readyState === 'live') ? cameraTrack : null;
                    for (const name of Object.keys(peers)) {
                        await swapVideoTrack(name, restore, screenTrack);
                    }
                    const v = tileVideo(me);
                    if (localStream) { localStream.getVideoTracks().forEach(t => localStream.removeTrack(t)); if (restore) localStream.addTrack(restore); }
                    v.srcObject = localStream && localStream.getVideoTracks().length ? localStream : null;
                    msg.innerHTML = '<span class="muted">已停止屏幕共享。</span>';
                    return;
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    msg.innerHTML = '<span class="err">当前浏览器不支持屏幕共享（请用桌面版 Chrome / Edge）。</span>';
                    return;
                }
                msg.innerHTML = '正在等待选择共享内容…';
                const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 15 }, audio: false });
                screenTrack = s.getVideoTracks()[0];
                sharing = true;
                btn.classList.add('on');
                btn.textContent = '🖥️ 停止共享';

                // 记住当前摄像头轨道，便于结束后恢复
                cameraTrack = (localStream && localStream.getVideoTracks().length) ? localStream.getVideoTracks()[0] : null;

                for (const name of Object.keys(peers)) {
                    await swapVideoTrack(name, screenTrack, cameraTrack);
                }
                // 本地预览切换到屏幕画面（同时把 localStream 里的视频轨换成屏幕轨，
                // 这样后续新加入的参与者 addTrack 时拿到的是屏幕画面）
                if (localStream) {
                    localStream.getVideoTracks().forEach(t => localStream.removeTrack(t));
                    localStream.addTrack(screenTrack);
                }
                const v = tileVideo(me);
                v.srcObject = new MediaStream([screenTrack]);
                v.play().catch(() => {});

                screenTrack.onended = () => { if (sharing) toggleScreenShare(); };
                setBadge(me, '🖥️ 共享中');
                msg.innerHTML = '<span class="ok">✅ 正在共享屏幕（对方会看到你的画面）。</span>';
            } catch (e) {
                msg.innerHTML = '<span class="muted">已取消或无法共享屏幕：' + escapeHtml(e.message) + '</span>';
            }
        }

        // ============================================================
        //  语音对讲兜底（P2P 打不通时用；走 HTTPS 中转，不需要 TURN）
        //  原理：每 1.2 秒录一段**完整**的 webm/opus 片段（每次都是独立文件，
        //  这样对端可以直接播放，不需要 MediaSource），POST 给 Worker；另一端轮询取出、
        //  按顺序排队播放。延迟约 1~2 秒，只支持语音（视频在这种网络下无法兜底）。
        // ============================================================
        let relayOn = false, relaySeq = 0, relayLastId = 0, relayRec = null;
        let relayPollTimer = null, relayClipTimer = null, relayPlaying = false;
        const relayQueue = [];
        let relaySent = 0, relayPlayed = 0;

        function setRelayStatus(text, cls) {
            const el = document.getElementById('relayStatus');
            if (el) { el.className = 'muted ' + (cls || ''); el.textContent = text || ''; }
        }

        async function toggleRelay() {
            const btn = document.getElementById('btnRelay');
            if (relayOn) {
                relayOn = false;
                if (relayRec && relayRec.state !== 'inactive') { try { relayRec.stop(); } catch (e) { /* 忽略 */ } }
                relayRec = null;
                if (relayPollTimer) { clearInterval(relayPollTimer); relayPollTimer = null; }
                if (relayClipTimer) { clearTimeout(relayClipTimer); relayClipTimer = null; }
                btn.classList.remove('on');
                btn.textContent = '📻 语音对讲';
                setRelayStatus('已停止对讲（发送 ' + relaySent + ' 段，播放 ' + relayPlayed + ' 段）');
                return;
            }
            if (!window.MediaRecorder) {
                setRelayStatus('当前浏览器不支持 MediaRecorder，无法使用对讲兜底', 'err');
                return;
