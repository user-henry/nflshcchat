<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-container {
            max-width: 400px;
            width: 100%;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        h1 { text-align: center; color: #1a1a2e; margin-bottom: 20px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #ffd700; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message { margin-top: 15px; text-align: center; font-size: 14px; }
        .hint { font-size: 12px; color: #666; margin-top: -10px; margin-bottom: 15px; }

        /* ===== 滑块验证样式 ===== */
        .slider-wrapper {
            margin: 10px 0 18px 0;
            width: 100%;
        }
        .slider-container {
            width: 100%;
            height: 44px;
            background-color: #e8e8e8;
            border-radius: 22px;
            position: relative;
            user-select: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .slider-container.verified {
            border: 2px solid #4CAF50;
            background-color: #e8f5e9;
        }
        .slider-progress {
            height: 100%;
            background: linear-gradient(90deg, #a5d6a7, #66bb6a);
            border-radius: 22px;
            width: 0%;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.05s linear;
        }
        .slider-track {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }
        .slider-thumb {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            border-radius: 50%;
            position: absolute;
            left: 2px;
            top: 2px;
            cursor: grab;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.35);
            transition: box-shadow 0.2s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            z-index: 2;
        }
        .slider-thumb:active {
            cursor: grabbing;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.5);
        }
        .slider-thumb .arrow { font-size: 14px; font-weight: bold; }
        .slider-container.verified .slider-thumb {
            background: linear-gradient(135deg, #2196F3, #1565C0);
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.4);
        }
        .slider-container.verified .slider-progress {
            background: linear-gradient(90deg, #90caf9, #42a5f5);
        }
        .slider-container.verified .slider-track .hint-text {
            color: #1565C0;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo"></div>
        <h1>📝 注册账号</h1>
        <input type="text" id="username" placeholder="用户名">
        <input type="email" id="email" placeholder="邮箱">
        <input type="password" id="password" placeholder="密码（至少6位）">
        <input type="password" id="confirm" placeholder="确认密码">
        <textarea id="bio" placeholder="个人简介（可选）"></textarea>
        <div class="hint">💡 个人简介会展示在您的个人资料页</div>

        <!-- 滑块验证 -->
        <div class="slider-wrapper">
            <div class="slider-container" id="slider">
                <div class="slider-progress" id="progress"></div>
                <div class="slider-track">
                    <span class="hint-text" id="hintText">👉 拖动滑块验证</span>
                    <div class="slider-thumb" id="thumb">
                        <span class="arrow">▶</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="registerBtn" disabled>注册</button>
        <div id="message" class="message"></div>
    </div>

    <script src="config.js"></script>
    <script>
        // ============================================================
        //  滑块验证逻辑
        // ============================================================
        (function() {
            const slider = document.getElementById('slider');
            const thumb = document.getElementById('thumb');
            const progress = document.getElementById('progress');
            const hintText = document.getElementById('hintText');
            const registerBtn = document.getElementById('registerBtn');

            let isDragging = false;
            let isVerified = false;

            const THUMB_WIDTH = 40;

            function handleStart(e) {
                if (isVerified) return;
                e.preventDefault();
                isDragging = true;
                thumb.style.cursor = 'grabbing';
                document.addEventListener('mousemove', handleMove);
                document.addEventListener('mouseup', handleEnd);
                document.addEventListener('touchmove', handleMove, { passive: false });
                document.addEventListener('touchend', handleEnd, { passive: false });
            }

            function handleMove(e) {
                if (!isDragging || isVerified) return;
                e.preventDefault();

                let clientX;
                if (e.type === 'touchmove') {
                    clientX = e.touches[0].clientX;
                } else {
                    clientX = e.clientX;
                }

                const rect = slider.getBoundingClientRect();
                const maxOffset = rect.width - THUMB_WIDTH - 4;
                let offset = clientX - rect.left - THUMB_WIDTH / 2;
                offset = Math.max(0, Math.min(offset, maxOffset));

                thumb.style.left = offset + 'px';
                progress.style.width = ((offset / maxOffset) * 100) + '%';

                if (offset >= maxOffset - 2) {
                    verifySuccess();
                }
            }

            function handleEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                thumb.style.cursor = 'grab';
                document.removeEventListener('mousemove', handleMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchmove', handleMove);
                document.removeEventListener('touchend', handleEnd);

                if (!isVerified) {
                    resetSlider();
                }
            }

            function verifySuccess() {
                if (isVerified) return;
                isVerified = true;
                slider.classList.add('verified');
                hintText.textContent = '✅ 验证通过！';
                registerBtn.disabled = false;
                registerBtn.style.opacity = '1';
                registerBtn.style.cursor = 'pointer';
                const rect = slider.getBoundingClientRect();
                const maxOffset = rect.width - THUMB_WIDTH - 4;
                thumb.style.left = maxOffset + 'px';
                progress.style.width = '100%';
            }

            function resetSlider() {
                if (isVerified) {
                    isVerified = false;
                    slider.classList.remove('verified');
                    hintText.textContent = '👉 拖动滑块验证';
                    registerBtn.disabled = true;
                }
                thumb.style.left = '2px';
                progress.style.width = '0%';
                thumb.style.cursor = 'grab';
                document.removeEventListener('mousemove', handleMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchmove', handleMove);
                document.removeEventListener('touchend', handleEnd);
            }

            window.resetSlider = resetSlider;

            thumb.addEventListener('mousedown', handleStart);
            thumb.addEventListener('touchstart', handleStart, { passive: false });

            window.addEventListener('resize', function() {
                if (isVerified) {
                    const rect = slider.getBoundingClientRect();
                    const maxOffset = rect.width - THUMB_WIDTH - 4;
                    thumb.style.left = maxOffset + 'px';
                    progress.style.width = '100%';
                }
            });

            registerBtn.disabled = true;
        })();

        // ============================================================
        //  原有代码（完全保持不变）
        // ============================================================

        // 网站 Logo URL
        const SITE_LOGO = 'https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png';

        // SHA-256 密码哈希函数
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function register() {
            // 检查滑块是否已验证
            const slider = document.getElementById('slider');
            if (!slider.classList.contains('verified')) {
                document.getElementById('message').innerHTML = '<span style="color: red;">⚠️ 请先完成人机验证</span>';
                return;
            }

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const bio = document.getElementById('bio').value.trim() || '这个人很懒，什么都没有写。';
            const msg = document.getElementById('message');

            if (!username || !email || !password) {
                msg.innerHTML = '<span style="color: red;">请填写所有字段</span>';
                return;
            }
            if (password !== confirm) {
                msg.innerHTML = '<span style="color: red;">两次密码不一致</span>';
                return;
            }
            if (password.length < 6) {
                msg.innerHTML = '<span style="color: red;">密码至少6位</span>';
                return;
            }
            try {
                const checkUrl = `https://api.github.com/repos/${window.CONFIG.GITHUB_USERNAME}/${window.CONFIG.GITHUB_REPO}/issues?labels=user&state=open`;
                const checkRes = await fetch(checkUrl, {
                    headers: { 'Authorization': `token ${window.CONFIG.GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                const issues = await checkRes.json();
                for (const issue of issues) {
                    const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) {
                        const user = JSON.parse(match[1]);
                        if (user.username === username) {
                            msg.innerHTML = '<span style="color: red;">用户名已存在</span>';
                            return;
                        }
                    }
                }

                const hashedPassword = await hashPassword(password);
                const userData = {
                    username, email, password: hashedPassword, bio,
                    passwordHashed: true,
                    createdAt: new Date().toISOString(),
                    isBanned: false,
                    avatar: SITE_LOGO
                };
                const issueBody = `用户信息\n\`\`\`json\n${JSON.stringify(userData, null, 2)}\n\`\`\``;
                const createUrl = `https://api.github.com/repos/${window.CONFIG.GITHUB_USERNAME}/${window.CONFIG.GITHUB_REPO}/issues`;
                const res = await fetch(createUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${window.CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: `User: ${username}`, body: issueBody, labels: ['user'] })
                });
                if (res.ok) {
                    msg.innerHTML = '<span style="color: green;">注册成功！正在跳转...</span>';
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    const err = await res.json();
                    msg.innerHTML = `<span style="color: red;">注册失败: ${err.message}</span>`;
                }
            } catch (error) {
                msg.innerHTML = `<span style="color: red;">注册失败: ${error.message}</span>`;
            }
        }

        // 修改注册按钮的点击事件
        document.getElementById('registerBtn').addEventListener('click', register);
    </script>
</body>
</html>
