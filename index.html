<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 登录</title>
    <!-- PWA 支持 -->
    <link rel="manifest" href="/nflshcchat/manifest.json">
    <meta name="theme-color" content="#ffd700">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        h1 { color: #1a1a2e; margin-bottom: 10px; }
        h2 { color: #666; font-size: 18px; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #ffd700; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        p { margin-top: 20px; color: #666; }
        a { color: #ffd700; text-decoration: none; font-weight: bold; cursor: pointer; }
        a:hover { text-decoration: underline; }
        .message { margin-top: 15px; font-size: 14px; min-height: 40px; }

        /* ===== 滑块验证样式 ===== */
        .slider-wrapper {
            margin: 10px 0 18px 0;
            width: 100%;
        }
        .slider-container {
            width: 100%;
            height: 44px;
            background-color: #e8e8e8;
            border-radius: 22px;
            position: relative;
            user-select: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .slider-container.verified {
            border: 2px solid #4CAF50;
            background-color: #e8f5e9;
        }
        .slider-progress {
            height: 100%;
            background: linear-gradient(90deg, #a5d6a7, #66bb6a);
            border-radius: 22px;
            width: 0%;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.05s linear;
        }
        .slider-track {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }
        .slider-thumb {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            border-radius: 50%;
            position: absolute;
            left: 2px;
            top: 2px;
            cursor: grab;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.35);
            transition: box-shadow 0.2s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            z-index: 2;
        }
        .slider-thumb:active {
            cursor: grabbing;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.5);
        }
        .slider-thumb .arrow { font-size: 14px; font-weight: bold; }
        .slider-container.verified .slider-thumb {
            background: linear-gradient(135deg, #2196F3, #1565C0);
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.4);
        }
        .slider-container.verified .slider-progress {
            background: linear-gradient(90deg, #90caf9, #42a5f5);
        }
        .slider-container.verified .slider-track .hint-text {
            color: #1565C0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: #16213e;
            padding: 30px;
            border-radius: 16px;
            width: 400px;
            border: 1px solid #ffd700;
        }
        .modal-content h3 { color: #ffd700; margin-bottom: 20px; }
        .modal-content input {
            background: #1a1a2e;
            color: white;
            border: 1px solid #2a2a3e;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-buttons button { width: auto; padding: 8px 20px; }
        .modal-buttons button:first-child { background: #2a2a3e; color: white; }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo"></div>
        <h1>💬 NFLSHC Chat</h1>
        <h2>用户登录</h2>
        <input type="text" id="username" placeholder="用户名" autocomplete="off">
        <input type="password" id="password" placeholder="密码">

        <!-- 滑块验证 -->
        <div class="slider-wrapper">
            <div class="slider-container" id="slider">
                <div class="slider-progress" id="progress"></div>
                <div class="slider-track">
                    <span class="hint-text" id="hintText">👉 拖动滑块验证</span>
                    <div class="slider-thumb" id="thumb">
                        <span class="arrow">▶</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="loginBtn" disabled>登录</button>
        <p><a onclick="showForgotPassword()">忘记密码？</a> | <a onclick="showRegister()">立即注册</a></p>
        <div id="message" class="message"></div>
    </div>

    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <h3>🔐 找回密码</h3>
            <input type="text" id="forgotUsername" placeholder="用户名">
            <input type="email" id="forgotEmail" placeholder="注册邮箱">
            <div class="modal-buttons">
                <button onclick="closeForgotModal()">取消</button>
                <button onclick="sendPasswordReset()" style="background: #ffd700;">发送重置邮件</button>
            </div>
            <div id="forgotMessage" style="margin-top: 15px; font-size: 12px; color: #aaa;"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // ============================================================
        //  滑块验证逻辑
        // ============================================================
        (function() {
            const slider = document.getElementById('slider');
            const thumb = document.getElementById('thumb');
            const progress = document.getElementById('progress');
            const hintText = document.getElementById('hintText');
            const loginBtn = document.getElementById('loginBtn');

            let isDragging = false;
            let isVerified = false;

            const SLIDER_WIDTH = slider.offsetWidth || 400;
            const THUMB_WIDTH = 40;
            const MAX_OFFSET = SLIDER_WIDTH - THUMB_WIDTH - 4;

            // 更新最大偏移量（窗口变化时重新计算）
            function updateMaxOffset() {
                const rect = slider.getBoundingClientRect();
                return rect.width - THUMB_WIDTH - 4;
            }

            function handleStart(e) {
                if (isVerified) return;
                e.preventDefault();
                isDragging = true;
                thumb.style.cursor = 'grabbing';
                document.addEventListener('mousemove', handleMove);
                document.addEventListener('mouseup', handleEnd);
                document.addEventListener('touchmove', handleMove, { passive: false });
                document.addEventListener('touchend', handleEnd, { passive: false });
            }

            function handleMove(e) {
                if (!isDragging || isVerified) return;
                e.preventDefault();

                let clientX;
                if (e.type === 'touchmove') {
                    clientX = e.touches[0].clientX;
                } else {
                    clientX = e.clientX;
                }

                const rect = slider.getBoundingClientRect();
                const maxOffset = rect.width - THUMB_WIDTH - 4;
                let offset = clientX - rect.left - THUMB_WIDTH / 2;
                offset = Math.max(0, Math.min(offset, maxOffset));

                thumb.style.left = offset + 'px';
                progress.style.width = ((offset / maxOffset) * 100) + '%';

                if (offset >= maxOffset - 2) {
                    verifySuccess();
                }
            }

            function handleEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                thumb.style.cursor = 'grab';
                document.removeEventListener('mousemove', handleMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchmove', handleMove);
                document.removeEventListener('touchend', handleEnd);

                if (!isVerified) {
                    resetSlider();
                }
            }

            function verifySuccess() {
                if (isVerified) return;
                isVerified = true;
                slider.classList.add('verified');
                hintText.textContent = '✅ 验证通过！';
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
                loginBtn.style.cursor = 'pointer';
                // 固定在终点
                const rect = slider.getBoundingClientRect();
                const maxOffset = rect.width - THUMB_WIDTH - 4;
                thumb.style.left = maxOffset + 'px';
                progress.style.width = '100%';
            }

            function resetSlider() {
                if (isVerified) {
                    isVerified = false;
                    slider.classList.remove('verified');
                    hintText.textContent = '👉 拖动滑块验证';
                    loginBtn.disabled = true;
                }
                thumb.style.left = '2px';
                progress.style.width = '0%';
                thumb.style.cursor = 'grab';
                // 移除残留事件
                document.removeEventListener('mousemove', handleMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchmove', handleMove);
                document.removeEventListener('touchend', handleEnd);
            }

            // 暴露重置方法供外部调用
            window.resetSlider = resetSlider;

            thumb.addEventListener('mousedown', handleStart);
            thumb.addEventListener('touchstart', handleStart, { passive: false });

            // 窗口大小变化时重新计算位置（防止变形）
            window.addEventListener('resize', function() {
                if (isVerified) {
                    const rect = slider.getBoundingClientRect();
                    const maxOffset = rect.width - THUMB_WIDTH - 4;
                    thumb.style.left = maxOffset + 'px';
                    progress.style.width = '100%';
                }
            });

            // 监听登录按钮状态变化
            loginBtn.disabled = true;
        })();

        // ============================================================
        //  原有代码（完全保持不变）
        // ============================================================

        // EmailJS 配置
        const EMAILJS_PUBLIC_KEY = 'A-3y5AHO_oj3PQU5l';
        const EMAILJS_SERVICE_ID = 'service_6iugtla';
        const EMAILJS_TEMPLATE_ID = 'template_03vba8b';

        let emailJSInitialized = false;

        // 初始化 EmailJS
        function initEmailJS() {
            if (typeof emailjs !== 'undefined' && !emailJSInitialized) {
                emailjs.init(EMAILJS_PUBLIC_KEY);
                emailJSInitialized = true;
                console.log('EmailJS 初始化成功');
            }
        }

        window.addEventListener('load', initEmailJS);

        // ========== 统一的存储 Key ==========
        const STORAGE_KEY = 'nflshc_currentUser';

        // ========== 检查登录状态并自动跳转 ==========
        function checkAndAutoRedirect() {
            let userStr = localStorage.getItem(STORAGE_KEY);
            if (!userStr) {
                userStr = sessionStorage.getItem('currentUser');
                if (userStr) {
                    localStorage.setItem(STORAGE_KEY, userStr);
                }
            }
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user && user.username) {
                        sessionStorage.setItem('currentUser', userStr);
                        if (user.isAdmin || user.username === 'huangzhiyuan') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'chat.html';
                        }
                        return true;
                    }
                } catch(e) {
                    console.error('解析用户数据失败', e);
                }
            }
            return false;
        }

        // ========== 保存登录状态 ==========
        function saveLoginState(user) {
            const userStr = JSON.stringify(user);
            localStorage.setItem(STORAGE_KEY, userStr);
            sessionStorage.setItem('currentUser', userStr);
        }

        // ========== 清除登录状态（供其他页面调用） ==========
        window.clearLoginState = function() {
            localStorage.removeItem(STORAGE_KEY);
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('nflshc_user');
            console.log('登录状态已清除');
        };

        // 忘记密码
        function showForgotPassword() {
            document.getElementById('forgotModal').style.display = 'flex';
            document.getElementById('forgotUsername').value = '';
            document.getElementById('forgotEmail').value = '';
            document.getElementById('forgotMessage').innerHTML = '';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
        }

        async function sendPasswordReset() {
            const username = document.getElementById('forgotUsername').value.trim();
            const email = document.getElementById('forgotEmail').value.trim();
            const msgDiv = document.getElementById('forgotMessage');

            if (!username || !email) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">请填写用户名和邮箱</span>';
                return;
            }

            msgDiv.innerHTML = '<span style="color: #ffd700;">⏳ 验证中...</span>';

            try {
                const url = `https://api.github.com/repos/${window.CONFIG.GITHUB_USERNAME}/${window.CONFIG.GITHUB_REPO}/issues?labels=user&state=open`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${window.CONFIG.GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                const issues = await response.json();
                let foundUser = null;
                for (const issue of issues) {
                    const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) {
                        const userData = JSON.parse(match[1]);
                        if (userData.username === username && userData.email === email) {
                            foundUser = userData;
                            break;
                        }
                    }
                }

                if (!foundUser) {
                    msgDiv.innerHTML = '<span style="color: #dc3545;">用户名或邮箱不匹配</span>';
                    return;
                }

                if (!emailJSInitialized) {
                    msgDiv.innerHTML = '<span style="color: #dc3545;">邮件服务初始化中，请稍后再试</span>';
                    initEmailJS();
                    setTimeout(() => sendPasswordReset(), 1000);
                    return;
                }

                msgDiv.innerHTML = '<span style="color: #ffd700;">⏳ 发送邮件中...</span>';

                const templateParams = {
                    username: username,
                    password: foundUser.password,
                    email: email
                };

                const mailResponse = await emailjs.send(
                    EMAILJS_SERVICE_ID,
                    EMAILJS_TEMPLATE_ID,
                    templateParams
                );

                if (mailResponse.status === 200) {
                    msgDiv.innerHTML = '<span style="color: #28a745;">✅ 密码已发送到您的邮箱，请查收</span>';
                    setTimeout(() => closeForgotModal(), 2000);
                } else {
                    msgDiv.innerHTML = '<span style="color: #dc3545;">邮件发送失败，请稍后重试</span>';
                }
            } catch (error) {
                console.error('发送失败:', error);
                msgDiv.innerHTML = `<span style="color: #dc3545;">发送失败: ${error.message || '请稍后重试'}</span>`;
            }
        }

        // 登录功能（添加了滑块验证检查）
        async function login() {
            // 检查滑块是否已验证
            const slider = document.getElementById('slider');
            if (!slider.classList.contains('verified')) {
                document.getElementById('message').innerHTML = '<span style="color: red;">⚠️ 请先完成人机验证</span>';
                return;
            }

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            if (!username || !password) {
                messageDiv.innerHTML = '<span style="color: red;">请填写用户名和密码</span>';
                return;
            }

            // 系统管理员特判
            if (username === 'huangzhiyuan' && password === '15240254891') {
                const userData = { username: username, isAdmin: true };
                saveLoginState(userData);
                messageDiv.innerHTML = '<span style="color: green;">管理员登录成功，正在跳转...</span>';
                setTimeout(() => window.location.href = 'admin.html', 1000);
                return;
            }

            try {
                const url = `https://api.github.com/repos/${window.CONFIG.GITHUB_USERNAME}/${window.CONFIG.GITHUB_REPO}/issues?labels=user&state=open`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${window.CONFIG.GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                const issues = await response.json();
                let foundUser = null;
                for (const issue of issues) {
                    const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) {
                        const userData = JSON.parse(match[1]);
                        if (userData.username === username && userData.password === password) {
                            foundUser = userData;
                            break;
                        }
                    }
                }

                if (foundUser) {
                    if (foundUser.isBanned) {
                        messageDiv.innerHTML = '<span style="color: red;">账号已被封禁，请联系管理员</span>';
                        return;
                    }
                    const userData = { username: username, isAdmin: false };
                    saveLoginState(userData);
                    messageDiv.innerHTML = '<span style="color: green;">登录成功，正在跳转...</span>';
                    setTimeout(() => window.location.href = 'chat.html', 1000);
                } else {
                    messageDiv.innerHTML = '<span style="color: red;">用户名或密码错误</span>';
                    // 登录失败时重置滑块
                    if (window.resetSlider) window.resetSlider();
                }
            } catch (error) {
                messageDiv.innerHTML = `<span style="color: red;">登录失败: ${error.message}</span>`;
                if (window.resetSlider) window.resetSlider();
            }
        }

        function showRegister() {
            window.location.href = 'register.html';
        }

        // 修改登录按钮的点击事件
        document.getElementById('loginBtn').addEventListener('click', login);

        // 监听回车键
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        // ========== 页面启动时检查自动登录 ==========
        (function() {
            setTimeout(() => {
                checkAndAutoRedirect();
            }, 10);
        })();
    </script>
    <!-- PWA Service Worker 注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/nflshcchat/sw.js')
                    .then(function(registration) {
                        console.log('[PWA] Service Worker 注册成功');
                    })
                    .catch(function(error) {
                        console.log('[PWA] Service Worker 注册失败:', error);
                    });
            });
        }
    </script>
</body>
</html>
