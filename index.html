<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFLSHC Chat - 登录</title>
    <!-- PWA 支持 -->
    <link rel="manifest" href="/nflshcchat/manifest.json">
    <meta name="theme-color" content="#ffd700">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background-image: url('https://cdn.luogu.com.cn/upload/image_hosting/5rdb3c08.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        h1 { color: #1a1a2e; margin-bottom: 10px; }
        h2 { color: #666; font-size: 18px; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #ffd700; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        p { margin-top: 20px; color: #666; }
        a { color: #ffd700; text-decoration: none; font-weight: bold; cursor: pointer; }
        a:hover { text-decoration: underline; }
        .message { margin-top: 15px; font-size: 14px; min-height: 40px; }

        /* ===== 滑块验证样式 ===== */
        .slider-wrapper {
            margin: 10px 0 18px 0;
            width: 100%;
        }
        .slider-container {
            width: 100%;
            height: 44px;
            background-color: #e8e8e8;
            border-radius: 22px;
            position: relative;
            user-select: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .slider-container.verified {
            border: 2px solid #4CAF50;
            background-color: #e8f5e9;
        }
        .slider-progress {
            height: 100%;
            background: linear-gradient(90deg, #a5d6a7, #66bb6a);
            border-radius: 22px;
            width: 0%;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.05s linear;
        }
        .slider-track {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }
        .slider-thumb {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            border-radius: 50%;
            position: absolute;
            left: 2px;
            top: 2px;
            cursor: grab;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.35);
            transition: box-shadow 0.2s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            z-index: 2;
        }
        .slider-thumb:active {
            cursor: grabbing;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.5);
        }
        .slider-thumb .arrow { font-size: 14px; font-weight: bold; }
        .slider-container.verified .slider-thumb {
            background: linear-gradient(135deg, #2196F3, #1565C0);
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.4);
        }
        .slider-container.verified .slider-progress {
            background: linear-gradient(90deg, #90caf9, #42a5f5);
        }
        .slider-container.verified .slider-track .hint-text {
            color: #1565C0;
        }

        /* ===== 模态框样式 ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #16213e;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #ffd700;
            color: #fff;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { color: #ffd700; margin-bottom: 20px; text-align: center; }
        .modal-content input {
            background: #1a1a2e;
            color: white;
            border: 1px solid #2a2a3e;
            margin-bottom: 12px;
        }
        .modal-content input:focus { border-color: #ffd700; }
        .modal-content .hint-text { 
            font-size: 12px; 
            color: #888; 
            margin-bottom: 15px; 
            text-align: center;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-buttons button { width: auto; padding: 8px 20px; }
        .modal-buttons button:first-child { background: #2a2a3e; color: white; }
        .modal-buttons button:first-child:hover { background: #3a3a4e; }
        .modal-message { margin-top: 15px; font-size: 13px; text-align: center; min-height: 30px; }
        .resend-timer { color: #ffd700; font-weight: bold; }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .step-indicator .step {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            background: #2a2a3e;
            color: #888;
        }
        .step-indicator .step.active {
            background: #ffd700;
            color: #1a1a2e;
        }
        .step-indicator .step.done {
            background: #28a745;
            color: white;
        }
        .code-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .code-input-group input {
            flex: 1;
            margin-bottom: 0;
        }
        .code-input-group button {
            width: auto;
            padding: 12px 16px;
            white-space: nowrap;
            font-size: 13px;
        }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo"></div>
        <h1>💬 NFLSHC Chat</h1>
        <h2>用户登录</h2>
        <input type="text" id="username" placeholder="用户名" autocomplete="off">
        <input type="password" id="password" placeholder="密码">

        <!-- 滑块验证 -->
        <div class="slider-wrapper">
            <div class="slider-container" id="slider">
                <div class="slider-progress" id="progress"></div>
                <div class="slider-track">
                    <span class="hint-text" id="hintText">👉 拖动滑块验证</span>
                    <div class="slider-thumb" id="thumb">
                        <span class="arrow">▶</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="loginBtn" disabled>登录</button>
        <p><a onclick="showForgotPassword()">忘记密码？</a> | <a onclick="showRegister()">立即注册</a> | <a href="theme.html">主题切换</a></p>
        <div id="message" class="message"></div>
    </div>

    <!-- ===== 密码找回模态框（两步流程） ===== -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <h3>🔐 找回密码</h3>
            
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <span class="step active" id="step1Label">① 验证身份</span>
                <span class="step" id="step2Label">② 验证码</span>
                <span class="step" id="step3Label">③ 重置密码</span>
            </div>

            <!-- ===== 步骤1: 验证身份 ===== -->
            <div id="step1">
                <input type="text" id="forgotUsername" placeholder="用户名">
                <input type="email" id="forgotEmail" placeholder="注册邮箱">
                <div class="hint-text">💡 输入用户名和注册邮箱，验证码将发送到您的邮箱</div>
                <button onclick="sendVerifyCode()" id="sendCodeBtn" style="background: #ffd700; color: #1a1a2e;">📧 发送验证码</button>
                <div id="step1Message" class="modal-message"></div>
            </div>

            <!-- ===== 步骤2: 输入验证码 ===== -->
            <div id="step2" style="display:none;">
                <p style="color: #aaa; font-size: 14px; margin-bottom: 12px;">
                    验证码已发送到 <strong id="emailDisplay" style="color: #ffd700;"></strong>
                </p>
                <div class="code-input-group">
                    <input type="text" id="verifyCodeInput" placeholder="输入6位验证码" maxlength="6" autocomplete="off">
                    <button onclick="sendVerifyCode()" id="resendCodeBtn" style="background: #2a2a3e; color: white; font-size: 12px; padding: 12px 12px;" disabled>
                        重新发送 (<span id="resendTimer">120</span>s)
                    </button>
                </div>
                <button onclick="verifyCode()" id="verifyCodeBtn" style="background: #ffd700; color: #1a1a2e; margin-top: 12px;">✅ 验证并继续</button>
                <div id="step2Message" class="modal-message"></div>
            </div>

            <!-- ===== 步骤3: 重置密码 ===== -->
            <div id="step3" style="display:none;">
                <p style="color: #aaa; font-size: 14px; margin-bottom: 12px;">
                    正在为 <strong id="resetUsernameDisplay" style="color: #ffd700;"></strong> 重置密码
                </p>
                <input type="password" id="newPassword" placeholder="新密码（至少6位）">
                <input type="password" id="confirmPassword" placeholder="确认新密码">
                <button onclick="resetPassword()" id="resetPasswordBtn" style="background: #ffd700; color: #1a1a2e;">🔓 确认重置</button>
                <div id="step3Message" class="modal-message"></div>
            </div>

            <div class="modal-buttons">
                <button onclick="closeForgotModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/theme.js"></script>
    <script>
        // ============================================================
        //  配置
        // ============================================================
        const EMAILJS_PUBLIC_KEY = 'A-3y5AHO_oj3PQU5l';
        const EMAILJS_SERVICE_ID = 'service_6iugtla';
        const EMAILJS_VERIFY_TEMPLATE_ID = 'template_03vba8b';

        let emailJSInitialized = false;
        let currentResetUser = null; // 当前正在重置的用户
        let resendTimer = null;
        let resendCountdown = 120; // 2分钟
        let currentStep = 1;

        // ============================================================
        //  滑块验证逻辑
        // ============================================================
        (function() {
            const slider = document.getElementById('slider');
            const thumb = document.getElementById('thumb');
            const progress = document.getElementById('progress');
            const hintText = document.getElementById('hintText');
            const loginBtn = document.getElementById('loginBtn');

            let isDragging = false;
            let isVerified = false;
            const THUMB_WIDTH = 40;

            function handleStart(e) {
                if (isVerified) return;
                e.preventDefault();
                isDragging = true;
                thumb.style.cursor = 'grabbing';
                document.addEventListener('mousemove', handleMove);
                document.addEventListener('mouseup', handleEnd);
                document.addEventListener('touchmove', handleMove, { passive: false });
                document.addEventListener('touchend', handleEnd, { passive: false });
            }

            function handleMove(e) {
                if (!isDragging || isVerified) return;
                e.preventDefault();
                let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                const rect = slider.getBoundingClientRect();
                const maxOffset = rect.width - THUMB_WIDTH - 4;
                let offset = Math.max(0, Math.min(clientX - rect.left - THUMB_WIDTH / 2, maxOffset));
                thumb.style.left = offset + 'px';
                progress.style.width = ((offset / maxOffset) * 100) + '%';
                if (offset >= maxOffset - 2) verifySuccess();
            }

            function handleEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                thumb.style.cursor = 'grab';
                document.removeEventListener('mousemove', handleMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchmove', handleMove);
                document.removeEventListener('touchend', handleEnd);
                if (!isVerified) resetSlider();
            }

            function verifySuccess() {
                if (isVerified) return;
                isVerified = true;
                slider.classList.add('verified');
                hintText.textContent = '✅ 验证通过！';
                loginBtn.disabled = false;
                const rect = slider.getBoundingClientRect();
                const maxOffset = rect.width - THUMB_WIDTH - 4;
                thumb.style.left = maxOffset + 'px';
                progress.style.width = '100%';
            }

            function resetSlider() {
                if (isVerified) {
                    isVerified = false;
                    slider.classList.remove('verified');
                    hintText.textContent = '👉 拖动滑块验证';
                    loginBtn.disabled = true;
                }
                thumb.style.left = '2px';
                progress.style.width = '0%';
                thumb.style.cursor = 'grab';
                document.removeEventListener('mousemove', handleMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchmove', handleMove);
                document.removeEventListener('touchend', handleEnd);
            }

            window.resetSlider = resetSlider;

            thumb.addEventListener('mousedown', handleStart);
            thumb.addEventListener('touchstart', handleStart, { passive: false });

            window.addEventListener('resize', function() {
                if (isVerified) {
                    const rect = slider.getBoundingClientRect();
                    const maxOffset = rect.width - THUMB_WIDTH - 4;
                    thumb.style.left = maxOffset + 'px';
                    progress.style.width = '100%';
                }
            });

            loginBtn.disabled = true;
        })();

        // ============================================================
        //  SHA-256 哈希工具
        // ============================================================
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ============================================================
        //  统一存储 Key
        // ============================================================
        const STORAGE_KEY = 'nflshc_currentUser';

        // ============================================================
        //  检查登录状态并自动跳转
        // ============================================================
        function checkAndAutoRedirect() {
            let userStr = localStorage.getItem(STORAGE_KEY);
            if (!userStr) {
                userStr = sessionStorage.getItem('currentUser');
                if (userStr) localStorage.setItem(STORAGE_KEY, userStr);
            }
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user && user.username) {
                        sessionStorage.setItem('currentUser', userStr);
                        if (user.isAdmin || user.username === 'huangzhiyuan') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'chat.html';
                        }
                        return true;
                    }
                } catch(e) {}
            }
            return false;
        }

        function saveLoginState(user) {
            const userStr = JSON.stringify(user);
            localStorage.setItem(STORAGE_KEY, userStr);
            sessionStorage.setItem('currentUser', userStr);
        }

        window.clearLoginState = function() {
            localStorage.removeItem(STORAGE_KEY);
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('nflshc_user');
        };

        // ============================================================
        //  EmailJS 初始化
        // ============================================================
        function initEmailJS() {
            if (typeof emailjs !== 'undefined' && !emailJSInitialized) {
                emailjs.init(EMAILJS_PUBLIC_KEY);
                emailJSInitialized = true;
                console.log('EmailJS 初始化成功');
            }
        }
        window.addEventListener('load', initEmailJS);

        // ============================================================
        //  登录功能
        // ============================================================
        async function login() {
            const slider = document.getElementById('slider');
            if (!slider.classList.contains('verified')) {
                document.getElementById('message').innerHTML = '<span style="color: red;">⚠️ 请先完成人机验证</span>';
                return;
            }

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            if (!username || !password) {
                messageDiv.innerHTML = '<span style="color: red;">请填写用户名和密码</span>';
                return;
            }

            if (username === 'huangzhiyuan' && password === '15240254891') {
                saveLoginState({ username: username, isAdmin: true });
                messageDiv.innerHTML = '<span style="color: green;">管理员登录成功，正在跳转...</span>';
                setTimeout(() => window.location.href = 'admin.html', 1000);
                return;
            }

            try {
                const url = `https://api.github.com/repos/${window.CONFIG.GITHUB_USERNAME}/${window.CONFIG.GITHUB_REPO}/issues?labels=user&state=open`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${window.CONFIG.GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                const issues = await response.json();
                let foundUser = null;
                for (const issue of issues) {
                    const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) {
                        const userData = JSON.parse(match[1]);
                        // 支持新旧两种密码格式
                        let isMatch = false;
                        if (userData.passwordHashed) {
                            isMatch = await hashPassword(password) === userData.password;
                        } else {
                            isMatch = userData.password === password;
                        }
                        if (userData.username === username && isMatch) {
                            foundUser = userData;
                            break;
                        }
                    }
                }

                if (foundUser) {
                    if (foundUser.isBanned) {
                        messageDiv.innerHTML = '<span style="color: red;">账号已被封禁，请联系管理员</span>';
                        return;
                    }
                    saveLoginState({ username: username, isAdmin: false });
                    messageDiv.innerHTML = '<span style="color: green;">登录成功，正在跳转...</span>';
                    setTimeout(() => window.location.href = 'chat.html', 1000);
                } else {
                    messageDiv.innerHTML = '<span style="color: red;">用户名或密码错误</span>';
                    if (window.resetSlider) window.resetSlider();
                }
            } catch (error) {
                messageDiv.innerHTML = `<span style="color: red;">登录失败: ${error.message}</span>`;
                if (window.resetSlider) window.resetSlider();
            }
        }

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        function showRegister() {
            window.location.href = 'register.html';
        }

        // ============================================================
        //  密码找回（两步流程）
        // ============================================================
        function showForgotPassword() {
            document.getElementById('forgotModal').classList.add('active');
            // 重置到步骤1
            goToStep(1);
            document.getElementById('forgotUsername').value = '';
            document.getElementById('forgotEmail').value = '';
            document.getElementById('verifyCodeInput').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('step1Message').innerHTML = '';
            document.getElementById('step2Message').innerHTML = '';
            document.getElementById('step3Message').innerHTML = '';
            currentResetUser = null;
            if (resendTimer) {
                clearInterval(resendTimer);
                resendTimer = null;
            }
            document.getElementById('resendCodeBtn').disabled = true;
            document.getElementById('resendCodeBtn').textContent = '重新发送 (120s)';
            resendCountdown = 120;
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('active');
            if (resendTimer) {
                clearInterval(resendTimer);
                resendTimer = null;
            }
        }

        function goToStep(step) {
            currentStep = step;
            document.getElementById('step1').style.display = step === 1 ? 'block' : 'none';
            document.getElementById('step2').style.display = step === 2 ? 'block' : 'none';
            document.getElementById('step3').style.display = step === 3 ? 'block' : 'none';
            
            document.getElementById('step1Label').className = 'step' + (step === 1 ? ' active' : step > 1 ? ' done' : '');
            document.getElementById('step2Label').className = 'step' + (step === 2 ? ' active' : step > 2 ? ' done' : '');
            document.getElementById('step3Label').className = 'step' + (step === 3 ? ' active' : '');
        }

        // ===== 步骤1: 发送验证码 =====
        async function sendVerifyCode() {
            const username = document.getElementById('forgotUsername').value.trim();
            const email = document.getElementById('forgotEmail').value.trim();
            const msgDiv = document.getElementById('step1Message');

            if (!username || !email) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">请填写用户名和邮箱</span>';
                return;
            }

            // 检查是否在冷却期
            if (resendCountdown < 120 && resendCountdown > 0) {
                msgDiv.innerHTML = `<span style="color: #ffd700;">⏳ 请等待 <span class="resend-timer">${resendCountdown}</span> 秒后重试</span>`;
                return;
            }

            msgDiv.innerHTML = '<span style="color: #ffd700;">⏳ 验证中...</span>';

            try {
                const url = `https://api.github.com/repos/${window.CONFIG.GITHUB_USERNAME}/${window.CONFIG.GITHUB_REPO}/issues?labels=user&state=open`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${window.CONFIG.GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                const issues = await response.json();
                let foundUser = null;
                let issueNumber = null;
                for (const issue of issues) {
                    const match = issue.body.match(/```json\n([\s\S]*?)\n```/);
                    if (match) {
                        const userData = JSON.parse(match[1]);
                        if (userData.username === username && userData.email === email) {
                            foundUser = userData;
                            issueNumber = issue.number;
                            break;
                        }
                    }
                }

                if (!foundUser) {
                    msgDiv.innerHTML = '<span style="color: #dc3545;">用户名或邮箱不匹配</span>';
                    return;
                }

                if (!emailJSInitialized) {
                    msgDiv.innerHTML = '<span style="color: #dc3545;">邮件服务初始化中，请稍后再试</span>';
                    initEmailJS();
                    setTimeout(() => sendVerifyCode(), 1000);
                    return;
                }

                // 生成6位数字验证码
                const verifyCode = Math.floor(100000 + Math.random() * 900000).toString();
                const codeExpiry = Date.now() + 5 * 60 * 1000; // 5分钟

                // 保存验证码到用户数据
                foundUser.resetCode = verifyCode;
                foundUser.resetCodeExpiry = codeExpiry;
                const updatedBody = `用户信息\n\`\`\`json\n${JSON.stringify(foundUser, null, 2)}\n\`\`\``;
                await fetch(`https://api.github.com/repos/${window.CONFIG.GITHUB_USERNAME}/${window.CONFIG.GITHUB_REPO}/issues/${issueNumber}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${window.CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ body: updatedBody })
                });

                // 发送验证码邮件
                const templateParams = {
                    username: username,
                    verify_code: verifyCode,
                    email: email
                };

                const mailResponse = await emailjs.send(
                    EMAILJS_SERVICE_ID,
                    EMAILJS_VERIFY_TEMPLATE_ID,
                    templateParams
                );

                if (mailResponse.status === 200) {
                    currentResetUser = { ...foundUser, issueNumber };
                    document.getElementById('emailDisplay').textContent = email;
                    msgDiv.innerHTML = '<span style="color: #28a745;">✅ 验证码已发送到您的邮箱</span>';
                    
                    // 进入步骤2
                    goToStep(2);
                    document.getElementById('verifyCodeInput').value = '';
                    document.getElementById('verifyCodeInput').focus();
                    document.getElementById('step2Message').innerHTML = '';
                    
                    // 开始重发倒计时（2分钟）
                    startResendTimer();
                } else {
                    msgDiv.innerHTML = '<span style="color: #dc3545;">邮件发送失败，请稍后重试</span>';
                }
            } catch (error) {
                console.error('发送失败:', error);
                msgDiv.innerHTML = `<span style="color: #dc3545;">发送失败: ${error.message}</span>`;
            }
        }

        // ===== 重发倒计时 =====
        function startResendTimer() {
            resendCountdown = 120;
            const btn = document.getElementById('resendCodeBtn');
            btn.disabled = true;
            btn.textContent = `重新发送 (${resendCountdown}s)`;
            
            if (resendTimer) clearInterval(resendTimer);
            resendTimer = setInterval(() => {
                resendCountdown--;
                if (resendCountdown <= 0) {
                    clearInterval(resendTimer);
                    resendTimer = null;
                    btn.disabled = false;
                    btn.textContent = '🔄 重新发送';
                } else {
                    btn.textContent = `重新发送 (${resendCountdown}s)`;
                }
            }, 1000);
        }

        // ===== 步骤2: 验证验证码 =====
        async function verifyCode() {
            const code = document.getElementById('verifyCodeInput').value.trim();
            const msgDiv = document.getElementById('step2Message');

            if (!code || code.length !== 6) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">请输入6位数字验证码</span>';
                return;
            }

            if (!currentResetUser) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">会话已过期，请重新开始</span>';
                return;
            }

            // 检查验证码是否过期
            if (Date.now() > currentResetUser.resetCodeExpiry) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">验证码已过期（5分钟有效），请重新发送</span>';
                return;
            }

            if (code !== currentResetUser.resetCode) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">验证码错误，请重新输入</span>';
                return;
            }

            // 验证通过，进入步骤3
            msgDiv.innerHTML = '<span style="color: #28a745;">✅ 验证通过！请设置新密码</span>';
            document.getElementById('resetUsernameDisplay').textContent = currentResetUser.username;
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('step3Message').innerHTML = '';
            goToStep(3);
        }

        // ===== 步骤3: 重置密码 =====
        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgDiv = document.getElementById('step3Message');

            if (!newPassword || !confirmPassword) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">请填写所有字段</span>';
                return;
            }

            if (newPassword !== confirmPassword) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">两次密码不一致</span>';
                return;
            }

            if (newPassword.length < 6) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">密码至少6位</span>';
                return;
            }

            if (!currentResetUser) {
                msgDiv.innerHTML = '<span style="color: #dc3545;">会话已过期，请重新开始</span>';
                return;
            }

            msgDiv.innerHTML = '<span style="color: #ffd700;">⏳ 正在重置密码...</span>';

            try {
                const hashedPassword = await hashPassword(newPassword);
                currentResetUser.password = hashedPassword;
                currentResetUser.passwordHashed = true;
                delete currentResetUser.resetCode;
                delete currentResetUser.resetCodeExpiry;

                const updatedBody = `用户信息\n\`\`\`json\n${JSON.stringify(currentResetUser, null, 2)}\n\`\`\``;
                await fetch(`https://api.github.com/repos/${window.CONFIG.GITHUB_USERNAME}/${window.CONFIG.GITHUB_REPO}/issues/${currentResetUser.issueNumber}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${window.CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ body: updatedBody })
                });

                msgDiv.innerHTML = '<span style="color: #28a745;">✅ 密码重置成功！正在跳转到登录页...</span>';
                setTimeout(() => {
                    closeForgotModal();
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                console.error('重置失败:', error);
                msgDiv.innerHTML = `<span style="color: #dc3545;">重置失败: ${error.message}</span>`;
            }
        }

        // ===== 回车键支持 =====
        document.getElementById('verifyCodeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyCode();
        });
        document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') resetPassword();
        });

        // ============================================================
        //  页面启动时检查自动登录
        // ============================================================
        setTimeout(() => { checkAndAutoRedirect(); }, 10);

        // ============================================================
        //  PWA Service Worker
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/nflshcchat/sw.js')
                    .then(() => console.log('[PWA] Service Worker 注册成功'))
                    .catch(() => console.log('[PWA] Service Worker 注册失败'));
            });
        }
    </script>
</body>
</html>
