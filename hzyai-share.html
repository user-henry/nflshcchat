<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在前往 HZYAI 对话分享 · chatai.bot.cd</title>
    <meta name="description" content="HZYAI 对话分享已迁移至 chatai.bot.cd，正在自动跳转…">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#ffd700">
    <script>
        // 迁移提示：HZYAI 对话分享页已迁移至 chatai.bot.cd/share.html
        // 保留全部查询参数（如 ?id=xxx）与 hash，确保已发出的分享链接继续可用。
        (function () {
            var TARGET_ORIGIN = 'https://chatai.bot.cd';
            var target = TARGET_ORIGIN + '/share.html' + window.location.search + window.location.hash;
            window.__HZYAI_TARGET__ = target;
            setTimeout(function () { window.location.replace(target); }, 900);
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="1;url=https://chatai.bot.cd/share.html">
    </noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(1200px 700px at 50% -10%, #221d0a 0%, #1a1a2e 45%, #0f0f1a 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow: hidden;
        }
        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: rgba(22, 33, 62, .82);
            border: 1px solid #2a2a3e;
            border-radius: 22px;
            padding: 38px 32px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
            backdrop-filter: blur(14px);
            animation: pop .38s cubic-bezier(.2, .9, .3, 1.15);
        }
        @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
        .logo {
            width: 66px; height: 66px; margin: 0 auto 16px; border-radius: 20px;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 28px rgba(255, 200, 87, .28);
        }
        h1 {
            font-size: 22px; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .sub { font-size: 13.5px; color: #9aa0ae; line-height: 1.7; margin-bottom: 22px; }
        .sub b { color: #ffd700; font-weight: 600; }
        .loader-wrap {
            position: relative; height: 74px; display: flex;
            align-items: center; justify-content: center; margin-bottom: 22px;
        }
        .loader-ring {
            position: absolute; width: 58px; height: 58px; border-radius: 50%;
            animation: hz-rotate 1.8s linear infinite;
        }
        @keyframes hz-rotate {
            0% {
                transform: rotate(90deg);
                box-shadow: 0 6px 14px 0 rgba(255,255,255,.9) inset, 0 14px 22px 0 #ffd700 inset, 0 34px 40px 0 #ffb347 inset;
            }
            50% {
                transform: rotate(270deg);
                box-shadow: 0 6px 14px 0 rgba(255,255,255,.9) inset, 0 14px 10px 0 #ffb347 inset, 0 26px 40px 0 #ffd700 inset;
            }
            100% {
                transform: rotate(450deg);
                box-shadow: 0 6px 14px 0 rgba(255,255,255,.9) inset, 0 14px 22px 0 #ffd700 inset, 0 34px 40px 0 #ffb347 inset;
            }
        }
        .loader-txt { position: relative; display: flex; z-index: 1; }
        .loader-letter {
            display: inline-block; opacity: .35; font-size: 13px; font-weight: 500;
            letter-spacing: 1px; animation: hz-letter 2s infinite;
        }
        .loader-letter:nth-child(1) { animation-delay: 0s; }
        .loader-letter:nth-child(2) { animation-delay: .1s; }
        .loader-letter:nth-child(3) { animation-delay: .2s; }
        .loader-letter:nth-child(4) { animation-delay: .3s; }
        .loader-letter:nth-child(5) { animation-delay: .4s; }
        .loader-letter:nth-child(6) { animation-delay: .5s; }
        .loader-letter:nth-child(7) { animation-delay: .6s; }
        .loader-letter:nth-child(8) { animation-delay: .7s; }
        .loader-letter:nth-child(9) { animation-delay: .8s; }
        .loader-letter:nth-child(10) { animation-delay: .9s; }
        @keyframes hz-letter {
            0%, 100% { opacity: .35; transform: translateY(0); }
            20% { opacity: 1; transform: scale(1.15); color: #ffd700; }
            40% { opacity: .6; transform: translateY(0); }
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px 20px; border-radius: 13px;
            font-size: 14.5px; font-weight: 600; text-decoration: none;
            color: #10131a; background: linear-gradient(135deg, #ffd700, #ffb347);
            box-shadow: 0 10px 26px rgba(255, 200, 87, .26);
            transition: transform .16s, box-shadow .22s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(255, 200, 87, .34); }
        .fallback { margin-top: 14px; font-size: 12px; color: #6f7480; }
        .fallback a { color: #9aa0ae; text-decoration: none; border-bottom: 1px dashed #3a3a4e; }
        .fallback a:hover { color: #ffd700; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🔗</div>
        <h1>对话分享已迁移</h1>
        <p class="sub">
            请稍候，正在打开新的分享页面<br>
            <b>chatai.bot.cd/share.html</b>
        </p>

        <div class="loader-wrap">
            <div class="loader-ring"></div>
            <div class="loader-txt">
                <span class="loader-letter">R</span><span class="loader-letter">e</span><span class="loader-letter">d</span><span class="loader-letter">i</span><span class="loader-letter">r</span><span class="loader-letter">e</span><span class="loader-letter">c</span><span class="loader-letter">t</span><span class="loader-letter">i</span><span class="loader-letter">n</span><span class="loader-letter">g</span>
            </div>
        </div>

        <a class="btn" id="goBtn" href="https://chatai.bot.cd/share.html">立即打开分享页 →</a>
        <p class="fallback">
            没有自动跳转？<a href="https://chatai.bot.cd/share.html">点此手动进入</a>
        </p>
    </div>

    <script>
        (function () {
            var btn = document.getElementById('goBtn');
            if (btn && window.__HZYAI_TARGET__) btn.href = window.__HZYAI_TARGET__;
        })();
    </script>
</body>
</html>
